name = "get-em-billy-relay"
main = "worker.mjs"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

# Lock the relay to your own site (comma separated, no trailing slash). Empty = any page may use it.
[vars]
ALLOWED_ORIGINS = ""

# To serve it from your own domain (the domain must be on Cloudflare), uncomment and edit:
# routes = [{ pattern = "relay.yourdomain.com", custom_domain = true }]
