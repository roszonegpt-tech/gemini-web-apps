<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Get em Billy">
<meta name="theme-color" content="#160c26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Get em Billy</title>
<style>
  :root { --bg: #0c0816; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--bg);
    cursor: crosshair;
    outline: none;
  }
  #netbox[hidden] { display: none; }
  #netbox { position: fixed; inset: 0; background: rgba(12, 8, 22, .9); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 12px; box-sizing: border-box; }
  #netbox, #netbox * { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .nbp { width: min(100%, 440px); max-height: 100%; overflow: auto; background: #160c26; border: 2px solid #34204e; border-radius: 6px; padding: 14px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #ece6d2; box-sizing: border-box; }
  .nbp h2 { margin: 0 0 6px; font-size: 16px; letter-spacing: .12em; color: #f4d860; }
  .nbp p { margin: 0 0 8px; color: #b9b2a2; }
  .nbp label { display: block; margin: 10px 0 4px; color: #f4d860; font-size: 12px; letter-spacing: .06em; }
  .nbp textarea { width: 100%; box-sizing: border-box; height: 76px; resize: none; background: #0c0816; color: #ece6d2; border: 2px solid #34204e; border-radius: 4px; font: 12px ui-monospace, Menlo, Consolas, monospace; padding: 6px; word-break: break-all; }
  .nbp button { font: inherit; background: #34204e; color: #ece6d2; border: 2px solid #4e8f80; border-radius: 4px; padding: 10px 14px; min-height: 44px; margin: 6px 6px 0 0; cursor: pointer; }
  .nbp button:hover:not(:disabled) { background: #4e8f80; color: #160c26; }
  .nbp button:disabled { opacity: .5; }
  .nbp [hidden] { display: none !important; }
  #nbCode { font-size: 46px; letter-spacing: .16em; color: #f4d860; text-align: center; background: #0c0816; border: 2px solid #34204e; border-radius: 4px; padding: 10px 0; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .nbp input { width: 100%; box-sizing: border-box; font: 30px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em; text-align: center; background: #0c0816; color: #ece6d2; border: 2px solid #34204e; border-radius: 4px; padding: 10px; }
  #nbStatus { min-height: 34px; margin: 10px 0 0; color: #f4d860; font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Get em Billy game. Use arrows or WASD and Space or Enter to choose menu options."></canvas></div>
<div id="netbox" hidden role="dialog" aria-label="Play online">
  <div class="nbp">
    <h2 id="nbTitle">ONLINE</h2>
    <p id="nbHelp"></p>
    <div id="nbRoom" hidden>
      <label>YOUR ROOM CODE</label>
      <div id="nbCode" aria-live="polite">------</div>
      <button id="nbCopyCode" type="button">COPY CODE</button>
    </div>
    <div id="nbJoin" hidden>
      <label for="nbNum">ENTER THE 6-DIGIT ROOM CODE</label>
      <input id="nbNum" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="off" placeholder="000 000">
      <button id="nbJoinGo" type="button">JOIN</button>
    </div>
    <div id="nbManual" hidden>
      <label id="nbL1" for="nbOut"></label>
      <textarea id="nbOut" readonly spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      <button id="nbCopy" type="button">COPY</button>
      <button id="nbMake" type="button">MAKE INVITE CODE</button>
      <label id="nbL2" for="nbIn"></label>
      <textarea id="nbIn" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="PASTE HERE"></textarea>
      <button id="nbPaste" type="button">PASTE</button>
      <button id="nbGo" type="button">CONNECT</button>
    </div>
    <p id="nbStatus" role="status"></p>
    <button id="nbMode" type="button">USE LONG CODES INSTEAD</button>
    <button id="nbClose" type="button">CLOSE</button>
  </div>
</div>
<script src="vendor/peerjs.min.js"></script>
<script>
'use strict';

/* =====================================================================
   GET EM BILLY  (formerly Goat Guardian)
   Lo-fi herding game for 1-4 local players (any mix of goat and dog).
   - Adaptive low-res buffer: integer pixel scale, width/height follow the
     screen so the game fills it (portrait or landscape).
   - Smooth follow camera with sub-pixel presentation over scrolling worlds.
   - Restricted 12-colour palette; day -> sunset -> dusk is a per-pixel
     palette swap of every rendered frame.
   - 6-direction sprites (N, S, NE, NW, SE, SW) for every animal.
   - Screens: TITLE, MODE, PLAYERS, OPTIONS, HOWTO, PLAYING, RESULTS, GAMEOVER.
   - All art from pixel matrices, all audio synthesized (Web Audio).
   ===================================================================== */

// ---------------------------------------------------------------------
// Canvases (sizes set by resize())
// ---------------------------------------------------------------------
let W = 160, H = 288, BW = W + 2, BH = H + 2, PIX = 1;
const view = document.getElementById('game');
const vctx = view.getContext('2d');
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { willReadFrequently: true });
const hud = document.createElement('canvas');
const hctx = hud.getContext('2d');
let G = bctx; // current draw target for sprite/text helpers

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}

// ---------------------------------------------------------------------
// Math / RNG
// ---------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rngFn = Math.random;
function rand() { return rngFn(); }
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function len(x, y) { return Math.sqrt(x * x + y * y); }
function damp(rate, dt) { return 1 - Math.exp(-rate * dt); }
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function makeNoise(seed) {
  const r = mulberry32(seed);
  const P = new Float32Array(65536);
  for (let i = 0; i < P.length; i++) P[i] = r();
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = P[((yi & 255) << 8) | (xi & 255)];
    const b = P[((yi & 255) << 8) | ((xi + 1) & 255)];
    const c = P[(((yi + 1) & 255) << 8) | (xi & 255)];
    const d = P[(((yi + 1) & 255) << 8) | ((xi + 1) & 255)];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}

// ---------------------------------------------------------------------
// Restricted palette + time-of-day palette swap
// ---------------------------------------------------------------------
// k ink, i indigo, t teal canopy, s seafoam, g olive ground, h olive shade,
// w wool white, l pale stone, b brown, n tan, r red accent, y yellow accent
const PAL_KEYS = ['k', 'i', 't', 's', 'g', 'h', 'w', 'l', 'b', 'n', 'r', 'y'];
const PAL_DAY = {
  k: '#160c26', i: '#34204e', t: '#2a5f6e', s: '#4e8f80', g: '#9aac5c', h: '#7f9450',
  w: '#ece6d2', l: '#b9b2a2', b: '#8c6a4c', n: '#c8a878', r: '#e04848', y: '#f4d860'
};
const PAL_SUNSET = {
  k: '#1c0a1e', i: '#3a1838', t: '#5e2c58', s: '#84466a', g: '#b87850', h: '#9a5c44',
  w: '#f4d4b0', l: '#c89a80', b: '#7c4030', n: '#d89a68', r: '#ff5a4a', y: '#ffd27a'
};
const PAL_DUSK = {
  k: '#0a0614', i: '#1a1030', t: '#2c2048', s: '#3e3060', g: '#4e4466', h: '#3e3656',
  w: '#a898b8', l: '#786a90', b: '#4a3450', n: '#7a6488', r: '#ff4a6a', y: '#f0d080'
};
const C = PAL_DAY;
const PAL_RGB = {};
for (const k of PAL_KEYS) PAL_RGB[k] = [hexToRgb(PAL_DAY[k]), hexToRgb(PAL_SUNSET[k]), hexToRgb(PAL_DUSK[k])];
function packLE(r, g, b) { return ((b << 16) | (g << 8) | r) >>> 0; }

let remapTable = null;
let remapQ = -1;
// colour-safe mode: swap the red/green-dependent colours for magenta/blue/khaki
const CB_OVERRIDE = [
  { r: '#ff5fd2', t: '#2c4f86', s: '#5b80b6', g: '#b4ad62', h: '#968f50' },
  { r: '#ff7ae0', t: '#3b3076', s: '#6658a0' },
  { r: '#ff6ad8', t: '#262250' }
];
function targetRgb(k, i) {
  if (typeof settings !== 'undefined' && settings.cb && CB_OVERRIDE[i][k]) return hexToRgb(CB_OVERRIDE[i][k]);
  return PAL_RGB[k][i];
}
function paletteColorAt(k, p) {
  const d = targetRgb(k, 0), s = targetRgb(k, 1), n = targetRgb(k, 2);
  if (p <= 0.6) {
    const t = p / 0.6;
    return [0, 1, 2].map(j => Math.round(lerp(d[j], s[j], t)));
  }
  const t = (p - 0.6) / 0.4;
  return [0, 1, 2].map(j => Math.round(lerp(s[j], n[j], t)));
}
function buildRemap(p) {
  const q = Math.round(clamp(p, 0, 1) * 96) + (settings.cb ? 1000 : 0);
  if (q === remapQ && !labColDirty) return;
  remapQ = q; labColDirty = false;
  if (q === 0) { remapTable = null; return; }
  p = (q % 1000) / 96;
  const m = new Map();
  labRemapInto(m, p);
  for (const k of PAL_KEYS) {
    const from = PAL_RGB[k][0];
    const to = paletteColorAt(k, p);
    m.set(packLE(from[0], from[1], from[2]), (0xff000000 | packLE(to[0], to[1], to[2])) >>> 0);
  }
  remapTable = m;
}
function nightAmount() {
  if (isMenu() || state === 'LOADING' || (showcase.on && !showcase.trailer)) return 0;
  return clamp((dayProgress - 0.78) / 0.14, 0, 1);
}
// one pass per frame: palette swap, then fog (palette-coloured) and night darkness
function applyRemap() {
  const fogOn = weather.kind === 'fog' && !isMenu() && state !== 'LOADING';
  const night = nightAmount();
  if (!remapTable && !fogOn && night <= 0) return;
  const img = bctx.getImageData(0, 0, BW, BH);
  const d = new Uint32Array(img.data.buffer);
  if (remapTable) {
    let lastK = -1, lastV = 0;
    for (let i = 0; i < d.length; i++) {
      const k = d[i] & 0xffffff;
      if (k !== lastK) { lastK = k; lastV = remapTable.get(k) || 0; }
      if (lastV) d[i] = lastV;
    }
  }
  if (fogOn || night > 0) {
    const cols = buildVisGrid(fogOn, night);
    const fc = paletteColorAt('l', clamp(dayProgress, 0, 1));
    const fogCol = (0xff000000 | packLE(fc[0], fc[1], fc[2])) >>> 0;
    const darkCol = (0xff000000 | packLE(5, 3, 12)) >>> 0;
    const col = night > 0 ? darkCol : fogCol;
    for (let y = 0; y < BH; y++) {
      const row = ((y / 3) | 0) * cols;
      const wyy = y + OY;
      for (let x = 0; x < BW; x++) {
        const lev = visGrid[row + ((x / 3) | 0)];
        if (lev && ditherOn(lev, x + OX, wyy)) d[y * BW + x] = col;
      }
    }
  }
  bctx.putImageData(img, 0, 0);
}

// ---------------------------------------------------------------------
// Sprites (chunky pixel matrices, palette letters)
// ---------------------------------------------------------------------
function makeSprite(rows) {
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || '.';
      if (!PAL_DAY[ch]) continue;
      const rgb = PAL_RGB[ch][0];
      const i = (y * w + x) * 4;
      img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function transformCanvas(src, flipX, flipY) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.translate(flipX ? src.width : 0, flipY ? src.height : 0);
  g.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  g.drawImage(src, 0, 0);
  return c;
}
function recolor(src, key) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = PAL_DAY[key];
  g.fillRect(0, 0, src.width, src.height);
  return c;
}
function spr(rows) {
  const r = makeSprite(rows);
  const l = transformCanvas(r, true, false);
  return {
    r: r, l: l, ru: transformCanvas(r, false, true), lu: transformCanvas(r, true, true),
    wr: recolor(r, 'w'), wl: recolor(l, 'w'), w: r.width, h: r.height
  };
}
function walkPair(top, a, b) { return [spr(top.concat([a])), spr(top.concat([b]))]; }
function swapRows(rows, map) { return rows.map(r => r.replace(/./g, c => map[c] || c)); }

// Each animal: SE (side, face visible), NE (side, turned away), S (front), N (back).
// NW / SW are mirrored SE / NE, giving 6 facing directions.
const SP = {};
{
  // Sheep
  const sideTop = ['..ww...', '.wwwwkk', 'wwwwwkk', 'wwwwww.', '.llll..'];
  const sideBackTop = ['.....k.', '..wwwkk', '.wwwwwk', 'wwwwwww', '.llll..'];
  const frontTop = ['.wwww.', 'wwwwww', 'wwkkww', 'wwkkww', '.llll.'];
  const backTop = ['..kk..', '.wwww.', 'wwwwww', 'wwwwww', '.llll.'];
  SP.sheep = {
    SE: walkPair(sideTop, '.k..k..', 'k...k..'),
    NE: walkPair(sideBackTop, '.k..k..', 'k...k..'),
    S: walkPair(frontTop, '.k..k.', 'k....k'),
    N: walkPair(backTop, '.k..k.', 'k....k'),
    graze: [spr(['..ww...', '.wwww..', 'wwwwwk.', 'wwwwwkk', '.llll..', '.k..k..']),
      spr(['..ww...', '.wwww..', 'wwwww..', 'wwwwwkk', '.llllk.', '.k..k..'])],
    panic: spr(['..ww.kk', '.wwwwkk', 'wwwwww.', 'wwwwww.', '.llll..', 'k.k..k.'])
  };
  // Hawk (dives from the sky)
  // Lamb (small, quick, jumpy)
  SP.lamb = {
    SE: walkPair(['.ww..', 'wwwkk', 'wwww.', '.ll..'], '.k.k.', 'k..k.'),
    NE: walkPair(['...k.', '.wwkk', 'wwwww', '.ll..'], '.k.k.', 'k..k.'),
    S: walkPair(['.ww.', 'wkkw', 'wwww', '.ll.'], 'k..k', '.kk.'),
    N: walkPair(['.kk.', 'wwww', 'wwww', '.ll.'], 'k..k', '.kk.')
  };
  // Ambient birds (harmless): small flock birds and a big gliding heron
  SP.birdUp = spr(['i...i', '.i.i.', '..k..']);
  SP.birdDown = spr(['.....', 'iikii', 'i...i']);
  SP.heronUp = spr(['ii...........ii', '.iii.......iii.', '...iiikkkiii...', '......kk.k.....']);
  SP.heronDown = spr(['......kk.......', '..iiiikkkiiii..', '.ii.........ii.', 'i.............i']);
  SP.pillar = spr(['llllll', 'wwwwwl', '.wwwl.', '.wwwl.', '.wlwl.', '.wwll.', '.wwwl.', '.wwwl.',
    '.wwwl.', '.lwwl.', '.wwwl.', 'lwwwwl', 'llllll']);
  SP.pillarBroken = spr(['..w...', '.wwl..', '.wwwl.', '.wlwl.', '.wwwl.', '.wwll.', 'lwwwwl', 'llllll']);
  SP.pinGoal = spr(['.rrr.', 'rrwrr', 'rrrrr', '.rrr.', '..r..', '..k..']);
  SP.pinStart = spr(['.lll.', 'llwll', 'lllll', '.lll.', '..l..', '..k..']);
}

// Recolour a whole sprite set (used for sheep types and unlockable looks)
function recolorPair(pair, map) {
  const src = pair.r;
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  const img = g.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  const lut = {};
  for (const k in map) { const a = PAL_RGB[k][0], b = PAL_RGB[map[k]][0]; lut[a[0] + ',' + a[1] + ',' + a[2]] = b; }
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const t = lut[d[i] + ',' + d[i + 1] + ',' + d[i + 2]];
    if (t) { d[i] = t[0]; d[i + 1] = t[1]; d[i + 2] = t[2]; }
  }
  g.putImageData(img, 0, 0);
  const l = transformCanvas(c, true, false);
  return { r: c, l: l, ru: transformCanvas(c, false, true), lu: transformCanvas(c, true, true), wr: recolor(c, 'w'), wl: recolor(l, 'w'), w: c.width, h: c.height };
}
function recolorSet(set, map) {
  if (Array.isArray(set)) return set.map(x => recolorSet(x, map));
  if (set && set.r && set.l && set.w !== undefined) return recolorPair(set, map);
  const out = {};
  for (const k in set) out[k] = recolorSet(set[k], map);
  return out;
}
SP.goldSheep = recolorSet(SP.sheep, { w: 'y', l: 'n' });
SP.ramSheep = recolorSet(SP.sheep, { w: 'l', l: 'h', k: 'b' });
// ---------------------------------------------------------------------
// Animal art data: imported from Rusty Lab v0.13.1 (goat, wolf, fox and the
// ten farm dogs), plus the lab's hats, hair, outfits, accessories and
// colour sets. Goat colourways 10-11 (Toggenburg, Oberhasli) were added here.

function drawTextRaw(str, x, y, col, s) {

    const g = FONT[str[i]];

    const t = music.nextT, st = music.step % 32;

    const ln = th.lead[st];
    if (ln) musicNote(th.wave, ln, t, stepDur * 1.8, 0.05, 2200);
    if (st % 4 === 0) musicNote('triangle', root - 12, t, stepDur * 3, 0.12);
    else if (st % 4 === 2) musicNote('triangle', root - 5, t, stepDur * 1.5, 0.08);
    if (st % 8 === 4 && music.theme !== 'night') musicNote('square', root + 12 + 4, t, stepDur * 1.2, 0.025, 1500);
    if (st % 2 === 0 && noiseBuf) {
      const src = AC.createBufferSource(); src.buffer = noiseBuf;
      const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
      const g = AC.createGain();
      g.gain.setValueAtTime(st % 4 === 0 ? 0.04 : 0.02, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      src.connect(f); f.connect(g); g.connect(musicBus);
      src.start(t, Math.random() * 0.5); src.stop(t + 0.05);
    }
    music.nextT += stepDur;
    music.step++;
  }
}

function fsSupported() {
  const d = document.documentElement;
  if (!(d.requestFullscreen || d.webkitRequestFullscreen)) return false;
  if (document.fullscreenEnabled === false) return false;
  if (document.fullscreenEnabled === undefined && document.webkitFullscreenEnabled === false) return false;
  return true;
}
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFs() {
  const d = document.documentElement;
  try {
    const p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* refused */ }
}
function exitFs() {
  try {
    const f = document.exitFullscreen || document.webkitExitFullscreen;
    if (f) { const p = f.call(document); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* ignore */ }
}
function toggleFs() {
  if (!fsSupported()) return;
  if (isFs()) { exitFs(); settings.fullscreen = false; }
  else { enterFs(); settings.fullscreen = true; }
  saveSettings();
  SFX.click();
}
function autoFs() { if (settings.fullscreen && fsSupported() && !isFs()) enterFs(); }

// ---------------------------------------------------------------------
// Worlds (procedural maps with a forest mask)
// mask: 0 meadow, 1 forest canopy, 2 solid structure
// ---------------------------------------------------------------------
const WORLD_W = 600;
let world = null;

function newWorld(w, h, seed, kind) {
  return {
    w: w, h: h, kind: kind, seed: seed,
    mask: new Uint8Array(w * h).fill(1),
    rng: mulberry32(seed), noise: makeNoise(seed),
    pillars: [], start: null, goal: null, goalR: 26, path: [], canvas: null, bridges: []
  };
}
function maskAt(x, y) {
  x = x | 0; y = y | 0;
  if (x < 0 || y < 0 || x >= world.w || y >= world.h) return 1;
  return world.mask[y * world.w + x];
}
// mask: 0 meadow, 1 forest, 2 pillar, 3 shallow ford, 4 deep water, 5 brambles
function blocked(x, y) { const m = maskAt(x, y); return m === 1 || m === 2 || m === 4; }
function terrainSlow(x, y) { const m = maskAt(x, y); return m === 3 ? 0.55 : (m === 5 ? 0.5 : 1); }
function canopy(x, y) { return maskAt(x, y) === 1; }

function stamp(wd, cx, cy, r, rough, val) {
  const pad = Math.ceil(rough) + 2;
  const x0 = Math.max(0, Math.floor(cx - r - pad)), x1 = Math.min(wd.w - 1, Math.ceil(cx + r + pad));
  const y0 = Math.max(0, Math.floor(cy - r - pad)), y1 = Math.min(wd.h - 1, Math.ceil(cy + r + pad));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x - cx, y - cy);
      const n = wd.noise(x * 0.09, y * 0.09) - 0.5;
      if (d < r + n * rough * 2) wd.mask[y * wd.w + x] = val;
    }
  }
}
function borderForest(wd, b) {
  for (let y = 0; y < wd.h; y++) for (let x = 0; x < wd.w; x++) {
    if (x < b || y < b || x >= wd.w - b || y >= wd.h - b) wd.mask[y * wd.w + x] = 1;
  }
}
function minPathDist(wd, x, y) {
  let m = 1e9;
  for (let i = 0; i < wd.path.length; i += 2) {
    const p = wd.path[i];
    const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if (d < m) m = d;
  }
  return Math.sqrt(m);
}
function clearAround(wd, x, y, r) {
  for (let yy = Math.floor(y - r); yy <= y + r; yy++) for (let xx = Math.floor(x - r); xx <= x + r; xx++) {
    if (xx < 0 || yy < 0 || xx >= wd.w || yy >= wd.h) return false;
    if (wd.mask[yy * wd.w + xx] !== 0) return false;
  }
  return true;
}
function addPillar(wd, x, y, broken) {
  x = Math.round(x); y = Math.round(y);
  wd.pillars.push({ x: x, y: y, broken: !!broken });
  for (let yy = y - 2; yy <= y; yy++) for (let xx = x - 3; xx <= x + 2; xx++) {
    if (xx >= 0 && yy >= 0 && xx < wd.w && yy < wd.h) wd.mask[yy * wd.w + xx] = 2;
  }
}

function makeDefendWorld(seed) {
  const wd = newWorld(WORLD_W, 460, seed, 'defend');
  const r = wd.rng;
  const cx = WORLD_W / 2, cy = 232;
  for (let a = 0; a < Math.PI * 2; a += 0.1) {
    const rad = 90 + r() * 30;
    stamp(wd, cx + Math.cos(a) * 110, cy + Math.sin(a) * 92, rad * 0.62, 10, 0);
  }
  stamp(wd, cx, cy, 115, 12, 0);
  for (let k = 0; k < 7; k++) {
    for (let tries = 0; tries < 30; tries++) {
      const a = r() * Math.PI * 2, d = 110 + r() * 60;
      const x = cx + Math.cos(a) * d * 1.3, y = cy + Math.sin(a) * d * 0.9;
      if (x < 40 || x > WORLD_W - 40 || y < 50 || y > wd.h - 50) continue;
      stamp(wd, x, y, 10 + r() * 9, 5, 1);
      break;
    }
  }
  borderForest(wd, 8);
  for (let k = 0; k < 7; k++) {
    const a = (k / 7) * Math.PI * 2 + 0.3;
    addPillar(wd, cx + Math.cos(a) * 52, cy + Math.sin(a) * 40, k % 3 === 2);
  }
  wd.start = { x: cx, y: cy };
  return wd;
}

function makeEscortWorld(n, seed) {
  const h = Math.min(1700, 760 + 150 * Math.min(n, 6));
  const wd = newWorld(WORLD_W, h, seed, 'escort');
  const r = wd.rng;
  const pts = [];
  let x = WORLD_W / 2 + (r() - 0.5) * 160, y = h - 56;
  pts.push({ x: x, y: y });
  while (y > 190) {
    y -= 120 + r() * 50;
    x = clamp(x + (r() - 0.5) * 260, 90, WORLD_W - 90);
    pts.push({ x: x, y: y });
  }
  pts.push({ x: clamp(x + (r() - 0.5) * 140, 100, WORLD_W - 100), y: 56 });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const L = Math.hypot(b.x - a.x, b.y - a.y);
    for (let t = 0; t < L; t += 3) wd.path.push({ x: lerp(a.x, b.x, t / L), y: lerp(a.y, b.y, t / L) });
  }
  wd.path.push(pts[pts.length - 1]);
  const ph = r() * 10;
  for (let i = 0; i < wd.path.length; i += 2) {
    const p = wd.path[i];
    const rad = 42 + 12 * Math.sin(i * 0.05 + ph) + 8 * Math.sin(i * 0.13 + ph * 2);
    stamp(wd, p.x, p.y, rad, 8, 0);
  }
  for (let k = 0; k < 10 + n * 2; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const a = r() * Math.PI * 2;
    stamp(wd, p.x + Math.cos(a) * 60, p.y + Math.sin(a) * 34, 22 + r() * 22, 8, 0);
  }
  stamp(wd, pts[0].x, pts[0].y, 58, 6, 0);
  stamp(wd, pts[pts.length - 1].x, pts[pts.length - 1].y, 56, 6, 0);
  for (let k = 0; k < 40 + n * 8; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const rad = 7 + r() * 11;
    const ix = p.x + (r() - 0.5) * 160, iy = p.y + (r() - 0.5) * 70;
    if (minPathDist(wd, ix, iy) < rad + 20) continue;
    if (Math.hypot(ix - pts[0].x, iy - pts[0].y) < 70) continue;
    if (Math.hypot(ix - pts[pts.length - 1].x, iy - pts[pts.length - 1].y) < 70) continue;
    stamp(wd, ix, iy, rad, 4, 1);
  }
  borderForest(wd, 8);
  for (let i = 40; i < wd.path.length - 40; i += 70 + Math.floor(r() * 40)) {
    const p = wd.path[i], q = wd.path[Math.min(wd.path.length - 1, i + 3)];
    const dx = q.x - p.x, dy = q.y - p.y;
    const l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    for (const sgn of [-1, 1]) {
      const gx = p.x + nx * 24 * sgn, gy = p.y + ny * 24 * sgn;
      if (clearAround(wd, gx, gy, 5)) addPillar(wd, gx, gy, r() < 0.3);
    }
  }
  for (let k = 0; k < 4 + n; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const gx = p.x + (r() - 0.5) * 100, gy = p.y + (r() - 0.5) * 50;
    if (minPathDist(wd, gx, gy) > 14 && clearAround(wd, gx, gy, 6)) addPillar(wd, gx, gy, r() < 0.5);
  }
  wd.start = { x: pts[0].x, y: pts[0].y };
  wd.goal = { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y };
  return wd;
}

function renderWorld(wd) {
  const w = wd.w, h = wd.h, m = wd.mask;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const d32 = new Uint32Array(img.data.buffer);
  const P = {};
  for (const k of PAL_KEYS) { const v = PAL_RGB[k][0]; P[k] = (0xff000000 | packLE(v[0], v[1], v[2])) >>> 0; }
  // distance inside the forest to the nearest meadow pixel (lets crowns bulge past the edge)
  const dist = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) dist[i] = m[i] === 1 ? 1e6 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (!dist[i]) continue;
    let d = dist[i];
    if (x > 0) d = Math.min(d, dist[i - 1] + 1);
    if (y > 0) {
      d = Math.min(d, dist[i - w] + 1);
      if (x > 0) d = Math.min(d, dist[i - w - 1] + 1.41);
      if (x < w - 1) d = Math.min(d, dist[i - w + 1] + 1.41);
    }
    dist[i] = d;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x;
    if (!dist[i]) continue;
    let d = dist[i];
    if (x < w - 1) d = Math.min(d, dist[i + 1] + 1);
    if (y < h - 1) {
      d = Math.min(d, dist[i + w] + 1);
      if (x < w - 1) d = Math.min(d, dist[i + w + 1] + 1.41);
      if (x > 0) d = Math.min(d, dist[i + w - 1] + 1.41);
    }
    dist[i] = d;
  }
  // rounded tree crowns, painted top to bottom so lower crowns overlap upper ones
  const vis = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) vis[i] = m[i] === 1 ? 1 : 0;
  const crownCol = new Uint32Array(w * h);
  const crowns = [];
  for (let gy = 0; gy < h; gy += 9) for (let gx = 0; gx < w; gx += 10) {
    const cx = Math.floor(gx + hash2(gx, gy) * 9), cy = Math.floor(gy + hash2(gy + 3, gx) * 8);
    if (cx >= w || cy >= h || m[cy * w + cx] !== 1) continue;
    const R = Math.min(5 + hash2(cx, cy) * 4, dist[cy * w + cx] + 3);
    if (R >= 3) crowns.push({ x: cx, y: cy, r: R });
  }
  crowns.sort((a, b) => a.y - b.y);
  for (const cr of crowns) {
    const R = cr.r;
    for (let dy = -Math.ceil(R); dy <= Math.ceil(R); dy++) for (let dx = -Math.ceil(R); dx <= Math.ceil(R); dx++) {
      const x = cr.x + dx, y = cr.y + dy;
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.sqrt(dx * dx + dy * dy * 1.2);
      if (d > R) continue;
      const i = y * w + x;
      vis[i] = 1;
      let col = P.t;
      if (d > R - 1.3) col = dy > -R * 0.25 ? P.i : (hash2(x, y) < 0.45 ? P.s : P.t);
      else if ((dx * 0.4 + dy * 0.9) / R > 0.5 && ((x + y) & 1)) col = P.i;
      crownCol[i] = col;
    }
  }
  const can = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? true : vis[y * w + x] === 1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (vis[i] === 1) {
        let below = 0;
        for (let dd = 1; dd <= 3; dd++) if (!can(x, y + dd)) { below = dd; break; }
        let col = crownCol[i] || P.t;
        if (below === 1 || below === 2) col = P.i;
        else if (below === 3 && ((x + y) & 1)) col = P.i;
        d32[i] = col;
      } else if (m[i] === 4) {
        // deep water: teal with seafoam ripples, dark bank on the upper edge
        const top = y > 0 && m[i - w] !== 4 && m[i - w] !== 3;
        d32[i] = top ? P.i : (hash2(x >> 2, y) < 0.1 || (hash2(x >> 3, y + 5) < 0.05) ? P.s : P.t);
      } else if (m[i] === 3) {
        // shallow ford: seafoam with ripples and stepping stones
        const hh = hash2(x, y);
        d32[i] = hh < 0.05 ? P.w : (hh < 0.08 ? P.l : P.s);
      } else if (m[i] === 5) {
        // brambles: tangled dark thorns with red berries
        const hh = hash2(x * 3, y * 7);
        d32[i] = hh < 0.05 ? P.r : (((x + y * 2) % 3 === 0 || hh < 0.3) ? P.i : P.h);
      } else {
        let up = 0;
        for (let dd = 1; dd <= 10; dd++) if (can(x, y - dd)) { up = dd; break; }
        const side = can(x - 1, y) || can(x + 1, y) || can(x - 2, y) || can(x + 2, y) ||
          can(x, y + 1) || can(x - 1, y + 1) || can(x + 1, y + 1);
        const trunk = hash2(x, 7) < 0.2;
        let col = P.g;
        if (up && up <= 3) col = P.i;
        else if (up && up <= 8) col = (trunk && up <= 7) ? P.i : P.s;
        else if (up >= 9 && ((x + y) & 1)) col = P.s;
        else if (side) col = P.s;
        d32[i] = col;
      }
    }
  }
  // canopy texture marks ("v" and "^" leaf clusters)
  for (let y = 2; y < h - 4; y += 3) {
    for (let x = 1; x < w - 4; x += 4) {
      const hx = x + Math.floor(hash2(x, y) * 3), hy = y + Math.floor(hash2(y, x) * 2);
      if (!(can(hx, hy) && can(hx + 2, hy) && can(hx + 1, hy + 1) && can(hx + 1, hy + 3) && can(hx + 1, hy - 1))) continue;
      if (hash2(hx * 3, hy * 5) < 0.45) continue;
      if (d32[hy * w + hx] !== P.t || d32[hy * w + hx + 2] !== P.t) continue;
      const v = hash2(hx, hy * 7) < 0.6;
      d32[hy * w + hx] = P.i;
      d32[hy * w + hx + 2] = P.i;
      d32[(hy + (v ? 1 : -1)) * w + hx + 1] = P.i;
      if (hash2(hx + 11, hy) < 0.12) d32[(hy - 1) * w + hx + 3] = P.s;
    }
  }
  // sparse ground specks
  for (let k = 0; k < (w * h) / 260; k++) {
    const x = Math.floor(wd.rng() * (w - 6)), y = Math.floor(wd.rng() * h);
    const i = y * w + x;
    if (d32[i] !== P.g || d32[i + 2] !== P.g || d32[i + 4] !== P.g) continue;
    const t = wd.rng();
    if (t < 0.8) { d32[i] = P.h; d32[i + 2] = P.h; if (wd.rng() < 0.6) d32[i + 4] = P.h; }
    else if (t < 0.9) d32[i] = P.n;
    else if (t < 0.96) d32[i] = P.w;
    else d32[i] = P.y;
  }
  for (const p of wd.pillars) {
    for (let k = 0; k < 6; k++) {
      const sx = p.x + 2 + k, sy = p.y - 1 + Math.floor(k / 2);
      for (let q = 0; q < 2; q++) {
        const yy = sy + q;
        if (sx < w && yy < h && d32[yy * w + sx] === P.g) d32[yy * w + sx] = P.h;
      }
    }
  }
  if (wd.goal) {
    const R = wd.goalR;
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const xx = Math.round(wd.goal.x + Math.cos(a) * R), yy = Math.round(wd.goal.y + Math.sin(a) * R * 0.8);
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && ((xx + yy) & 1)) d32[yy * w + xx] = P.h;
    }
  }
  if (wd.start && wd.kind === 'escort') {
    for (let a = 0; a < Math.PI * 2; a += 0.05) {
      const xx = Math.round(wd.start.x + Math.cos(a) * 14), yy = Math.round(wd.start.y + Math.sin(a) * 10);
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && ((xx + yy) & 1) === 0) d32[yy * w + xx] = P.h;
    }
  }
  g.putImageData(img, 0, 0);
  for (const b of wd.bridges) {
    g.fillStyle = C.b; g.fillRect(b.x, b.y, b.w, b.h);
    g.fillStyle = C.n;
    for (let y = b.y + 1; y < b.y + b.h; y += 3) g.fillRect(b.x + 1, y, b.w - 2, 1);
    g.fillStyle = C.k; g.fillRect(b.x, b.y, 1, b.h); g.fillRect(b.x + b.w - 1, b.y, 1, b.h);
    g.fillStyle = C.i; g.fillRect(b.x, b.y + b.h, b.w, 1);
  }
  if (wd.goal) {
    for (let k = 0; k < 18; k++) {
      const a = (k / 18) * Math.PI * 2;
      if (Math.abs(a - Math.PI / 2) < 0.5) continue;
      const xx = Math.round(wd.goal.x + Math.cos(a) * wd.goalR), yy = Math.round(wd.goal.y + Math.sin(a) * wd.goalR * 0.8);
      g.fillStyle = C.b; g.fillRect(xx, yy - 3, 1, 3);
      g.fillStyle = C.n; g.fillRect(xx, yy - 4, 1, 1);
    }
  }
  wd.canvas = c;
  return wd;
}

function aiWolf(p, dt) {

  }

  aiVec[p.dev] = { x: dx / l, y: dy / l };
  if (d < 26 && p.cd <= 0) { p.fx = dx / l; p.fy = dy / l; wolfLunge(p); }

function steerVec(p, tx, ty) {

function aiDogSkill(p, b, near, d, far, farD, hc, ahead) {

  switch (b.ability) {
    case 'whistle':
      if (ahead && !near && farD > 40 && len(hc.x - p.x, hc.y - p.y) < 70 && rand() < 0.02) playerAbility(p);
      break;
    case 'gather':
      if (!near && farD > 46 && len(hc.x - p.x, hc.y - p.y) < 30) playerAbility(p);
      break;
    case 'nip': case 'bitedash':
      if (near && d < 34 && (near.alt || 0) < 12) { face(near); playerAbility(p); }
      break;
    case 'takedown':
      if (near && d < 70 && (near.alt || 0) < 12) playerAbility(p);
      break;
    case 'sprint':
      if ((near && d > 50 && d < 150) || (!near && farD > 60)) playerAbility(p);
      break;
    case 'frenzy':
      if (foesIn(BARK_RADIUS - 6).length) playerAbility(p);

const STORY = [
  ['THE HIGH MEADOWS WERE QUIET.', 'THE FLOCK GRAZED IN THE SUN.'],
  ['BUT SHADOWS GATHERED IN THE WOODS,', 'AND HUNGRY EYES WATCHED THE FLOCK.'],
  ['AN OLD GOAT KNEW EVERY TRAIL.', 'A YOUNG DOG KNEW EVERY SHEEP.'],
  ['TOGETHER THEY WOULD BRING', 'EVERY SHEEP HOME BY NIGHTFALL.']

let storyPage = 0, storyThen = 'MODE';

function storyEvent(ev) {

  if (ev.type === 'action' || ev.type === 'tap' || ev.type === 'right') {
    storyPage++; SFX.click();

  } else if (ev.type === 'left' && storyPage > 0) { storyPage--; SFX.move(); }
}
function endStory() { settings.storySeen = true; saveSettings(); goScreen(storyThen); }
function drawStory() {
  rect(0, 0, W, H, 'k');

  const bx = Math.round(W / 2 - bw / 2), by = Math.round(H * 0.18);

  const k = 2;
  const ground = (col) => { rect(bx, by, bw, bh, col); };
  const put = (sp, x, y, left) => G.drawImage(left ? sp.l : sp.r, 0, 0, sp.w, sp.h, Math.round(x - sp.w * k / 2), Math.round(y - sp.h * k), sp.w * k, sp.h * k);

    ground('g');

  } else if (storyPage === 1) {
    ground('t');

    }

    ground('g');

  } else {
    ground('h');

  for (let i = 0; i < STORY.length; i++) rect(W / 2 - STORY.length * 4 + i * 8, by + bh + 38, 5, 3, i === storyPage ? 'y' : 'i');

}

// ---------------------------------------------------------------------
// Online play: one player hosts, friends join. The host runs the whole
// game; guests send their controls and draw the state the host sends
// (about 20 snapshots a second). Connections are WebRTC data channels.
// There is no server: the two players swap short codes (copy and paste)
// to link up, and a public STUN server only helps them find each other.
// ---------------------------------------------------------------------
const NET_ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
const NET_PF = ['x', 'y', 'vx', 'vy', 'fx', 'fy', 'ramT', 'actT', 'actT2', 'dashT', 'lungeT', 'down', 'revive', 'stun', 'carry', 'cd', 'cdMax', 'cd2', 'cd2Max'];
const netLog = (s) => { net.log.push((performance.now() / 1000).toFixed(2) + ' ' + s); if (net.log.length > 60) net.log.shift(); };
const NET_R = (v, n) => { const k = n === 2 ? 100 : 10; return Math.round((v || 0) * k) / k; };
const netNum = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
function isMine(p) {
  if (net.role === 'off') return !p.dev.startsWith('ai');
  if (net.role === 'host') return !p.net && !p.dev.startsWith('ai');
  return p.slot === net.slot;
}

// ---- codes: the session description, deflated and made URL-safe
async function netPack(desc) {
  const raw = new TextEncoder().encode(JSON.stringify({ t: desc.type === 'offer' ? 'o' : 'a', s: desc.sdp, v: NET_VER }));
  let bytes = raw, tag = 'GEB0.';
  if (typeof CompressionStream !== 'undefined') {
    try {
      const cs = new CompressionStream('deflate-raw'), w = cs.writable.getWriter();
      w.write(raw); w.close();
      bytes = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      tag = 'GEB1.';
    } catch (e) { bytes = raw; tag = 'GEB0.'; }
  }
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return tag + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function netUnpack(code) {
  code = String(code || '').replace(/\s+/g, '');
  const m = /^GEB([01])\.([A-Za-z0-9_-]+)$/.exec(code);
  if (!m) throw new Error('THAT IS NOT A GAME CODE');
  const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  let bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (m[1] === '1') {
    const ds = new DecompressionStream('deflate-raw'), w = ds.writable.getWriter();
    w.write(bytes); w.close();
    bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if (!o || typeof o.s !== 'string') throw new Error('THAT CODE IS DAMAGED');
  if (o.v !== NET_VER) throw new Error('DIFFERENT GAME VERSION (V' + o.v + ')');
  return o;
}
function netGather(pc, ms) {
  return new Promise((res) => {
    if (pc.iceGatheringState === 'complete') { res(); return; }
    let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') fin(); });
    setTimeout(fin, ms || 3000);
  });
}
function netSendCh(ch, type, data) {
  if (!ch || ch.readyState !== 'open') return;
  try { ch.send(JSON.stringify({ t: type, d: data })); } catch (e) { /* closed */ }
}
function netBroadcast(type, data, unreliable) {
  for (const p of net.peers) netSendCh(unreliable ? p.uns : p.rel, type, data);
}

// ---- host: invite a friend (offer) and accept their reply (answer)
function netStartHost() {
  if (net.role === 'client') return;
  net.role = 'host';
}
// one connection offer for one friend (each friend needs their own)
async function netMakeOffer() {
  const pc = new RTCPeerConnection(NET_ICE);
  const peer = { id: ++net.idc, pc: pc, rel: pc.createDataChannel('r', { ordered: true }), uns: pc.createDataChannel('u', { ordered: false, maxRetransmits: 0 }),
    joined: false, input: { x: 0, y: 0 }, lastIn: 0, slot: -1, t0: realTime, inQ: -1 };
  const onMsg = (ev) => { let m = null; try { m = JSON.parse(ev.data); } catch (e) { return; } netHostMsg(peer, m); };
  peer.rel.onmessage = onMsg; peer.uns.onmessage = onMsg;
  peer.rel.onopen = () => netLog('host peer ' + peer.id + ' channel open');
  peer.rel.onclose = () => { netLog('host peer ' + peer.id + ' channel closed'); netPeerGone(peer); };
  pc.onconnectionstatechange = () => { const st = pc.connectionState; netLog('host peer ' + peer.id + ' ' + st); if (st === 'failed' || st === 'closed') netPeerGone(peer); };
  await pc.setLocalDescription(await pc.createOffer());
  await netGather(pc, 3000);
  return { peer: peer, code: await netPack(pc.localDescription) };
}
async function netHostInvite() {
  netStartHost();
  if (net.pending) { try { net.pending.pc.close(); } catch (e) { /* ignore */ } net.pending = null; }
  if (net.peers.length >= 3) throw new Error('THE ROOM IS FULL (4 PLAYERS)');
  const o = await netMakeOffer();
  net.pending = o.peer;
  return o.code;
}
async function netHostAccept(code) {
  const d = await netUnpack(code);
  if (d.t !== 'a') throw new Error('THAT IS AN INVITE, PASTE THE REPLY');
  const peer = net.pending;
  if (!peer) throw new Error('MAKE AN INVITE CODE FIRST');
  await peer.pc.setRemoteDescription({ type: 'answer', sdp: d.s });
}
// ---- 6-digit room codes through PeerJS: the code is the host's PeerJS id, friends connect to it directly
function netRoomsAvailable() { return typeof Peer !== 'undefined'; }
const netFmtCode = (c) => c.slice(0, 3) + ' ' + c.slice(3);
function netPeerOpts() {
  const o = { debug: 0, pingInterval: 4000 };         // default: the free PeerJS cloud broker (with its STUN and TURN servers)
  const u = String(settings.peer || NET_PEER || '').trim();
  if (u) {
    try {
      const x = new URL(u);
      o.host = x.hostname; o.secure = x.protocol === 'https:'; o.port = +x.port || (o.secure ? 443 : 80); o.path = x.pathname || '/';
    } catch (e) { /* a bad address: use the default broker */ }
  }

}
function netPeerError(e) {
  const t = e && e.type;
  if (t === 'peer-unavailable') return new Error('NO ROOM WITH THAT CODE');
  if (t === 'browser-incompatible') return new Error('THIS BROWSER CANNOT PLAY ONLINE');
  if (t === 'webrtc') return new Error('THE CONNECTION FAILED');
  if (t === 'unavailable-id') return new Error('THAT ROOM CODE IS TAKEN');
  if (t === 'timeout' || t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed' || t === 'invalid-key') return new Error('CANNOT REACH THE ROOM SERVER');

// a PeerJS connection wearing the same few methods as a WebRTC data channel, so the game's messages don't care which is used
class NetCh {
  constructor(conn) {
    this.conn = conn; this.label = conn.metadata && conn.metadata.ch || ''; this.closed = false;
    this.onmessage = null; this.onopen = null; this.onclose = null;
    conn.on('data', (d) => { if (this.onmessage && typeof d === 'string') this.onmessage({ data: d }); });
    conn.on('open', () => { if (this.onopen) this.onopen(); });
    conn.on('close', () => { this.closed = true; if (this.onclose) this.onclose(); });
    conn.on('error', (e) => netLog('connection error ' + (e && e.type)));
  }
  get readyState() { return this.closed ? 'closed' : (this.conn.open ? 'open' : 'connecting'); }
  send(t) { this.conn.send(t); }
  close() { this.closed = true; try { this.conn.close(); } catch (e) { /* closed */ } }
}
// open a PeerJS peer (with an id for a room, without one for a guest) and wait until the broker accepts it
function netOpenPeer(id) {
  return new Promise((res, rej) => {
    let done = false, p;
    try { p = id ? new Peer(id, netPeerOpts()) : new Peer(netPeerOpts()); } catch (e) { rej(netPeerError({ type: 'browser-incompatible' })); return; }
    const to = setTimeout(() => { if (!done) { done = true; try { p.destroy(); } catch (e) { /* ignore */ } rej(netPeerError({ type: 'timeout' })); } }, 10000);
    p.on('open', () => { if (!done) { done = true; clearTimeout(to); res(p); } });
    p.on('error', (e) => { netLog('peer error ' + (e && e.type)); if (!done) { done = true; clearTimeout(to); try { p.destroy(); } catch (er) { /* ignore */ } rej(e); } });
  });
}
async function netRoomEnsure() {
  netStartHost();
  if (net.room && net.room.open) return net.room;
  if (!netRoomsAvailable()) throw new Error('THE ONLINE LIBRARY DID NOT LOAD');
  let lastErr = null;
  for (let i = 0; i < 8; i++) {
    const code = String(100000 + Math.floor(Math.random() * 900000));
    let peer;
    try { peer = await netOpenPeer(NET_PREFIX + code); } catch (e) { lastErr = e; if (e && e.type === 'unavailable-id') continue; throw netPeerError(e); }
    const R = { code: code, peer: peer, open: true, peers: new Map() };
    net.room = R;
    peer.on('connection', (conn) => netRoomConn(R, conn));
    peer.on('disconnected', () => { if (R.open) { try { peer.reconnect(); } catch (e) { /* retry on the next tick */ } } });
    peer.on('error', (e) => netLog('room error ' + (e && e.type)));
    netLog('room ' + code + ' open');
    return R;
  }
  throw netPeerError(lastErr || {});
}
function netRoomClose() {
  const R = net.room;
  net.room = null;
  if (!R) return;
  R.open = false;
  for (const po of R.peers.values()) { try { po.pc.close(); } catch (e) { /* ignore */ } }
  R.peers.clear();
  try { R.peer.destroy(); } catch (e) { /* ignore */ }
}
// a friend's connections arrive one by one (reliable 'r', unordered 'u'); gather them under one record
function netRoomConn(R, conn) {
  const meta = conn.metadata || {}, gid = String(meta.gid || ''), kind = meta.ch;
  if (!/^[0-9a-f]{8,32}$/.test(gid) || (kind !== 'r' && kind !== 'u')) { try { conn.close(); } catch (e) { /* ignore */ } return; }
  let po = R.peers.get(gid);
  if (!po) {
    po = { id: ++net.idc, gid: gid, joined: false, input: { x: 0, y: 0 }, lastIn: realTime, slot: -1, t0: realTime, rel: null, uns: null, inQ: -1,
      pc: { close() { if (po.rel) po.rel.close(); if (po.uns) po.uns.close(); } } };
    R.peers.set(gid, po);
  }
  const ch = new NetCh(conn);
  ch.onmessage = (ev) => { let m = null; try { m = JSON.parse(ev.data); } catch (e) { return; } netHostMsg(po, m); };
  if (kind === 'r') { po.rel = ch; ch.onclose = () => { netLog('friend ' + po.id + ' channel closed'); netPeerGone(po); }; } else po.uns = ch;
  netLog('host got ' + kind + ' connection from ' + po.id);
}
async function netRoomJoin(text) {

  if (net.role === 'host') throw new Error('YOU ARE HOSTING RIGHT NOW');

    o.tx += o.vx * dt; o.ty += o.vy * dt;
    const dx = o.tx - o.x, dy = o.ty - o.y;
    if (dx * dx + dy * dy > 1600) { o.x = o.tx; o.y = o.ty; } else { o.x += dx * k; o.y += dy * k; }
  };
  for (const s of sheep) { adv(s); s.walk += len(s.vx, s.vy) * dt; s.chew += dt; if (s.flash > 0) s.flash -= dt; }
  for (const e of enemies) { adv(e); e.anim += dt; stepGait(e, dt, 48, 34); if (e.flash > 0) e.flash -= dt; if (e.state === 'launched' && e.t > 0) e.t -= dt; }
  for (const p of players) {
    adv(p);
    p.walk += len(p.vx, p.vy) * dt;
    stepGait(p, dt, 58, 42);
    const sp = len(p.vx, p.vy);
    if (sp < 4 && !(p.actT > 0) && !(p.dashT > 0)) p.idleT = (p.idleT || 0) + dt; else p.idleT = 0;
    if (sp > 4 && sp < 16) p.slowT = (p.slowT || 0) + dt; else p.slowT = 0;
    for (const t of ['ramT', 'actT', 'actT2', 'dashT', 'lungeT', 'stun', 'cd', 'cd2']) if (p[t] > 0) p[t] = Math.max(0, p[t] - dt);
  }
  updateParticles(dt); updateFireflies(dt); updateWeather(dt); updateBirds(dt); updateDecals(dt); updateCamera(dt);
  if (banner.t > 0) banner.t -= dt;
}
// host: stream the game to the guests, drop guests that went silent
function netTick(dt) {
  if (net.role === 'client' && net.guest) {
    if (net.slot < 0) {
      // not welcomed yet: say hello again now and then, and give up with a clear message if it never works
      const g = net.guest;
      g.helloT += dt;
      if (g.hello && g.rel && g.rel.readyState === 'open' && g.helloT > 1.5) { g.helloT = 0; g.hello(); }
      if (realTime - g.t0 > 30) { netLog('guest gave up'); netClientLost('COULD NOT FINISH CONNECTING. TRY AGAIN.'); return; }
    }
    net.pingT += dt;
    if (net.pingT >= 2) { net.pingT = 0; netSendCh(net.guest.rel, 'ping', performance.now()); }
    if (!net.lastPong) net.lastPong = realTime;
    if (realTime - net.lastPong > 15) netClientLost('LOST CONTACT WITH THE HOST');
    return;
  }
  if (net.role === 'host') {
    if (!net.peers.length && !(net.room && net.room.peers.size)) return;
    for (const p of net.peers.slice()) if (realTime - p.lastIn > 15) netPeerGone(p);
    if (net.room) for (const [gid, po] of [...net.room.peers]) if (po.joined || po.gone || realTime - po.t0 > 30) { if (!po.joined) { try { po.pc.close(); } catch (e) { /* ignore */ } } net.room.peers.delete(gid); }
    if (state === 'PLAYING') {
      net.snapT += dt;
      if (net.snapT >= 0.05) { net.snapT = 0; netBroadcast('snap', netSnapshot(), true); }
      if (net.ev.length) { netBroadcast('ev', net.ev); net.ev = []; }
    } else {
      net.rosterT += dt;
      if (net.rosterT >= 1) { net.rosterT = 0; netSendRoster(); }
      net.ev = [];
    }
  }
}
// guest: controls while the game is running
function netClientEvent(ev) {
  if (net.leaveAsk) {
    if (ev.type === 'action') netLeave('YOU LEFT THE ONLINE GAME');
    else if (ev.type === 'back' || ev.type === 'pause') net.leaveAsk = false;
    return;
  }
  if (ev.type === 'action') netSendCh(net.guest && net.guest.rel, 'act', 'action');
  else if (ev.type === 'ability' || (ev.type === 'back' && ev.dev.startsWith('pad'))) netSendCh(net.guest && net.guest.rel, 'act', 'ability');
  else if (ev.type === 'pause') net.leaveAsk = true;
}
function netWaitEvent(ev) {
  const me = net.me;
  if (!me) return;
  if (ev.type === 'left' || ev.type === 'right') { cycleKind(me, ev.type === 'left' ? -1 : 1); netSendPick(); }
  else if (ev.type === 'up' || ev.type === 'down') { cycleSkin(me, ev.type === 'up' ? -1 : 1); netSendPick(); }
  else if (ev.type === 'ability') openStyle(me);
  else if (ev.type === 'back' || ev.type === 'pause') netLeave();
  else if (ev.type === 'tap') { for (const h of hits) if (ev.x >= h.x && ev.x < h.x + h.w && ev.y >= h.y && ev.y < h.y + h.h) { h.fn(); return; } }
}

}

    text(nm2, x + w - 4, yy, 'l', { align: 'right' }); yy += 9;

  text('L/R: GOAT OR DOG  U/D: BREED', W / 2, H - 40, 'l', { align: 'center' });
  text('ABILITY: STYLE   BACK: LEAVE', W / 2, H - 32, 's', { align: 'center' });
}
function hostSlot() { const r = net.roster && net.roster.players || []; const c = r.filter(q => !q.n && !q.c); return c.length ? c[0].s : -1; }

// ---- the copy-and-paste box (real HTML, so pasting works on every device)
const NB = {};
function netBoxInit() {
  try {
    const u = new URLSearchParams(location.search).get('peer');
    if (u === 'default') { settings.peer = ''; saveSettings(); }
    else if (u && /^https?:\/\/[^\s'"]+$/.test(u)) { settings.peer = u.replace(/\/+$/, ''); saveSettings(); }
  } catch (e) { /* no address bar */ }
  const q = (id) => document.getElementById(id);
  for (const id of ['netbox', 'nbTitle', 'nbHelp', 'nbRoom', 'nbCode', 'nbCopyCode', 'nbJoin', 'nbNum', 'nbJoinGo', 'nbManual', 'nbL1', 'nbOut', 'nbCopy', 'nbMake', 'nbL2', 'nbIn', 'nbPaste', 'nbGo', 'nbStatus', 'nbMode', 'nbClose']) NB[id] = q(id);
  const copyText = (t) => {
    if (!t) return;
    const ok = () => { NB.nbStatus.textContent = 'COPIED.'; };
    try { navigator.clipboard.writeText(t).then(ok, () => { NB.nbOut.select(); document.execCommand('copy'); ok(); }); } catch (e) { try { document.execCommand('copy'); ok(); } catch (er) { /* manual copy */ } }
  };
  NB.nbCopy.onclick = () => { copyText(NB.nbOut.value); NB.nbStatus.textContent = 'COPIED. NOW SEND IT TO YOUR FRIEND.'; };
  NB.nbCopyCode.onclick = () => copyText(net.room ? net.room.code : '');
  NB.nbPaste.onclick = () => { try { navigator.clipboard.readText().then(t => { NB.nbIn.value = t; }, () => { NB.nbStatus.textContent = 'LONG-PRESS THE BOX BELOW AND PASTE'; }); } catch (e) { NB.nbStatus.textContent = 'LONG-PRESS THE BOX BELOW AND PASTE'; } };
  NB.nbClose.onclick = () => netCloseBox();
  NB.nbMode.onclick = () => netOpenBox(net.boxKind, net.boxRoom);
  NB.nbMake.onclick = async () => {
    NB.nbMake.disabled = true; NB.nbStatus.textContent = 'MAKING A CODE...';
    try {
      if (net.boxKind === 'host') { NB.nbOut.value = await netHostInvite(); NB.nbStatus.textContent = 'SEND THIS CODE TO YOUR FRIEND, THEN PASTE THEIR REPLY BELOW.'; }
    } catch (e) { NB.nbStatus.textContent = String(e.message || e).toUpperCase(); }
    NB.nbMake.disabled = false;
  };
  NB.nbGo.onclick = async () => {
    NB.nbGo.disabled = true;
    try {
      if (net.boxKind === 'host') {
        NB.nbStatus.textContent = 'CONNECTING...';
        await netHostAccept(NB.nbIn.value);
        NB.nbIn.value = '';
        NB.nbStatus.textContent = 'WAITING FOR YOUR FRIEND TO CONNECT...';
      } else {
        NB.nbStatus.textContent = 'MAKING A REPLY CODE...';
        NB.nbOut.value = await netGuestAccept(NB.nbIn.value);
        NB.nbStatus.textContent = 'SEND THIS REPLY BACK TO THE HOST AND KEEP THIS PAGE OPEN.';
      }
    } catch (e) { NB.nbStatus.textContent = String(e.message || e).toUpperCase(); }
    NB.nbGo.disabled = false;
  };
  NB.nbJoinGo.onclick = async () => {
    NB.nbJoinGo.disabled = true; NB.nbStatus.textContent = 'LOOKING FOR THE ROOM...';
    try {
      const run = netRoomJoin(NB.nbNum.value);
      setTimeout(() => { if (NB.nbStatus.textContent === 'LOOKING FOR THE ROOM...') NB.nbStatus.textContent = 'ASKING THE HOST...'; }, 1500);
      await run;
      if (net.guest) NB.nbStatus.textContent = 'CONNECTING...';
    } catch (e) { NB.nbStatus.textContent = String(e.message || e).toUpperCase(); }
    NB.nbJoinGo.disabled = false;
  };
  NB.nbNum.addEventListener('keydown', (e) => { if (e.key === 'Enter') NB.nbJoinGo.click(); });
  NB.nbNum.addEventListener('input', () => { const d = NB.nbNum.value.replace(/\D/g, '').slice(0, 6); NB.nbNum.value = d.length > 3 ? d.slice(0, 3) + ' ' + d.slice(3) : d; });
  // keep the box in step with what is happening
  setInterval(() => {
    if (NB.netbox.hidden) return;
    if (net.boxKind === 'host' && net.status && net.status !== net.shownStatus) {
      net.shownStatus = net.status;
      NB.nbStatus.textContent = net.status + (net.boxRoom ? '. ROOM STAYS OPEN FOR MORE FRIENDS.' : '. MAKE ANOTHER INVITE FOR MORE FRIENDS.');
      if (!net.boxRoom) { NB.nbOut.value = ''; NB.nbIn.value = ''; }
    }
  }, 300);
}
function netOpenBox(kind, manual) {
  if (!NB.netbox) return;
  net.boxKind = kind; net.shownStatus = net.status;
  const host = kind === 'host', room = netRoomsAvailable() && !manual;
  net.boxRoom = room;
  NB.nbMode.style.display = netRoomsAvailable() ? '' : 'none';
  NB.nbMode.textContent = room ? 'USE LONG CODES INSTEAD' : 'USE A 6-DIGIT ROOM CODE';
  NB.nbRoom.hidden = !(room && host); NB.nbJoin.hidden = !(room && !host); NB.nbManual.hidden = room;
  NB.nbOut.value = ''; NB.nbIn.value = ''; NB.nbStatus.textContent = '';
  NB.netbox.hidden = false;
  if (room) {
    NB.nbTitle.textContent = host ? 'YOUR ROOM' : 'JOIN A GAME';
    NB.nbHelp.textContent = host ? 'Tell your friends to choose JOIN A GAME and type this code. You can pick a mode while they join.' : 'Ask the host for their 6-digit room code.';
    if (host) {
      NB.nbCode.textContent = net.room && net.room.open ? netFmtCode(net.room.code) : '------';
      if (!net.room || !net.room.open) {
        NB.nbStatus.textContent = 'OPENING A ROOM...';
        netRoomEnsure().then(r => { NB.nbCode.textContent = netFmtCode(r.code); NB.nbStatus.textContent = 'WAITING FOR FRIENDS...'; },
          e => { NB.nbStatus.textContent = String(e.message || e).toUpperCase() + '. TRYING LONG CODES.'; setTimeout(() => netOpenBox('host', true), 1800); });
      } else NB.nbStatus.textContent = net.status || 'WAITING FOR FRIENDS...';
    } else { NB.nbNum.value = ''; try { NB.nbNum.focus(); } catch (e) { /* ignore */ } }
    return;
  }
  NB.nbTitle.textContent = host ? 'INVITE A FRIEND' : 'JOIN A FRIEND';
  NB.nbHelp.textContent = host ? 'Pick a mode first or after. Each friend needs their own invite code.' : 'Ask the host for their invite code, then send your reply code back.';
  NB.nbL1.textContent = host ? '1. YOUR INVITE CODE' : '2. YOUR REPLY CODE (SEND THIS TO THE HOST)';
  NB.nbL2.textContent = host ? '2. PASTE YOUR FRIEND\'S REPLY CODE' : '1. PASTE THE HOST\'S INVITE CODE';
  NB.nbMake.style.display = host ? '' : 'none';
  NB.nbGo.textContent = host ? 'CONNECT' : 'MAKE MY REPLY CODE';
  // the guest sees the paste box first
  const order = host ? ['nbL1', 'nbOut', 'nbCopy', 'nbMake', 'nbL2', 'nbIn', 'nbPaste', 'nbGo'] : ['nbL2', 'nbIn', 'nbPaste', 'nbGo', 'nbL1', 'nbOut', 'nbCopy'];
  order.forEach(id => NB.nbManual.appendChild(NB[id]));
}
function netCloseBox() { net.joinTok++; if (NB.netbox) NB.netbox.hidden = true; }

let lastTs = null;
let timeScale = 1, slowMo = 0;
function tick(ts) {
  if (lastTs === null) lastTs = ts;
  let dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  if (state === 'PLAYING' && !showcase.on) dt *= settings.speed;
  update(dt * timeScale);
  if (slowMo > 0) { slowMo -= dt; if (slowMo <= 0) timeScale = 1; }
  try { updateMusic(); } catch (e) { /* audio not ready */ }
  render();
  requestAnimationFrame(tick);
}
