<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Goat Guardian</title>
<style>
  :root { --bg: #0c0816; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--bg);
    cursor: crosshair;
    outline: none;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Goat Guardian game. Use arrows or WASD and Space or Enter to choose menu options."></canvas></div>
<script>
'use strict';

/* =====================================================================
   GOAT GUARDIAN  v0.3.0
   Lo-fi herding game for 1-4 local players (any mix of goat and dog).
   - Adaptive low-res buffer: integer pixel scale, width/height follow the
     screen so the game fills it (portrait or landscape).
   - Smooth follow camera with sub-pixel presentation over scrolling worlds.
   - Restricted 12-colour palette; day -> sunset -> dusk is a per-pixel
     palette swap of every rendered frame.
   - 6-direction sprites (N, S, NE, NW, SE, SW) for every animal.
   - Screens: TITLE, MODE, PLAYERS, OPTIONS, HOWTO, PLAYING, RESULTS, GAMEOVER.
   - All art from pixel matrices, all audio synthesized (Web Audio).
   ===================================================================== */

// ---------------------------------------------------------------------
// Canvases (sizes set by resize())
// ---------------------------------------------------------------------
let W = 160, H = 288, BW = W + 2, BH = H + 2, PIX = 1;
const view = document.getElementById('game');
const vctx = view.getContext('2d');
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { willReadFrequently: true });
const hud = document.createElement('canvas');
const hctx = hud.getContext('2d');
let G = bctx; // current draw target for sprite/text helpers

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}

// ---------------------------------------------------------------------
// Math / RNG
// ---------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = Math.random;
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function len(x, y) { return Math.sqrt(x * x + y * y); }
function damp(rate, dt) { return 1 - Math.exp(-rate * dt); }
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function makeNoise(seed) {
  const r = mulberry32(seed);
  const P = new Float32Array(65536);
  for (let i = 0; i < P.length; i++) P[i] = r();
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const a = P[((yi & 255) << 8) | (xi & 255)];
    const b = P[((yi & 255) << 8) | ((xi + 1) & 255)];
    const c = P[(((yi + 1) & 255) << 8) | (xi & 255)];
    const d = P[(((yi + 1) & 255) << 8) | ((xi + 1) & 255)];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
}

// ---------------------------------------------------------------------
// Restricted palette + time-of-day palette swap
// ---------------------------------------------------------------------
// k ink, i indigo, t teal canopy, s seafoam, g olive ground, h olive shade,
// w wool white, l pale stone, b brown, n tan, r red accent, y yellow accent
const PAL_KEYS = ['k', 'i', 't', 's', 'g', 'h', 'w', 'l', 'b', 'n', 'r', 'y'];
const PAL_DAY = {
  k: '#160c26', i: '#34204e', t: '#2a5f6e', s: '#4e8f80', g: '#9aac5c', h: '#7f9450',
  w: '#ece6d2', l: '#b9b2a2', b: '#8c6a4c', n: '#c8a878', r: '#e04848', y: '#f4d860'
};
const PAL_SUNSET = {
  k: '#1c0a1e', i: '#3a1838', t: '#5e2c58', s: '#84466a', g: '#b87850', h: '#9a5c44',
  w: '#f4d4b0', l: '#c89a80', b: '#7c4030', n: '#d89a68', r: '#ff5a4a', y: '#ffd27a'
};
const PAL_DUSK = {
  k: '#0a0614', i: '#1a1030', t: '#2c2048', s: '#3e3060', g: '#4e4466', h: '#3e3656',
  w: '#a898b8', l: '#786a90', b: '#4a3450', n: '#7a6488', r: '#ff4a6a', y: '#f0d080'
};
const C = PAL_DAY;
const PAL_RGB = {};
for (const k of PAL_KEYS) PAL_RGB[k] = [hexToRgb(PAL_DAY[k]), hexToRgb(PAL_SUNSET[k]), hexToRgb(PAL_DUSK[k])];
function packLE(r, g, b) { return ((b << 16) | (g << 8) | r) >>> 0; }

let remapTable = null;
let remapQ = -1;
function paletteColorAt(k, p) {
  const [d, s, n] = PAL_RGB[k];
  if (p <= 0.6) {
    const t = p / 0.6;
    return [0, 1, 2].map(j => Math.round(lerp(d[j], s[j], t)));
  }
  const t = (p - 0.6) / 0.4;
  return [0, 1, 2].map(j => Math.round(lerp(s[j], n[j], t)));
}
function buildRemap(p) {
  const q = Math.round(clamp(p, 0, 1) * 96);
  if (q === remapQ) return;
  remapQ = q;
  if (q === 0) { remapTable = null; return; }
  const m = new Map();
  for (const k of PAL_KEYS) {
    const from = PAL_RGB[k][0];
    const to = paletteColorAt(k, q / 96);
    m.set(packLE(from[0], from[1], from[2]), (0xff000000 | packLE(to[0], to[1], to[2])) >>> 0);
  }
  remapTable = m;
}
function applyRemap() {
  if (!remapTable) return;
  const img = bctx.getImageData(0, 0, BW, BH);
  const d = new Uint32Array(img.data.buffer);
  let lastK = -1, lastV = 0;
  for (let i = 0; i < d.length; i++) {
    const k = d[i] & 0xffffff;
    if (k !== lastK) {
      lastK = k;
      lastV = remapTable.get(k) || 0;
    }
    if (lastV) d[i] = lastV;
  }
  bctx.putImageData(img, 0, 0);
}

// ---------------------------------------------------------------------
// Sprites (chunky pixel matrices, palette letters)
// ---------------------------------------------------------------------
function makeSprite(rows) {
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || '.';
      if (!PAL_DAY[ch]) continue;
      const rgb = PAL_RGB[ch][0];
      const i = (y * w + x) * 4;
      img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function transformCanvas(src, flipX, flipY) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.translate(flipX ? src.width : 0, flipY ? src.height : 0);
  g.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  g.drawImage(src, 0, 0);
  return c;
}
function recolor(src, key) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = PAL_DAY[key];
  g.fillRect(0, 0, src.width, src.height);
  return c;
}
function spr(rows) {
  const r = makeSprite(rows);
  const l = transformCanvas(r, true, false);
  return {
    r: r, l: l, ru: transformCanvas(r, false, true), lu: transformCanvas(r, true, true),
    wr: recolor(r, 'w'), wl: recolor(l, 'w'), w: r.width, h: r.height
  };
}
function walkPair(top, a, b) { return [spr(top.concat([a])), spr(top.concat([b]))]; }
function swapRows(rows, map) { return rows.map(r => r.replace(/./g, c => map[c] || c)); }

// Each animal: SE (side, face visible), NE (side, turned away), S (front), N (back).
// NW / SW are mirrored SE / NE, giving 6 facing directions.
const SP = {};
{
  // Sheep
  const sideTop = ['..ww...', '.wwwwkk', 'wwwwwkk', 'wwwwww.', '.llll..'];
  const sideBackTop = ['.....k.', '..wwwkk', '.wwwwwk', 'wwwwwww', '.llll..'];
  const frontTop = ['.wwww.', 'wwwwww', 'wwkkww', 'wwkkww', '.llll.'];
  const backTop = ['..kk..', '.wwww.', 'wwwwww', 'wwwwww', '.llll.'];
  SP.sheep = {
    SE: walkPair(sideTop, '.k..k..', 'k...k..'),
    NE: walkPair(sideBackTop, '.k..k..', 'k...k..'),
    S: walkPair(frontTop, '.k..k.', 'k....k'),
    N: walkPair(backTop, '.k..k.', 'k....k'),
    graze: [spr(['..ww...', '.wwww..', 'wwwwwk.', 'wwwwwkk', '.llll..', '.k..k..']),
      spr(['..ww...', '.wwww..', 'wwwww..', 'wwwwwkk', '.llllk.', '.k..k..'])],
    panic: spr(['..ww.kk', '.wwwwkk', 'wwwwww.', 'wwwwww.', '.llll..', 'k.k..k.'])
  };
  // Goat
  const gSide = ['....ll...', '...l..nn.', '......nkn', 'nnnnnnnn.', 'nnnnnnbw.', '.bbbbb...'];
  const gSideBack = ['....ll...', '...l.lnn.', '......nnn', 'nnnnnnnn.', 'nnnnnnb..', '.bbbbb...'];
  const gFront = ['l.....l', '.l...l.', '..nnn..', '.nknkn.', '..nwn..', '.nbbbn.'];
  const gBack = ['l.....l', '.l...l.', '..nnn..', '.nnnnn.', '.nnwnn.', '.nbbbn.'];
  SP.goat = {
    SE: walkPair(gSide, '.k.k.k.k.', 'k..k..k.k'),
    NE: walkPair(gSideBack, '.k.k.k.k.', 'k..k..k.k'),
    S: walkPair(gFront, '.k...k.', '..k.k..'),
    N: walkPair(gBack, '.k...k.', '..k.k..'),
    act: {
      SE: spr(['.........', '...ll....', 'nnnnl.ll.', 'nnnnnnnn.', 'nnnnnnnkn', '.bbbbb.w.', 'k..k.k..k']),
      NE: spr(['.........', '...ll....', 'nnnnl.ll.', 'nnnnnnnn.', 'nnnnnnnnn', '.bbbbb...', 'k..k.k..k']),
      S: spr(['.......', 'l.....l', '.lnnnl.', '.nknkn.', '.nnnnn.', '.nbwbn.', 'k.....k']),
      N: spr(['.......', 'l.....l', '.lnnnl.', '.nnnnn.', '.nnwnn.', '.nbbbn.', 'k.....k'])
    }
  };
  // Dog (border collie)
  const dSide = ['......k.k', 'w.....kkk', '.k....kwk', '.kkkkkkww', '.kkwwwk..'];
  const dSideBack = ['......k.k', 'w.....kkk', '.k....kkk', '.kkkkkkk.', '.kkwwwk..'];
  const dFront = ['.k...k.', '.kkkkk.', '.kkwkk.', '..wkw..', '.kwwwk.'];
  const dBack = ['.k...k.', '.kkkkk.', '..kkk..', '.kkkkk.', '.kkwkk.'];
  const bark = spr(['.....k.k.', 'w....kkk.', '.k...kwkw', '.kkkkkkw.', '.kkwwwk.w', '.k.k..k.k']);
  SP.dog = {
    SE: walkPair(dSide, '.k.k..k.k', 'k..k.k..k'),
    NE: walkPair(dSideBack, '.k.k..k.k', 'k..k.k..k'),
    S: walkPair(dFront, '.k...k.', '..k.k..'),
    N: walkPair(dBack, '.k...k.', '..k.k..'),
    act: {
      SE: bark, NE: bark,
      S: spr(['.k...k.', '.kkkkk.', '.kkwkk.', '..wrw..', '.kwwwk.', 'k.....k']),
      N: spr(dBack.concat(['k.....k']))
    }
  };
  // Wolves (alpha = palette swapped, yellow eyes)
  const wSide = ['.........i.', 'i.......iri', '.iiiiiiiiik', '.kiiiiiiik.'];
  const wSideBack = ['.........i.', 'i.......iii', '.iiiiiiiiik', '.kiiiiiiik.'];
  const wFront = ['i.....i', 'iiiiiii', '.iriri.', '..iki..'];
  const wBack = ['i.....i', 'iiiiiii', '.iiiii.', '..iii..'];
  const legs = { SE: ['.k.k..k.k..', 'k...kk...k.'], S: ['.k...k.', '..k.k..'], N: ['.k.i.k.', '..kik..'] };
  const build = (map) => {
    const m = (rows) => map ? swapRows(rows, map) : rows;
    return {
      SE: walkPair(m(wSide), m([legs.SE[0]])[0], m([legs.SE[1]])[0]),
      NE: walkPair(m(wSideBack), m([legs.SE[0]])[0], m([legs.SE[1]])[0]),
      S: walkPair(m(wFront), m([legs.S[0]])[0], m([legs.S[1]])[0]),
      N: walkPair(m(wBack), m([legs.N[0]])[0], m([legs.N[1]])[0])
    };
  };
  SP.wolf = build(null);
  SP.alpha = build({ i: 'k', k: 'i', r: 'y' });
  SP.batUp = spr(['i.....i', 'ii...ii', '.iikii.', '..krk..']);
  SP.batDown = spr(['..kkk..', '.iirii.', 'ii...ii', 'i.....i']);
  SP.pillar = spr(['llllll', 'wwwwwl', '.wwwl.', '.wwwl.', '.wlwl.', '.wwll.', '.wwwl.', '.wwwl.',
    '.wwwl.', '.lwwl.', '.wwwl.', 'lwwwwl', 'llllll']);
  SP.pillarBroken = spr(['..w...', '.wwl..', '.wwwl.', '.wlwl.', '.wwwl.', '.wwll.', 'lwwwwl', 'llllll']);
  SP.pinGoal = spr(['.rrr.', 'rrwrr', 'rrrrr', '.rrr.', '..r..', '..k..']);
  SP.pinStart = spr(['.lll.', 'llwll', 'lllll', '.lll.', '..l..', '..k..']);
}
// facing: 6 directions from a facing vector
function faceDir(fx, fy) {
  const a = Math.atan2(fy, fx) * 57.2958;
  if (a < -58 && a > -122) return 'N';
  if (a > 58 && a < 122) return 'S';
  return fy < -0.2 ? 'NE' : 'SE';
}

function drawSpr(s, x, y, left, opts) {
  const o = opts || {};
  let img;
  if (o.white) img = left ? s.wl : s.wr;
  else if (o.upside) img = left ? s.lu : s.ru;
  else img = left ? s.l : s.r;
  G.drawImage(img, Math.round(x - s.w / 2), Math.round(y - s.h + 1));
}
function px(x, y, key) {
  G.fillStyle = PAL_DAY[key];
  G.fillRect(Math.round(x), Math.round(y), 1, 1);
}
function rect(x, y, w, h, key) {
  G.fillStyle = PAL_DAY[key];
  G.fillRect(Math.round(x), Math.round(y), w, h);
}
function frame(x, y, w, h, key) {
  rect(x, y, w, 1, key); rect(x, y + h - 1, w, 1, key);
  rect(x, y, 1, h, key); rect(x + w - 1, y, 1, h, key);
}
function drawShadow(x, y, w) {
  const x0 = Math.round(x - w / 2), yy = Math.round(y);
  rect(x0 + 1, yy, w - 2, 1, 'h');
  rect(x0 + 2, yy + 1, Math.max(1, w - 4), 1, 'h');
}

// ---------------------------------------------------------------------
// Pixel font (3x5)
// ---------------------------------------------------------------------
const FONT = {
  'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011', 'D': '110101101101110',
  'E': '111100110100111', 'F': '111100110100100', 'G': '011100101101011', 'H': '101101111101101',
  'I': '111010010010111', 'J': '001001001101010', 'K': '101101110101101', 'L': '100100100100111',
  'M': '101111101101101', 'N': '111101101101101', 'O': '111101101101111', 'P': '110101110100100',
  'Q': '010101101110011', 'R': '110101110101101', 'S': '011100010001110', 'T': '111010010010010',
  'U': '101101101101111', 'V': '101101101101010', 'W': '101101111111101', 'X': '101101010101101',
  'Y': '101101010010010', 'Z': '111001010100111',
  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110',
  '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010',
  '8': '111101111101111', '9': '111101111001110',
  ':': '000010000010000', '.': '000000000000010', '!': '010010010000010', '-': '000000111000000',
  '/': '001001010100100', '+': '000010111010000', "'": '010010000000000', ',': '000000000010100',
  '?': '110001010000010', '(': '001010010010001', ')': '100010010010100', '>': '100110111110100',
  '<': '001011111011001', '=': '000111000111000', 'x': '000101010101000', ' ': '000000000000000',
  '^': '010111000000000', '*': '000010111010101', '&': '010101010101011'
};
function textWidth(str, s) { return str.length ? (str.length * 4 - 1) * (s || 1) : 0; }
function drawTextRaw(str, x, y, col, s) {
  G.fillStyle = col;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]];
    if (g) for (let j = 0; j < 15; j++) if (g[j] === '1') G.fillRect(cx + (j % 3) * s, y + ((j / 3) | 0) * s, s, s);
    cx += 4 * s;
  }
}
// key = palette letter. opts: s, align, outline (palette letter), shadow (palette letter)
function text(str, x, y, key, opts) {
  const o = opts || {};
  const s = o.s || 1;
  str = String(str).toUpperCase().replace(/X(?=\d)/g, 'x');
  const w = textWidth(str, s);
  if (o.align === 'center') x -= Math.floor(w / 2);
  else if (o.align === 'right') x -= w;
  x = Math.round(x); y = Math.round(y);
  if (o.outline) {
    const oc = PAL_DAY[o.outline];
    drawTextRaw(str, x - s, y, oc, s); drawTextRaw(str, x + s, y, oc, s);
    drawTextRaw(str, x, y - s, oc, s); drawTextRaw(str, x, y + s, oc, s);
    drawTextRaw(str, x + s, y + s, oc, s);
  } else if (o.shadow) {
    drawTextRaw(str, x + 1, y + 1, PAL_DAY[o.shadow], s);
  }
  drawTextRaw(str, x, y, PAL_DAY[key], s);
}

// ---------------------------------------------------------------------
// Settings (persisted per viewer)
// ---------------------------------------------------------------------
const settings = { sound: true, shake: true, fullscreen: true };
try {
  const s = JSON.parse(localStorage.getItem('goatGuardianSettings') || '{}');
  for (const k in settings) if (typeof s[k] === 'boolean') settings[k] = s[k];
} catch (e) { /* storage unavailable */ }
function saveSettings() {
  try { localStorage.setItem('goatGuardianSettings', JSON.stringify(settings)); } catch (e) { /* ignore */ }
}

// ---------------------------------------------------------------------
// Audio (Web Audio synthesis)
// ---------------------------------------------------------------------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try { AC = new Ctor(); } catch (e) { AC = null; return; }
  master = AC.createGain();
  master.gain.value = settings.sound ? 0.45 : 0;
  master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate), AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function audioReady() { return AC && master && AC.state !== 'closed'; }
function setSound(on) {
  settings.sound = on;
  saveSettings();
  if (master) master.gain.setTargetAtTime(on ? 0.45 : 0, AC.currentTime, 0.02);
}
function envGain(t0, attack, peak, decay) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  return g;
}
function tone(type, f0, f1, dur, vol, t0, filter) {
  if (!audioReady()) return;
  const t = t0 !== undefined ? t0 : AC.currentTime;
  const o = AC.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = envGain(t, 0.005, vol, dur);
  if (filter) {
    const f = AC.createBiquadFilter();
    f.type = filter.type;
    f.frequency.setValueAtTime(filter.freq, t);
    if (filter.freq1) f.frequency.exponentialRampToValueAtTime(filter.freq1, t + dur);
    f.Q.value = filter.q || 1;
    o.connect(f); f.connect(g);
  } else o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function noise(dur, type, freq, vol, q, t0, freq1) {
  if (!audioReady()) return;
  const t = t0 !== undefined ? t0 : AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (freq1) f.frequency.exponentialRampToValueAtTime(freq1, t + dur);
  f.Q.value = q || 1;
  const g = envGain(t, 0.004, vol, dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, Math.random() * 0.5);
  src.stop(t + dur + 0.05);
}
const SFX = {
  dash() {
    if (!audioReady()) return;
    const t = AC.currentTime;

function fsSupported() {
  const d = document.documentElement;
  if (!(d.requestFullscreen || d.webkitRequestFullscreen)) return false;
  if (document.fullscreenEnabled === false) return false;
  if (document.fullscreenEnabled === undefined && document.webkitFullscreenEnabled === false) return false;
  return true;
}
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function enterFs() {
  const d = document.documentElement;
  try {
    const p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* refused */ }
}
function exitFs() {
  try {
    const f = document.exitFullscreen || document.webkitExitFullscreen;
    if (f) { const p = f.call(document); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { /* ignore */ }
}
function toggleFs() {
  if (!fsSupported()) return;
  if (isFs()) { exitFs(); settings.fullscreen = false; }
  else { enterFs(); settings.fullscreen = true; }
  saveSettings();
  SFX.click();
}
function autoFs() { if (settings.fullscreen && fsSupported() && !isFs()) enterFs(); }

// ---------------------------------------------------------------------
// Worlds (procedural maps with a forest mask)
// mask: 0 meadow, 1 forest canopy, 2 solid structure
// ---------------------------------------------------------------------
const WORLD_W = 600;
let world = null;

function newWorld(w, h, seed, kind) {
  return {
    w: w, h: h, kind: kind, seed: seed,
    mask: new Uint8Array(w * h).fill(1),
    rng: mulberry32(seed), noise: makeNoise(seed),
    pillars: [], start: null, goal: null, goalR: 26, path: [], canvas: null
  };
}
function maskAt(x, y) {
  x = x | 0; y = y | 0;
  if (x < 0 || y < 0 || x >= world.w || y >= world.h) return 1;
  return world.mask[y * world.w + x];
}
function blocked(x, y) { return maskAt(x, y) !== 0; }
function canopy(x, y) { return maskAt(x, y) === 1; }

function stamp(wd, cx, cy, r, rough, val) {
  const pad = Math.ceil(rough) + 2;
  const x0 = Math.max(0, Math.floor(cx - r - pad)), x1 = Math.min(wd.w - 1, Math.ceil(cx + r + pad));
  const y0 = Math.max(0, Math.floor(cy - r - pad)), y1 = Math.min(wd.h - 1, Math.ceil(cy + r + pad));
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x - cx, y - cy);
      const n = wd.noise(x * 0.09, y * 0.09) - 0.5;
      if (d < r + n * rough * 2) wd.mask[y * wd.w + x] = val;
    }
  }
}
function borderForest(wd, b) {
  for (let y = 0; y < wd.h; y++) for (let x = 0; x < wd.w; x++) {
    if (x < b || y < b || x >= wd.w - b || y >= wd.h - b) wd.mask[y * wd.w + x] = 1;
  }
}
function minPathDist(wd, x, y) {
  let m = 1e9;
  for (let i = 0; i < wd.path.length; i += 2) {
    const p = wd.path[i];
    const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
    if (d < m) m = d;
  }
  return Math.sqrt(m);
}
function clearAround(wd, x, y, r) {
  for (let yy = Math.floor(y - r); yy <= y + r; yy++) for (let xx = Math.floor(x - r); xx <= x + r; xx++) {
    if (xx < 0 || yy < 0 || xx >= wd.w || yy >= wd.h) return false;
    if (wd.mask[yy * wd.w + xx] !== 0) return false;
  }
  return true;
}
function addPillar(wd, x, y, broken) {
  x = Math.round(x); y = Math.round(y);
  wd.pillars.push({ x: x, y: y, broken: !!broken });
  for (let yy = y - 2; yy <= y; yy++) for (let xx = x - 3; xx <= x + 2; xx++) {
    if (xx >= 0 && yy >= 0 && xx < wd.w && yy < wd.h) wd.mask[yy * wd.w + xx] = 2;
  }
}

function makeDefendWorld(seed) {
  const wd = newWorld(WORLD_W, 460, seed, 'defend');
  const r = wd.rng;
  const cx = WORLD_W / 2, cy = 232;
  for (let a = 0; a < Math.PI * 2; a += 0.1) {
    const rad = 90 + r() * 30;
    stamp(wd, cx + Math.cos(a) * 110, cy + Math.sin(a) * 92, rad * 0.62, 10, 0);
  }
  stamp(wd, cx, cy, 115, 12, 0);
  for (let k = 0; k < 7; k++) {
    for (let tries = 0; tries < 30; tries++) {
      const a = r() * Math.PI * 2, d = 110 + r() * 60;
      const x = cx + Math.cos(a) * d * 1.3, y = cy + Math.sin(a) * d * 0.9;
      if (x < 40 || x > WORLD_W - 40 || y < 50 || y > wd.h - 50) continue;
      stamp(wd, x, y, 10 + r() * 9, 5, 1);
      break;
    }
  }
  borderForest(wd, 8);
  for (let k = 0; k < 7; k++) {
    const a = (k / 7) * Math.PI * 2 + 0.3;
    addPillar(wd, cx + Math.cos(a) * 52, cy + Math.sin(a) * 40, k % 3 === 2);
  }
  wd.start = { x: cx, y: cy };
  return wd;
}

function makeEscortWorld(n, seed) {
  const h = Math.min(1700, 760 + 150 * Math.min(n, 6));
  const wd = newWorld(WORLD_W, h, seed, 'escort');
  const r = wd.rng;
  const pts = [];
  let x = WORLD_W / 2 + (r() - 0.5) * 160, y = h - 56;
  pts.push({ x: x, y: y });
  while (y > 190) {
    y -= 120 + r() * 50;
    x = clamp(x + (r() - 0.5) * 260, 90, WORLD_W - 90);
    pts.push({ x: x, y: y });
  }
  pts.push({ x: clamp(x + (r() - 0.5) * 140, 100, WORLD_W - 100), y: 56 });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const L = Math.hypot(b.x - a.x, b.y - a.y);
    for (let t = 0; t < L; t += 3) wd.path.push({ x: lerp(a.x, b.x, t / L), y: lerp(a.y, b.y, t / L) });
  }
  wd.path.push(pts[pts.length - 1]);
  const ph = r() * 10;
  for (let i = 0; i < wd.path.length; i += 2) {
    const p = wd.path[i];
    const rad = 42 + 12 * Math.sin(i * 0.05 + ph) + 8 * Math.sin(i * 0.13 + ph * 2);
    stamp(wd, p.x, p.y, rad, 8, 0);
  }
  for (let k = 0; k < 10 + n * 2; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const a = r() * Math.PI * 2;
    stamp(wd, p.x + Math.cos(a) * 60, p.y + Math.sin(a) * 34, 22 + r() * 22, 8, 0);
  }
  stamp(wd, pts[0].x, pts[0].y, 58, 6, 0);
  stamp(wd, pts[pts.length - 1].x, pts[pts.length - 1].y, 56, 6, 0);
  for (let k = 0; k < 40 + n * 8; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const rad = 7 + r() * 11;
    const ix = p.x + (r() - 0.5) * 160, iy = p.y + (r() - 0.5) * 70;
    if (minPathDist(wd, ix, iy) < rad + 20) continue;
    if (Math.hypot(ix - pts[0].x, iy - pts[0].y) < 70) continue;
    if (Math.hypot(ix - pts[pts.length - 1].x, iy - pts[pts.length - 1].y) < 70) continue;
    stamp(wd, ix, iy, rad, 4, 1);
  }
  borderForest(wd, 8);
  for (let i = 40; i < wd.path.length - 40; i += 70 + Math.floor(r() * 40)) {
    const p = wd.path[i], q = wd.path[Math.min(wd.path.length - 1, i + 3)];
    const dx = q.x - p.x, dy = q.y - p.y;
    const l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    for (const sgn of [-1, 1]) {
      const gx = p.x + nx * 24 * sgn, gy = p.y + ny * 24 * sgn;
      if (clearAround(wd, gx, gy, 5)) addPillar(wd, gx, gy, r() < 0.3);
    }
  }
  for (let k = 0; k < 4 + n; k++) {
    const p = wd.path[Math.floor(r() * wd.path.length)];
    const gx = p.x + (r() - 0.5) * 100, gy = p.y + (r() - 0.5) * 50;
    if (minPathDist(wd, gx, gy) > 14 && clearAround(wd, gx, gy, 6)) addPillar(wd, gx, gy, r() < 0.5);
  }
  wd.start = { x: pts[0].x, y: pts[0].y };
  wd.goal = { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y };
  return wd;
}

function renderWorld(wd) {
  const w = wd.w, h = wd.h, m = wd.mask;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const d32 = new Uint32Array(img.data.buffer);
  const P = {};
  for (const k of PAL_KEYS) { const v = PAL_RGB[k][0]; P[k] = (0xff000000 | packLE(v[0], v[1], v[2])) >>> 0; }
  // distance inside the forest to the nearest meadow pixel (lets crowns bulge past the edge)
  const dist = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) dist[i] = m[i] === 1 ? 1e6 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (!dist[i]) continue;
    let d = dist[i];
    if (x > 0) d = Math.min(d, dist[i - 1] + 1);
    if (y > 0) {
      d = Math.min(d, dist[i - w] + 1);
      if (x > 0) d = Math.min(d, dist[i - w - 1] + 1.41);
      if (x < w - 1) d = Math.min(d, dist[i - w + 1] + 1.41);
    }
    dist[i] = d;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x;
    if (!dist[i]) continue;
    let d = dist[i];
    if (x < w - 1) d = Math.min(d, dist[i + 1] + 1);
    if (y < h - 1) {
      d = Math.min(d, dist[i + w] + 1);
      if (x < w - 1) d = Math.min(d, dist[i + w + 1] + 1.41);
      if (x > 0) d = Math.min(d, dist[i + w - 1] + 1.41);
    }
    dist[i] = d;
  }
  // rounded tree crowns, painted top to bottom so lower crowns overlap upper ones
  const vis = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) vis[i] = m[i] === 1 ? 1 : 0;
  const crownCol = new Uint32Array(w * h);
  const crowns = [];
  for (let gy = 0; gy < h; gy += 9) for (let gx = 0; gx < w; gx += 10) {
    const cx = Math.floor(gx + hash2(gx, gy) * 9), cy = Math.floor(gy + hash2(gy + 3, gx) * 8);
    if (cx >= w || cy >= h || m[cy * w + cx] !== 1) continue;
    const R = Math.min(5 + hash2(cx, cy) * 4, dist[cy * w + cx] + 3);
    if (R >= 3) crowns.push({ x: cx, y: cy, r: R });
  }
  crowns.sort((a, b) => a.y - b.y);
  for (const cr of crowns) {
    const R = cr.r;
    for (let dy = -Math.ceil(R); dy <= Math.ceil(R); dy++) for (let dx = -Math.ceil(R); dx <= Math.ceil(R); dx++) {
      const x = cr.x + dx, y = cr.y + dy;
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.sqrt(dx * dx + dy * dy * 1.2);
      if (d > R) continue;
      const i = y * w + x;
      vis[i] = 1;
      let col = P.t;
      if (d > R - 1.3) col = dy > -R * 0.25 ? P.i : (hash2(x, y) < 0.45 ? P.s : P.t);
      else if ((dx * 0.4 + dy * 0.9) / R > 0.5 && ((x + y) & 1)) col = P.i;
      crownCol[i] = col;
    }
  }
  const can = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? true : vis[y * w + x] === 1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (vis[i] === 1) {
        let below = 0;
        for (let dd = 1; dd <= 3; dd++) if (!can(x, y + dd)) { below = dd; break; }
        let col = crownCol[i] || P.t;
        if (below === 1 || below === 2) col = P.i;
        else if (below === 3 && ((x + y) & 1)) col = P.i;
        d32[i] = col;
      } else {
        let up = 0;
        for (let dd = 1; dd <= 10; dd++) if (can(x, y - dd)) { up = dd; break; }
        const side = can(x - 1, y) || can(x + 1, y) || can(x - 2, y) || can(x + 2, y) ||
          can(x, y + 1) || can(x - 1, y + 1) || can(x + 1, y + 1);
        const trunk = hash2(x, 7) < 0.2;
        let col = P.g;
        if (up && up <= 3) col = P.i;
        else if (up && up <= 8) col = (trunk && up <= 7) ? P.i : P.s;
        else if (up >= 9 && ((x + y) & 1)) col = P.s;
        else if (side) col = P.s;
        d32[i] = col;
      }
    }
  }
  // canopy texture marks ("v" and "^" leaf clusters)
  for (let y = 2; y < h - 4; y += 3) {
    for (let x = 1; x < w - 4; x += 4) {
      const hx = x + Math.floor(hash2(x, y) * 3), hy = y + Math.floor(hash2(y, x) * 2);
      if (!(can(hx, hy) && can(hx + 2, hy) && can(hx + 1, hy + 1) && can(hx + 1, hy + 3) && can(hx + 1, hy - 1))) continue;
      if (hash2(hx * 3, hy * 5) < 0.45) continue;
      if (d32[hy * w + hx] !== P.t || d32[hy * w + hx + 2] !== P.t) continue;
      const v = hash2(hx, hy * 7) < 0.6;
      d32[hy * w + hx] = P.i;
      d32[hy * w + hx + 2] = P.i;
      d32[(hy + (v ? 1 : -1)) * w + hx + 1] = P.i;
      if (hash2(hx + 11, hy) < 0.12) d32[(hy - 1) * w + hx + 3] = P.s;
    }
  }
  // sparse ground specks
  for (let k = 0; k < (w * h) / 260; k++) {
    const x = Math.floor(wd.rng() * (w - 6)), y = Math.floor(wd.rng() * h);
    const i = y * w + x;
    if (d32[i] !== P.g || d32[i + 2] !== P.g || d32[i + 4] !== P.g) continue;
    const t = wd.rng();
    if (t < 0.8) { d32[i] = P.h; d32[i + 2] = P.h; if (wd.rng() < 0.6) d32[i + 4] = P.h; }
    else if (t < 0.9) d32[i] = P.n;
    else if (t < 0.96) d32[i] = P.w;
    else d32[i] = P.y;
  }
  for (const p of wd.pillars) {
    for (let k = 0; k < 6; k++) {
      const sx = p.x + 2 + k, sy = p.y - 1 + Math.floor(k / 2);
      for (let q = 0; q < 2; q++) {
        const yy = sy + q;
        if (sx < w && yy < h && d32[yy * w + sx] === P.g) d32[yy * w + sx] = P.h;
      }
    }
  }
  if (wd.goal) {
    const R = wd.goalR;
    for (let a = 0; a < Math.PI * 2; a += 0.02) {
      const xx = Math.round(wd.goal.x + Math.cos(a) * R), yy = Math.round(wd.goal.y + Math.sin(a) * R * 0.8);
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && ((xx + yy) & 1)) d32[yy * w + xx] = P.h;
    }
  }
  if (wd.start && wd.kind === 'escort') {
    for (let a = 0; a < Math.PI * 2; a += 0.05) {
      const xx = Math.round(wd.start.x + Math.cos(a) * 14), yy = Math.round(wd.start.y + Math.sin(a) * 10);
      if (xx >= 0 && yy >= 0 && xx < w && yy < h && ((xx + yy) & 1) === 0) d32[yy * w + xx] = P.h;
    }
  }
  g.putImageData(img, 0, 0);
  if (wd.goal) {
    for (let k = 0; k < 18; k++) {
      const a = (k / 18) * Math.PI * 2;
      if (Math.abs(a - Math.PI / 2) < 0.5) continue;
      const xx = Math.round(wd.goal.x + Math.cos(a) * wd.goalR), yy = Math.round(wd.goal.y + Math.sin(a) * wd.goalR * 0.8);
      g.fillStyle = C.b; g.fillRect(xx, yy - 3, 1, 3);
      g.fillStyle = C.n; g.fillRect(xx, yy - 4, 1, 1);
    }
  }
  wd.canvas = c;
  return wd;
}

function meadowNear(x, y, r) {

  const dh = Math.max(1, Math.floor((stage.clientHeight || window.innerHeight) * dpr));

function moveBody(e, dx, dy, r) {

    const nx = e.x + dx, ex = nx + (dx > 0 ? r : -r);
    if (!blocked(ex, e.y) && !blocked(ex, e.y - 1)) e.x = nx;
    else { hit = true; e.vx *= -0.1; }
  }
  if (dy) {
    const ny = e.y + dy, ey = ny + (dy > 0 ? 1 : -1);
    if (!blocked(e.x - r, ey) && !blocked(e.x + r, ey)) e.y = ny;
    else { hit = true; e.vy *= -0.1; }
  }
  e.x = clamp(e.x, 2, world.w - 2);
  e.y = clamp(e.y, 2, world.h - 2);

}
function updateFacing(e, dt, minSpeed) {

    e.fx = lerp(e.fx, nfx, damp(14, dt)); e.fy = lerp(e.fy, nfy, damp(14, dt));
    const l = len(e.fx, e.fy) || 1; e.fx /= l; e.fy /= l;
  }
}

// ---------------------------------------------------------------------
// Players: goat (ram charge) and dog (bark)
// ---------------------------------------------------------------------
function playerAction(p) {
  if (p.kind === 'goat') tryRam(p);
  else tryBark(p);
}
function tryRam(p) {
  if (p.ramT > 0) { p.queue = 0.15; return; }
  if (p.cd > 0) { if (p.cd < 0.2) p.queue = 0.22; return; }
  p.ramT = RAM_DURATION;
  p.cd = RAM_COOLDOWN;
  p.ramId++;
  p.queue = 0;
  const inp = readMove(p.dev);
  if (len(inp.x, inp.y) > 0.3) { const l = len(inp.x, inp.y); p.fx = inp.x / l; p.fy = inp.y / l; }
  p.vx = p.fx * RAM_SPEED; p.vy = p.fy * RAM_SPEED;
  dust(p.x - p.fx * 4, p.y, 10, 3, 40);
  addShake(1.2);
  SFX.dash();
}
function tryBark(p) {
  if (p.cd > 0) { if (p.cd < 0.2) p.queue = 0.22; return; }
  p.cd = BARK_COOLDOWN;
  p.actT = 0.25;
  p.queue = 0;
  SFX.bark();
  addParticle({ x: p.x, y: p.y - 3, life: 0.35, max: 0.35, r0: 4, r1: BARK_RADIUS, col: 'w', kind: 'ring' });
  addText(p.x, p.y - 14, 'WOOF', 'w');
  for (const s of sheep) {
    const dx = s.x - p.x, dy = s.y - p.y;
    const d = len(dx, dy);
    if (d < BARK_RADIUS && d > 0.01) {
      const k = 1 - d / BARK_RADIUS;
      s.vx += (dx / d) * 70 * k + p.vx * 0.2;
      s.vy += (dy / d) * 70 * k + p.vy * 0.2;
      s.herd = 0.8;
      s.grazing = false;
    }
  }
  for (const e of enemies) {
    if (e.state === 'launched' || e.state === 'emerge' || e.state === 'flee') continue;
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = len(dx, dy);
    if (d > BARK_RADIUS - 4) continue;
    const l = d || 1;
    e.vx = (dx / l) * 140; e.vy = (dy / l) * 140;
    e.flash = 0.12;
    if (e.carry) releaseCarried(e);
    e.fear++;
    if (e.fear >= e.hp) {
      e.state = 'stun'; e.t = 0.5; e.thenFlee = true;
      score++; mission.kills++;
      addText(e.x, e.y - 12, 'SCRAM!', 'y');
    } else {
      e.state = 'stun'; e.t = 1.2;
      addText(e.x, e.y - 12, 'STUN', 'y');
      SFX.stun();
    }
  }
}
function updatePlayers(dt) {
  for (const p of players) {
    const inp = readMove(p.dev);
    if (p.queue > 0) { p.queue -= dt; if (p.cd <= 0 && p.ramT <= 0) playerAction(p); }
    if (p.cd > 0) p.cd = Math.max(0, p.cd - dt);
    if (p.actT > 0) p.actT -= dt;
    if (p.bonk > 0) p.bonk -= dt;
    const maxS = p.kind === 'dog' ? DOG_SPEED : GOAT_SPEED;
    if (p.ramT > 0) {
      p.ramT -= dt;
      if (len(inp.x, inp.y) > 0.2) {
        const nx = p.fx + inp.x * 2 * dt, ny = p.fy + inp.y * 2 * dt;
        const l = len(nx, ny) || 1;
        p.fx = nx / l; p.fy = ny / l;
      }
      const k = 0.55 + 0.45 * Math.max(0, p.ramT / RAM_DURATION);
      p.vx = p.fx * RAM_SPEED * k; p.vy = p.fy * RAM_SPEED * k;
      if (rand() < 0.7) dust(p.x - p.fx * 5, p.y, 1, 1, 18);
      if (p.ramT <= 0) { p.vx *= 0.35; p.vy *= 0.35; }
    } else {
      // gentle acceleration / deceleration curves: fluid, floating motion
      const moving = len(inp.x, inp.y) > 0.05;
      const rate = moving ? (p.kind === 'dog' ? 7 : 5.5) : (p.kind === 'dog' ? 5 : 3.8);
      const k = damp(rate, dt);
      const ovx = p.vx, ovy = p.vy;
      p.vx += (inp.x * maxS - p.vx) * k;
      p.vy += (inp.y * maxS - p.vy) * k;
      const sp = len(p.vx, p.vy);
      if (sp > 6) {
        const nfx = p.vx / sp, nfy = p.vy / sp;
        if (nfx * p.fx + nfy * p.fy < 0.2 && len(ovx, ovy) > 40) dust(p.x, p.y, 4, 2, 30);
      }
      updateFacing(p, dt, 6);
      if (sp > 60 && rand() < dt * 6) dust(p.x - p.fx * 4, p.y, 1, 1, 10);
    }
    const hit = moveBody(p, p.vx * dt, p.vy * dt, 3);
    if (hit && p.ramT > 0 && p.bonk <= 0) {
      p.bonk = 0.3; p.ramT = 0;
      p.vx *= -0.3; p.vy *= -0.3;
      addShake(2.5);
      dust(p.x + p.fx * 4, p.y, 8, 2, 40);
      leafBurst(p.x + p.fx * 6, p.y - 3);
      SFX.bump();
    }
    p.walk += len(p.vx, p.vy) * dt;
  }
  for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
    const a = players[i], b = players[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = len(dx, dy);
    if (d < 7 && d > 0.01) {
      const k = (7 - d) * 0.5;
      moveBody(a, -dx / d * k, -dy / d * k, 3);
      moveBody(b, dx / d * k, dy / d * k, 3);
    }
  }
  // shared camera leash: keep everyone on screen
  if (players.length > 1) {
    for (const p of players) {
      const nx = clamp(p.x, cam.x + 6, cam.x + W - 6), ny = clamp(p.y, cam.y + 16, cam.y + H - 4);
      if (!blocked(nx, ny)) { p.x = nx; p.y = ny; }
    }
  }
}

// ---------------------------------------------------------------------
// Herd: Boids (cohesion, separation, alignment) + panic vector,
// goats lead the flock, dogs press it from behind
// ---------------------------------------------------------------------
const NEIGHBOR_R = 26;
const SEP_R = 8;
function herdCenter() {
  let x = 0, y = 0, n = 0;
  for (const s of sheep) if (!s.penned) { x += s.x; y += s.y; n++; }
  if (!n) {
    if (players.length && !isMenu()) return { x: players[0].x, y: players[0].y };
    return { x: world.start ? world.start.x : world.w / 2, y: world.start ? world.start.y : world.h / 2 };
  }
  return { x: x / n, y: y / n };
}
function updateSheep(dt) {
  const threats = enemies.filter(e => e.state === 'hunt' || e.state === 'carry' || e.state === 'stun');
  const shepherds = isMenu() ? demo : players;
  const hc = herdCenter();
  for (const s of sheep) {
    let cx = 0, cy = 0, avx = 0, avy = 0, sx = 0, sy = 0, n = 0;
    for (const o of sheep) {
      if (o === s || o.penned !== s.penned) continue;
      const dx = o.x - s.x, dy = o.y - s.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < NEIGHBOR_R * NEIGHBOR_R) {
        n++; cx += o.x; cy += o.y; avx += o.vx; avy += o.vy;
        if (d2 < SEP_R * SEP_R) {
          const d = Math.sqrt(d2) || 0.01;
          const k = (SEP_R - d) / SEP_R;
          sx -= (dx / d) * k; sy -= (dy / d) * k;
        }
      }
    }
    let ax = 0, ay = 0;
    let threat = null, td = PANIC_RADIUS;
    if (!s.penned) for (const e of threats) {
      if (canopy(e.x, e.y) && e.state !== 'carry') continue;
      const d = len(e.x - s.x, e.y - s.y);
      if (d < td) { td = d; threat = e; }
    }
    const wasPanic = s.panic > 0;
    if (threat) { s.panic = 0.8; s.grazing = false; } else if (s.panic > 0) s.panic -= dt;
    if (s.herd > 0) s.herd -= dt;

    if (threat) {
      const fx = s.x - threat.x, fy = s.y - threat.y;
      const l = len(fx, fy) || 1;
      const urg = 1 + (1 - td / PANIC_RADIUS) * 0.6;
      ax += ((fx / l) * 58 * urg - s.vx) * 6;
      ay += ((fy / l) * 58 * urg - s.vy) * 6;
      ax += sx * 50; ay += sy * 50;
      if (!wasPanic && realTime - lastBaa > 0.25 && s.baaCd <= 0) { SFX.baa(true); lastBaa = realTime; s.baaCd = 1.2; }
    } else {
      if (n > 0) {
        cx /= n; cy /= n; avx /= n; avy /= n;
        ax += (cx - s.x) * 0.7; ay += (cy - s.y) * 0.7;
        ax += (avx - s.vx) * 1.1; ay += (avy - s.vy) * 1.1;
      }
      if (!s.penned) { ax += (hc.x - s.x) * 0.1; ay += (hc.y - s.y) * 0.1; }
      ax += sx * 110; ay += sy * 110;
      s.wander += rr(-2, 2) * dt;
      if (!s.grazing) { ax += Math.cos(s.wander) * 6; ay += Math.sin(s.wander) * 5; }
      s.grazeT -= dt;
      if (s.grazeT <= 0) {
        s.grazing = !s.grazing;
        s.grazeT = s.grazing ? rr(1.5, 4) : rr(1, 3);
        if (!s.grazing && rand() < 0.06 && realTime - lastBaa > 2 && state === 'PLAYING') { SFX.baa(false); lastBaa = realTime; }
      }
    }
    if (s.baaCd > 0) s.baaCd -= dt;
    for (const p of shepherds) {
      const dx = s.x - p.x, dy = s.y - p.y;
      const d = len(dx, dy) || 0.01;
      if (p.kind === 'dog') {
        if (d < 30) {
          const k = (30 - d) / 30;
          ax += (dx / d) * k * 230; ay += (dy / d) * k * 230;
          s.herd = Math.max(s.herd, 0.4); s.grazing = false;
        }
      } else {
        const R = p.ramT > 0 ? 14 : 10;
        if (d < R) {
          const k = (R - d) / R, f = p.ramT > 0 ? 700 : 220;
          ax += (dx / d) * k * f; ay += (dy / d) * k * f;
        } else if (!threat && d > 22 && d < 70 && !s.penned) {
          ax -= (dx / d) * 16; ay -= (dy / d) * 16;
          if (len(p.vx, p.vy) > 20) s.grazing = false;
        }
      }
    }
    for (let a = 0; a < 8; a++) {
      const ang = (a / 8) * Math.PI * 2;
      const ox = Math.cos(ang), oy = Math.sin(ang);
      if (blocked(s.x + ox * 6, s.y + oy * 5)) { ax -= ox * 70; ay -= oy * 70; }
    }
    s.vx += ax * dt; s.vy += ay * dt;
    const maxS = s.panic > 0 ? 62 : (s.herd > 0 ? 46 : (s.grazing ? 6 : 17));
    const sp = len(s.vx, s.vy);
    if (sp > maxS) { s.vx = s.vx / sp * maxS; s.vy = s.vy / sp * maxS; }
    if (s.panic <= 0) { const k = Math.max(0, 1 - dt * (s.grazing ? 4 : 1.4)); s.vx *= k; s.vy *= k; }
    moveBody(s, s.vx * dt, s.vy * dt, 2);
    if (world.goal) {
      const gx = s.x - world.goal.x, gy = (s.y - world.goal.y) / 0.8;
      const gd = len(gx, gy);
      if (!s.penned && gd < world.goalR - 6 && state === 'PLAYING') {
        s.penned = true; s.flash = 0.6; s.panic = 0;
        mission.penned++; delivered++;
        addText(s.x, s.y - 10, 'SAFE', 'y');
        SFX.pen();
      }
      if (s.penned && gd > world.goalR - 5) {
        const k = (world.goalR - 5) / gd;
        s.x = world.goal.x + gx * k; s.y = world.goal.y + gy * k * 0.8;
        s.vx *= 0.5; s.vy *= 0.5;
      }
    }
    updateFacing(s, dt, 5);
    s.walk += len(s.vx, s.vy) * dt;
    s.chew += dt;
    if (s.flash > 0) s.flash -= dt;
  }
}

// ---------------------------------------------------------------------
// Enemies: shadow wolves (from the forest) and bats (from the sky)
// ---------------------------------------------------------------------
function spawnEnemy(level) {
  const hc = herdCenter();
  const batChance = level < 2 ? 0 : Math.min(0.45, 0.15 + level * 0.05);
  const base = { vx: 0, vy: 0, fx: 1, fy: 0.3, t: 0, fear: 0, anim: rand() * 6, hits: {}, carry: null, flash: 0, phase: rand() * 6.28 };
  if (rand() < batChance) {
    const a = rand() * Math.PI * 2;
    const R = Math.max(W, H) * 0.6 + 20;
    const x = clamp(hc.x + Math.cos(a) * R, 4, world.w - 4), y = clamp(hc.y + Math.sin(a) * R, 4, world.h - 4);
    enemies.push(Object.assign({}, base, { type: 'bat', x: x, y: y, state: 'hunt', hp: 1,
      speed: Math.min(62, 34 + level * 3), accel: 120, alt: 10, alpha: false }));
  } else {
    const p = forestSpawn(hc.x, hc.y, 100, Math.max(170, Math.max(W, H) * 0.6));
    const alpha = level >= 3 && rand() < Math.min(0.4, (level - 2) * 0.09);
    enemies.push(Object.assign({}, base, { type: 'wolf', x: p.x, y: p.y, state: 'emerge', t: 1.0, hp: alpha ? 2 : 1,
      speed: Math.min(76, 42 + level * 3.2) * (alpha ? 0.92 : 1), accel: 200, alt: 0, alpha: alpha }));
  }
}
function nearestSheep(x, y) {
  let b = null, bd = 1e9;
  for (const s of sheep) {
    if (s.penned) continue;
    const d = (s.x - x) * (s.x - x) + (s.y - y) * (s.y - y);
    if (d < bd) { bd = d; b = s; }
  }
  return b;
}
function steerTo(e, tx, ty, speed, dt) {
  let dx = tx - e.x, dy = ty - e.y;
  const d = len(dx, dy) || 1;
  dx /= d; dy /= d;
  const k = Math.min(1, (e.accel / Math.max(speed, 1)) * dt);
  e.vx += (dx * speed - e.vx) * k;
  e.vy += (dy * speed - e.vy) * k;
  return d;
}
function killEnemy(e, i) {
  popBurst(e.x, e.y - e.alt - 3, 'i');
  SFX.pop();
  enemies.splice(i, 1);
}
function releaseCarried(e) {
  if (!e.carry) return;
  const s = e.carry;
  e.carry = null;
  let x = e.x, y = e.y;
  if (blocked(x, y)) { const hc = herdCenter(); x = lerp(x, hc.x, 0.3); y = lerp(y, hc.y, 0.3); }
  if (blocked(x, y) && players.length) { x = players[0].x; y = players[0].y; }
  s.x = x; s.y = y; s.vx = rr(-20, 20); s.vy = rr(-20, 20);
  s.panic = 1; s.flash = 0.6;
  sheep.push(s);
  rescued++;
  addText(s.x, s.y - 12, 'SAVED', 'y');
  SFX.rescue();
  woolPuff(s.x, s.y, 6);
}
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.anim += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.state === 'emerge') {
      e.t -= dt;
      if (e.t <= 0) e.state = 'hunt';
      continue;
    }
    if (e.state === 'launched') {
      e.t -= dt;
      const k = Math.max(0, 1 - dt * 2.5);
      e.vx *= k; e.vy *= k;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.alt += dt * 30;
      if (rand() < 0.5) addParticle({ x: e.x, y: e.y - e.alt - 2, vx: 0, vy: 0, life: 0.2, max: 0.2, col: 'y', g: 0, drag: 0, kind: 'px' });
      if (e.t <= 0) killEnemy(e, i);
      continue;
    }
    if (e.state === 'stun') {
      e.t -= dt;
      const k = Math.max(0, 1 - dt * 5);
      e.vx *= k; e.vy *= k;
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.t <= 0) {
        if (e.thenFlee) { e.state = 'flee'; e.exit = forestExit(e.x, e.y); }
        else e.state = 'hunt';
      }
      continue;
    }
    let spd = e.speed;
    if (e.state === 'hunt') {
      const target = nearestSheep(e.x, e.y);
      if (!target) { e.state = 'flee'; e.exit = forestExit(e.x, e.y); }
      else {
        const d = len(target.x - e.x, target.y - e.y);
        if (e.type === 'wolf' && d < 26) spd *= 1.35;
        let tx = target.x, ty = target.y;
        if (e.type === 'bat') {
          const pxv = -(target.y - e.y) / (d || 1), pyv = (target.x - e.x) / (d || 1);
          const w = Math.sin(e.anim * 4 + e.phase) * Math.min(20, d * 0.4);
          tx += pxv * w; ty += pyv * w;
        }
        steerTo(e, tx, ty, spd, dt);
        if (len(target.x - e.x, target.y - e.y) < 5) {
          const idx = sheep.indexOf(target);
          if (idx >= 0) sheep.splice(idx, 1);
          e.carry = target;
          e.state = 'carry';
          e.exit = forestExit(e.x, e.y);
          woolPuff(target.x, target.y, 8);
          SFX.capture();
          if (realTime - lastBaa > 0.15) { SFX.baa(true); lastBaa = realTime; }
          addText(target.x, target.y - 12, 'HELP!', 'r');
        }
      }
    } else if (e.state === 'carry' || e.state === 'flee') {
      if (!e.exit) e.exit = forestExit(e.x, e.y);
      const d = steerTo(e, e.exit.x, e.exit.y, spd * (e.carry ? 0.66 : 1.25), dt);
      if (d < 5 || e.x < -8 || e.y < -8 || e.x > world.w + 8 || e.y > world.h + 8) {
        if (e.carry) {
          lostCount++;
          addText(clamp(e.x, cam.x + 20, cam.x + W - 20), clamp(e.y, cam.y + 24, cam.y + H - 10), 'LOST', 'r');
          SFX.lost();
        }
        enemies.splice(i, 1);
        continue;
      }
    }
    for (const o of enemies) {
      if (o === e || o.type !== e.type || o.state === 'launched' || o.state === 'emerge') continue;
      const dx = e.x - o.x, dy = e.y - o.y, d2 = dx * dx + dy * dy;
      if (d2 < 64 && d2 > 0.001) { const d = Math.sqrt(d2); e.vx += dx / d * 90 * dt; e.vy += dy / d * 90 * dt; }
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    updateFacing(e, dt, 4);
    if (e.type === 'bat') e.alt = 10 + Math.sin(e.anim * 5 + e.phase) * 2;
  }
}
function checkRamHits() {
  for (const p of players) {
    if (p.kind !== 'goat' || p.ramT <= 0) continue;
    const hx = p.x + p.fx * 5, hy = p.y - 3 + p.fy * 4;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.state === 'launched' || e.state === 'emerge' || e.hits[p.slot] === p.ramId) continue;
      const ey = e.y - (e.type === 'bat' ? Math.min(e.alt, 8) : 3);
      if (len(e.x - hx, ey - hy) > (e.type === 'bat' ? 10 : 9)) continue;
      e.hits[p.slot] = p.ramId;
      let dx = e.x - p.x, dy = e.y - p.y;
      const l = len(dx, dy) || 1;
      dx = dx / l * 0.5 + p.fx * 0.8; dy = dy / l * 0.5 + p.fy * 0.8;
      const l2 = len(dx, dy) || 1; dx /= l2; dy /= l2;
      e.hp--; e.flash = 0.15;
      impactBurst((e.x + p.x) / 2, ey);
      dust(e.x, e.y, 6, 3, 40);
      SFX.impact();
      addShake(3.5);
      hitStop = 0.05;
      if (e.carry) releaseCarried(e);
      if (e.hp <= 0) {
        e.state = 'launched'; e.t = 0.38;
        e.vx = dx * 240 + rr(-20, 20); e.vy = dy * 240 + rr(-20, 20);
        score++; mission.kills++;
        addText(e.x, e.y - 14, '+1', 'y');
      } else {
        e.state = 'stun'; e.t = 1.4; e.vx = dx * 170; e.vy = dy * 170;
        addText(e.x, e.y - 14, 'STUN', 'y');
        SFX.stun();
      }
      p.vx *= 0.75; p.vy *= 0.75;
    }
  }
}

// ---------------------------------------------------------------------
// Modes: ESCORT missions and DEFEND waves
// ---------------------------------------------------------------------
function placePlayers(cx, cy) {
  players.forEach((p, i) => {
    const a = (i / Math.max(1, players.length)) * Math.PI * 2 + Math.PI / 2;
    let x = cx + Math.cos(a) * 20, y = cy + Math.sin(a) * 12 + 22;
    if (blocked(x, y)) { x = cx + i * 4; y = cy + 16; }
    makePlayerBody(p, x, y);
    p.fy = -1;
  });
}
function startRun() {
  score = 0; rescued = 0; delivered = 0; lostCount = 0; newBest = false; gameOverDelay = 0;
  enemies = []; particles = []; texts = []; fireflies = [];
  paused = false;
  goScreen('PLAYING');
  if (mode === 'escort') startMission(1, 12);
  else startDefend();
}
function startDefend() {
  world = renderWorld(makeDefendWorld(4242));
  spawnHerd(world.start.x, world.start.y, 12);
  placePlayers(world.start.x, world.start.y);
  snapCam(world.start.x, world.start.y);
  startWave(1);
}
function startWave(n) {
  wave.n = n; wave.phase = 'intro'; wave.t = 2.2;
  wave.toSpawn = 2 + n * 2;
  wave.interval = Math.max(0.6, 2.4 - n * 0.15);
  wave.spawnT = 0.3;
  banner = { t: 2.4, a: 'WAVE ' + n, b: n === 1 ? 'GUARD THE HENGE' : 'THEY COME AGAIN' };
  dayTarget = clamp((n - 1) / 8, 0, 1);
  SFX.wave();
}
function startMission(n, herdN) {
  mission.n = n; mission.herdStart = herdN; mission.penned = 0; mission.time = 0; mission.kills = 0;
  mission.interval = Math.max(1.9, 5.5 - n * 0.5);
  mission.cap = Math.min(8, 2 + n);
  mission.spawnT = 5;
  world = renderWorld(makeEscortWorld(n, 1000 + n * 77 + Math.floor(rand() * 1000)));
  enemies = [];
  spawnHerd(world.start.x, world.start.y - 6, herdN);
  placePlayers(world.start.x, world.start.y);
  snapCam(world.start.x, world.start.y - 40);
  banner = { t: 3, a: 'MISSION ' + n, b: 'HERD THEM TO THE RED PIN' };
  dayTarget = clamp((n - 1) / 5, 0, 1);
  SFX.wave();
}
function updateDefend(dt) {
  if (wave.phase === 'intro') { wave.t -= dt; if (wave.t <= 0) wave.phase = 'active'; }
  else if (wave.phase === 'active') {
    if (wave.toSpawn > 0) {
      wave.spawnT -= dt;
      if (wave.spawnT <= 0) {
        spawnEnemy(wave.n); wave.toSpawn--;
        if (wave.n >= 4 && wave.toSpawn > 0 && rand() < 0.25) { spawnEnemy(wave.n); wave.toSpawn--; }
        wave.spawnT = wave.interval * rr(0.7, 1.3);
      }
    } else if (enemies.length === 0) {
      wave.phase = 'clear'; wave.t = 2.6;
      let sub = 'THE FLOCK RESTS';
      if (sheep.length > 0 && sheep.length < SHEEP_MAX) {
        const hc = herdCenter();
        const s = makeSheep(hc.x + rr(-10, 10), hc.y + rr(-10, 10));
        if (!blocked(s.x, s.y)) { sheep.push(s); s.flash = 1; sub = 'A LAMB RETURNS +1'; }
      }
      banner = { t: 2.4, a: 'CLEAR!', b: sub };
      SFX.clear();
    }
  } else if (wave.phase === 'clear') { wave.t -= dt; if (wave.t <= 0) startWave(wave.n + 1); }
}
function updateEscort(dt) {
  mission.time += dt;
  dayTarget = clamp((mission.n - 1) / 5 + Math.min(0.15, mission.time / 600), 0, 1);
  const active = sheep.filter(s => !s.penned).length;
  if (active > 0) {
    mission.spawnT -= dt;
    const live = enemies.filter(e => e.state !== 'launched' && e.state !== 'flee').length;
    if (mission.spawnT <= 0 && live < mission.cap) {
      spawnEnemy(mission.n);
      mission.spawnT = mission.interval * rr(0.7, 1.3);
    }
  }
  const carrying = enemies.some(e => e.carry);
  if (active === 0 && !carrying && mission.penned > 0) {
    goScreen('RESULTS');
    for (const e of enemies) if (e.state !== 'launched') { e.state = 'flee'; e.exit = forestExit(e.x, e.y); }
    SFX.clear();
  }
}
function nextMission() {
  const herdN = Math.min(SHEEP_MAX, mission.penned + 2);
  goScreen('PLAYING');
  startMission(mission.n + 1, herdN);
}
function checkGameOver(dt) {
  const carrying = enemies.some(e => e.carry);
  if (sheep.length === 0 && !carrying) {
    gameOverDelay += dt;
    if (gameOverDelay > 1.2) {
      goScreen('GAMEOVER');
      newBest = saveBest();
      SFX.gameover();
    }
  } else gameOverDelay = 0;
}
function updateFireflies(dt) {
  const want = dayProgress > 0.55 ? Math.floor((dayProgress - 0.55) * 40) : 0;
  if (fireflies.length < want && rand() < dt * 3) {
    fireflies.push({ x: cam.x + rr(0, W), y: cam.y + rr(0, H), ph: rand() * 6.28, vx: rr(-5, 5), vy: rr(-4, 4), life: rr(4, 9) });
  }
  for (let i = fireflies.length - 1; i >= 0; i--) {
    const f = fireflies[i];
    f.life -= dt; f.ph += dt * 3;
    f.vx = clamp(f.vx + rr(-16, 16) * dt, -8, 8); f.vy = clamp(f.vy + rr(-16, 16) * dt, -6, 6);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.life <= 0 || fireflies.length > want + 4) fireflies.splice(i, 1);
  }
}

function freeSlot() {
  for (let s = 0; s < 4; s++) if (!players.some(p => p.slot === s)) return s;
  return -1;
}
function normDev(dev) {
  if (dev === 'mouse') return players.some(p => p.dev === 'kbL') && !players.some(p => p.dev === 'kbR') ? 'kbR' : 'kbL';
  if (dev === 'kb') return 'kbL';
  return dev;
}
function joinPlayer(dev) {
  dev = normDev(dev);
  if (players.some(p => p.dev === dev)) return null;
  const slot = freeSlot();
  if (slot < 0) return null;
  const p = { slot: slot, dev: dev, kind: slot % 2 === 0 ? 'goat' : 'dog', ready: false };
  makePlayerBody(p, 0, 0);

}

}

function listEvent(ev) {

// Update
// ---------------------------------------------------------------------
function update(dt) {

  stateTime += dt;
  pollPads();
  dayProgress += (dayTarget - dayProgress) * damp(0.5, dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 14);
  if (isMenu()) {
    if (state === 'PLAYERS') {
      if (players.length && players.every(p => p.ready)) {
        if (startCountdown < 0) startCountdown = 1.0;
        startCountdown -= dt;
        if (startCountdown <= 0) { startRun(); return; }
      } else startCountdown = -1;
    }
    updateDemo(dt);
    updateSheep(dt);
    updateParticles(dt);
    updateCamera(dt);
    return;
  }
  if (state === 'PLAYING') {
    if (paused) return;
    if (hitStop > 0) { hitStop -= dt; updateParticles(dt * 0.25); return; }
    updatePlayers(dt);
    checkRamHits();
    updateSheep(dt);
    updateEnemies(dt);
    if (mode === 'defend') updateDefend(dt); else updateEscort(dt);
    if (state === 'PLAYING') checkGameOver(dt);
    if (banner.t > 0) banner.t -= dt;
  } else {
    updatePlayers(dt);
    updateSheep(dt);
    updateEnemies(dt);
  }

  text('GOAT', W / 2, cy0, 'w', { s: big, align: 'center', outline: 'k' });
  text('GUARDIAN', W / 2, cy0 + big * 5 + 6, 'y', { s: 2, align: 'center', outline: 'k' });
  text('A HERDING TALE', W / 2, cy0 + big * 5 + 22, 'l', { align: 'center', outline: 'k' });
  const w = Math.min(W - 24, 120);
  const y = Math.max(cy0 + big * 5 + 40, Math.round(H * 0.56));
  rect(Math.round(W / 2 - w / 2) - 2, y - 2, w + 4, 3 * 14 + 2, 'k');
  drawList(screenItems(), W / 2, y, w, 14);
  const fy = H - 10;
  rect(0, fy - 3, W, 13, 'k');
  if (best.escort || best.defend) text('BEST  ESCORT ' + best.escort + '  DEFEND ' + best.defend, W / 2, fy, 'y', { align: 'center' });
  else text('1-4 PLAYERS  GOATS AND DOGS', W / 2, fy, 's', { align: 'center' });
  text('V0.3', W - 3, fy - 12, 'i', { align: 'right', outline: 'k' });
}
function drawModeSelect() {
  screenBg();
  header('SELECT MODE');
  const w = colW(), x = Math.round(W / 2 - w / 2);
  const items = screenItems();
  const cards = [
    { title: 'ESCORT', l1: 'HERD THE FLOCK FROM PIN', l2: 'TO PIN ACROSS THE WOODS', best: best.escort, icon: SP.pinGoal },
    { title: 'DEFEND', l1: 'HOLD THE STONE HENGE', l2: 'AGAINST ENDLESS WAVES', best: best.defend, icon: SP.pillar }
  ];
  const ch = Math.min(46, Math.floor((H - 100) / 2));
  let y = Math.max(30, Math.round((H - 40 - (2 * ch + 6 + 16)) / 2) + 6);
  cards.forEach((c, i) => {
    const sel = ui.cursor === i;
    rect(x, y, w, ch, sel ? 'i' : 'k');
    frame(x, y, w, ch, sel ? 'y' : 'i');
    rect(x + 6, y + 6, 18, ch - 12, 'g');
    rect(x + 6, y + ch - 8, 18, 2, 'h');
    G.drawImage(c.icon.r, Math.round(x + 15 - c.icon.w / 2), y + ch - 7 - c.icon.h);
    text((sel ? '> ' : '') + c.title, x + 30, y + 7, sel ? 'y' : 'w');
    text(c.l1, x + 30, y + 16, 'l');
    text(c.l2, x + 30, y + 23, 'l');
    text('BEST ' + c.best, x + 30, y + ch - 10, 's');
    hits.push({ x: x, y: y, w: w, h: ch, i: i });
    y += ch + 6;
  });
  ui.cursor = clamp(ui.cursor, 0, items.length - 1);
  const by = y + 4;
  const bw = 60, bx = Math.round(W / 2 - bw / 2);
  const sel = ui.cursor === 2;
  rect(bx, by, bw, 12, sel ? 'i' : 'k');
  if (sel) rect(bx, by, 2, 12, 'y');
  text('BACK', W / 2, by + 4, sel ? 'y' : 'l', { align: 'center' });
  hits.push({ x: bx, y: by, w: bw, h: 12, i: 2 });
  text('UP/DOWN TO CHOOSE  ACTION TO PICK', W / 2, H - 32, 's', { align: 'center' });
}
function drawPlayerSelect() {
  screenBg();
  header(mode === 'escort' ? 'ESCORT - PLAYERS' : 'DEFEND - PLAYERS');
  // back button
  rect(4, 5, 30, 11, 'i');
  text('<', 7, 8, 'l'); text('BACK', 14, 8, 'l');
  hits.push({ x: 0, y: 0, w: 36, h: 20, fn: () => { goScreen('MODE'); SFX.back(); } });
  const w = colW(), x = Math.round(W / 2 - w / 2);
  const bottom = 62;
  const ch = clamp(Math.floor((H - 28 - bottom) / 4) - 4, 30, 42);
  const top = Math.max(28, Math.round((H - bottom + 24 - 4 * (ch + 4)) / 2));
  for (let s = 0; s < 4; s++) {
    const y = top + s * (ch + 4);
    const p = players.find(q => q.slot === s);
    rect(x, y, w, ch, p ? 'k' : 'k');
    frame(x, y, w, ch, p ? (p.ready ? 'y' : 'i') : 'i');
    rect(x, y, 3, ch, P_COL[s]);
    text('P' + (s + 1), x + 7, y + 4, P_COL[s]);
    if (!p) {
      text('OPEN SLOT', x + 7, y + 14, 'l');
      text('PRESS ACTION OR TAP TO JOIN', x + 7, y + 22, 's');
      hits.push({ x: x, y: y, w: w, h: ch, fn: (dev) => joinPlayer(dev === 'touch' ? 'touch' : normDev(dev)) });
      continue;
    }
    const sp = SP[p.kind].SE[Math.floor(realTime * 4) % 2];
    const bx = x + 8, by = y + 12, bw = 22, bh = ch - 16;
    rect(bx, by, bw, bh, 'g');
    rect(bx, by + bh - 3, bw, 3, 'h');
    G.drawImage(sp.r, 0, 0, sp.w, sp.h, Math.round(bx + bw / 2 - sp.w), by + bh - 2 - sp.h * 2, sp.w * 2, sp.h * 2);
    const tx = x + 36;
    text('<', tx, y + 5, 'l');
    text(p.kind === 'goat' ? 'GOAT' : 'DOG', tx + 8, y + 5, 'w');
    text('>', tx + 8 + textWidth(p.kind === 'goat' ? 'GOAT' : 'DOG') + 4, y + 5, 'l');
    hits.push({ x: tx - 2, y: y + 2, w: 46, h: 10, fn: () => { p.kind = p.kind === 'goat' ? 'dog' : 'goat'; p.ready = false; SFX.move(); } });
    text(p.kind === 'goat' ? 'RAMS PREDATORS' : 'BARKS + HERDS', tx, y + 14, 'l');
    text(DEVICE_NAMES[p.dev] || p.dev, tx, y + 22, 's');
    const rw = 34, rx = x + w - rw - 5, ry = y + ch - 14;
    rect(rx, ry, rw, 10, p.ready ? 'y' : 'i');
    text(p.ready ? 'READY' : 'READY?', rx + rw / 2, ry + 3, p.ready ? 'k' : 'l', { align: 'center' });
    hits.push({ x: rx - 2, y: ry - 2, w: rw + 4, h: 14, fn: () => { p.ready = !p.ready; SFX.click(); } });
  }
  const fy = H - bottom + 4;
  if (startCountdown >= 0) {
    const bw = colW();
    rect(Math.round(W / 2 - bw / 2), fy, bw, 12, 'i');
    rect(Math.round(W / 2 - bw / 2), fy, Math.round(bw * (1 - startCountdown / 1.0)), 12, 'y');
    text('STARTING', W / 2, fy + 4, 'k', { align: 'center' });
  } else {
    text('LEFT/RIGHT: GOAT OR DOG', W / 2, fy, 'l', { align: 'center' });
    text('ACTION: READY   BACK: LEAVE', W / 2, fy + 8, 'l', { align: 'center' });
  }
  text('GAME STARTS WHEN ALL ARE READY', W / 2, H - 32, 's', { align: 'center' });
}
function drawOptions() {
  screenBg();
  header('OPTIONS');
  const items = screenItems();
  drawList(items, W / 2, 34, colW(), 16);
  text('LEFT/RIGHT OR ACTION TO CHANGE', W / 2, 34 + items.length * 16 + 8, 's', { align: 'center' });
  text('F: FULLSCREEN   M: SOUND', W / 2, H - 32, 's', { align: 'center' });
}
function drawHowTo() {
  screenBg();
  header('HOW TO PLAY');
  const w = colW(), x = Math.round(W / 2 - w / 2);
  let y = 28;
  const line = (s, col) => { text(s, x + 4, y, col || 'l'); y += 8; };
  const icon = (sp) => { rect(x, y, 20, 14, 'g'); rect(x, y + 12, 20, 2, 'h'); G.drawImage(sp.r, Math.round(x + 10 - sp.w / 2), y + 12 - sp.h); };
  icon(SP.goat.SE[0]);
  text('GOAT', x + 26, y + 1, 'y'); text('RAM CHARGE SMASHES FOES', x + 26, y + 8, 'l'); y += 20;
  icon(SP.dog.SE[0]);
  text('DOG', x + 26, y + 1, 'y'); text('BARK SHOVES SHEEP + SCARES', x + 26, y + 8, 'l'); y += 20;
  icon(SP.sheep.SE[0]);
  text('SHEEP', x + 26, y + 1, 'y'); text('FOLLOW GOATS, FLEE DOGS', x + 26, y + 8, 'l'); y += 22;
  line('ESCORT: HERD THE FLOCK INTO', 'w');
  line('THE PEN AT THE RED PIN.', 'w');
  line('DEFEND: SURVIVE THE WAVES.', 'w');
  line('HIT A THIEF TO SAVE ITS SHEEP.', 'w');
  y += 4;
  line('KEYS  WASD+SPACE / ARROWS+ENTER', 's');
  line('PADS  STICK + A   START: PAUSE', 's');
  line('TOUCH DRAG LEFT  TAP RIGHT', 's');
  line('P PAUSE  M SOUND  F FULLSCREEN', 's');
  const by = Math.min(H - 40, y + 6);
  drawList(screenItems(), W / 2, by, 60, 14);
}
function drawPause() {
  ditherDim(true);
  const items = screenItems();
  const y0 = Math.round(H * 0.3);
  text('PAUSED', W / 2, y0, 'w', { s: 2, align: 'center', outline: 'k' });
  text('SCORE ' + score, W / 2, y0 + 16, 'y', { align: 'center' });
  drawList(items, W / 2, y0 + 30, Math.min(W - 24, 130), 14);
}
function drawResults() {
  ditherDim(stateTime > 0.3);
  const total = mission.herdStart;
  const cx = W / 2, w = Math.min(W - 24, 130), x = Math.round(cx - w / 2);
  let y = Math.round(H * 0.2);
  text('MISSION ' + mission.n, cx, y, 'w', { s: 2, align: 'center', outline: 'k' }); y += 16;
  text('COMPLETE', cx, y, 'y', { s: 2, align: 'center', outline: 'k' }); y += 22;
  const row = (a, b, c) => { text(a, x + 4, y, 'l'); text(String(b), x + w - 4, y, c, { align: 'right' }); y += 10; };
  row('DELIVERED', mission.penned + '/' + total, 'w');
  row('PREDATORS', mission.kills, 'w');
  row('SCORE', score, 'y');
  const stars = mission.penned >= total ? 3 : (mission.penned >= total * 0.66 ? 2 : 1);
  for (let i = 0; i < 3; i++) text('*', cx - 14 + i * 10, y + 2, i < stars ? 'y' : 'i', { s: 2 });
  y += 20;
  drawList(screenItems(), cx, y, w, 14, stateTime >= 0.8);
}
function drawGameOver() {
  ditherDim(stateTime > 0.3);
  if (stateTime < 0.3) return;
  const cx = W / 2, w = Math.min(W - 24, 130), x = Math.round(cx - w / 2);
  let y = Math.round(H * 0.16);
  text('THE FLOCK', cx, y, 'w', { s: 2, align: 'center', outline: 'k' }); y += 16;
  text('IS LOST', cx, y, 'r', { s: 2, align: 'center', outline: 'k' }); y += 22;
  const row = (a, b, c) => { text(a, x + 4, y, 'l'); text(String(b), x + w - 4, y, c, { align: 'right' }); y += 10; };
  row('SCORE', score, 'y');
  if (mode === 'escort') { row('MISSION', mission.n, 'w'); row('DELIVERED', delivered, 'w'); }
  else row('WAVE', wave.n, 'w');
  row('RESCUED', rescued, 'w');
  row('BEST', best[mode], 'y');
  if (newBest) { text('NEW BEST!', cx, y + 2, 'y', { align: 'center', outline: 'k' }); y += 10; }
  y += 8;
  drawList(screenItems(), cx, y, w, 14, stateTime >= 0.8);
}

function render() {
  const sx = shake > 0 ? rr(-shake, shake) : 0;
  const sy = shake > 0 ? rr(-shake, shake) : 0;
  const camX = cam.x + sx, camY = cam.y + sy;
  const ix = Math.floor(camX), iy = Math.floor(camY);
  camFracX = camX - ix; camFracY = camY - iy;
  OX = ix - 1; OY = iy - 1;
  drawWorldScene();
  buildRemap(dayProgress);
  applyRemap();
  bctx.fillStyle = PAL_DUSK.y;
  for (const f of fireflies) if (Math.sin(f.ph) > -0.2) bctx.fillRect(wx(f.x), wy(f.y), 1, 1);
  drawHUD();
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.imageSmoothingEnabled = false;
  const k = PIX;
  vctx.drawImage(buf, 0, 0, BW, BH, Math.round((-1 - camFracX) * k), Math.round((-1 - camFracY) * k), BW * k, BH * k);
  vctx.drawImage(hud, 0, 0, W, H, 0, 0, W * k, H * k);
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
world = renderWorld(makeDefendWorld(4242));
const menuWorld = world;
resize();
spawnHerd(world.start.x, world.start.y, 10);
makeDemo();
snapCam(world.start.x, world.start.y);
let lastTs = null;
function tick(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
view.focus();
</script>
