'use strict';

/* =====================================================================
   GOAT GUARDIAN
   Single-file procedural pixel-art herding defense game.
   - Internal resolution 480x270, scaled to viewport with nearest-neighbour.
   - All art drawn from pixel matrices / per-pixel generators.
   - All sound synthesized with the Web Audio API.
   ===================================================================== */

// ---------------------------------------------------------------------
// Canvas setup
// ---------------------------------------------------------------------
const W = 480;
const H = 270;
const view = document.getElementById('game');
const vctx = view.getContext('2d');
const buf = document.createElement('canvas');
buf.width = W;
buf.height = H;
const ctx = buf.getContext('2d');
ctx.imageSmoothingEnabled = false;

let viewScale = 1;
let viewCssW = W;
let viewCssH = H;

function resize() {
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  let s = Math.min(ww / W, wh / H);
  // Prefer integer scaling when it still fills most of the screen.
  if (s >= 2 && Math.floor(s) / s > 0.9) s = Math.floor(s);
  viewScale = s;
  viewCssW = Math.floor(W * s);
  viewCssH = Math.floor(H * s);
  const dpr = window.devicePixelRatio || 1;
  view.style.width = viewCssW + 'px';
  view.style.height = viewCssH + 'px';
  view.width = Math.max(1, Math.round(viewCssW * dpr));
  view.height = Math.max(1, Math.round(viewCssH * dpr));
  vctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}

// ---------------------------------------------------------------------
// Math helpers / RNG
// ---------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = Math.random;
function rr(a, b) { return a + rand() * (b - a); }
function ri(a, b) { return Math.floor(rr(a, b + 1)); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function len(x, y) { return Math.sqrt(x * x + y * y); }
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
const BAYER = [
  [0, 8, 2, 10],
  [12, 4, 14, 6],
  [3, 11, 1, 9],
  [15, 7, 13, 5]
];

// ---------------------------------------------------------------------
// Sprite construction from pixel matrices
// ---------------------------------------------------------------------
function makeSprite(rows, pal) {
  let w = 0;
  for (const r of rows) w = Math.max(w, r.length);
  const h = rows.length;
  const c = makeCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || '.';
      if (ch === '.' || !pal[ch]) continue;
      const rgb = hexToRgb(pal[ch]);
      const i = (y * w + x) * 4;
      img.data[i] = rgb[0];
      img.data[i + 1] = rgb[1];
      img.data[i + 2] = rgb[2];
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function flipCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.translate(src.width, 0);
  g.scale(-1, 1);
  g.drawImage(src, 0, 0);
  return c;
}
function whiteCanvas(src) {
  const c = makeCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, src.width, src.height);
  return c;
}
// A sprite "pair" holds right- and left-facing canvases plus white flash versions.
function spritePair(rows, pal) {
  const r = makeSprite(rows, pal);
  const l = flipCanvas(r);
  return { r: r, l: l, wr: whiteCanvas(r), wl: whiteCanvas(l), w: r.width, h: r.height };
}

// Draw sprite anchored at bottom-centre (feet).
function drawSpr(pair, x, y, faceLeft, flash) {
  const img = flash ? (faceLeft ? pair.wl : pair.wr) : (faceLeft ? pair.l : pair.r);
  ctx.drawImage(img, Math.round(x - pair.w / 2), Math.round(y - pair.h));
}
function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(10,24,12,0.35)';
  const x0 = Math.round(x - w / 2);
  const yy = Math.round(y);
  ctx.fillRect(x0 + 1, yy - 1, w - 2, 3);
  ctx.fillRect(x0, yy, w, 1);
}

// ---------------------------------------------------------------------
// Pixel font (3x5)
// ---------------------------------------------------------------------
const FONT = {
  'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011', 'D': '110101101101110',
  'E': '111100110100111', 'F': '111100110100100', 'G': '011100101101011', 'H': '101101111101101',
  'I': '111010010010111', 'J': '001001001101010', 'K': '101101110101101', 'L': '100100100100111',
  'M': '101111101101101', 'N': '111101101101101', 'O': '111101101101111', 'P': '110101110100100',
  'Q': '010101101110011', 'R': '110101110101101', 'S': '011100010001110', 'T': '111010010010010',
  'U': '101101101101111', 'V': '101101101101010', 'W': '101101111111101', 'X': '101101010101101',
  'Y': '101101010010010', 'Z': '111001010100111',
  '0': '111101101101111', '1': '010110010010111', '2': '110001010100111', '3': '110001010001110',
  '4': '101101111001001', '5': '111100110001110', '6': '011100111101111', '7': '111001010010010',
  '8': '111101111101111', '9': '111101111001110',
  ':': '000010000010000', '.': '000000000000010', '!': '010010010000010', '-': '000000111000000',
  '/': '001001010100100', '+': '000010111010000', "'": '010010000000000', ',': '000000000010100',
  '?': '110001010000010', '(': '001010010010001', ')': '100010010010100', '>': '100010001010100',
  '<': '001010100010001', '=': '000111000111000', 'x': '000101010101000', ' ': '000000000000000'
};
function textWidth(str, s) {
  return str.length ? (str.length * 4 - 1) * s : 0;
}
function drawTextRaw(str, x, y, col, s) {
  ctx.fillStyle = col;
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]];
    if (g) {
      for (let j = 0; j < 15; j++) {
        if (g[j] === '1') ctx.fillRect(cx + (j % 3) * s, y + ((j / 3) | 0) * s, s, s);
      }
    }
    cx += 4 * s;
  }
}
// opts: { s, align, shadow, outline }
function drawText(str, x, y, col, opts) {
  const o = opts || {};
  const s = o.s || 1;
  str = String(str).toUpperCase().replace(/X(?=\d)/g, 'x');
  const w = textWidth(str, s);
  if (o.align === 'center') x -= Math.floor(w / 2);
  else if (o.align === 'right') x -= w;
  x = Math.round(x);
  y = Math.round(y);
  if (o.outline) {
    drawTextRaw(str, x - s, y, o.outline, s);
    drawTextRaw(str, x + s, y, o.outline, s);
    drawTextRaw(str, x, y - s, o.outline, s);
    drawTextRaw(str, x, y + s, o.outline, s);
    drawTextRaw(str, x + s, y + s, o.outline, s);
  } else if (o.shadow) {
    drawTextRaw(str, x + Math.max(1, s >> 1), y + Math.max(1, s >> 1), o.shadow, s);
  }
  drawTextRaw(str, x, y, col, s);
}

// ---------------------------------------------------------------------
// Audio (Web Audio API synthesis)
// ---------------------------------------------------------------------
let AC = null;
let master = null;
let noiseBuf = null;
let muted = false;

function initAudio() {
  if (AC) {
    if (AC.state === 'suspended') AC.resume();
    return;
  }
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
  } catch (e) {
    AC = null;
    return;
  }
  master = AC.createGain();
  master.gain.value = muted ? 0 : 0.45;
  master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 1.0), AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function audioReady() {
  return AC && master && AC.state !== 'closed';
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : 0.45, AC.currentTime, 0.02);
}
function envGain(t0, attack, peak, decay) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  return g;
}
function tone(type, f0, f1, dur, vol, t0, filter) {
  if (!audioReady()) return;
  const t = t0 !== undefined ? t0 : AC.currentTime;
  const o = AC.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  const g = envGain(t, 0.005, vol, dur);
  if (filter) {
    const f = AC.createBiquadFilter();
    f.type = filter.type;
    f.frequency.setValueAtTime(filter.freq, t);
    if (filter.freq1) f.frequency.exponentialRampToValueAtTime(filter.freq1, t + dur);
    f.Q.value = filter.q || 1;
    o.connect(f);
    f.connect(g);
  } else {
    o.connect(g);
  }
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function noise(dur, type, freq, vol, q, t0, freq1) {
  if (!audioReady()) return;
  const t = t0 !== undefined ? t0 : AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t);
  if (freq1) f.frequency.exponentialRampToValueAtTime(freq1, t + dur);
  f.Q.value = q || 1;
  const g = envGain(t, 0.004, vol, dur);
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start(t, Math.random() * 0.5);
  src.stop(t + dur + 0.05);
}
const SFX = {
  dash() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    tone('square', 90, 620, 0.2, 0.22, t, { type: 'lowpass', freq: 900, freq1: 3200, q: 4 });
    tone('sawtooth', 60, 300, 0.18, 0.12, t);
    noise(0.22, 'bandpass', 600, 0.25, 1.5, t, 3000);
  },
  impact() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    noise(0.32, 'lowpass', 700, 0.9, 1.2, t, 120);
    tone('sine', 150, 36, 0.28, 0.95, t);
    tone('square', 220, 60, 0.06, 0.2, t, { type: 'lowpass', freq: 1200 });
  },
  pop() {
    if (!audioReady()) return;
    const t = AC.currentTime + 0.02;
    tone('triangle', 700, 1700, 0.07, 0.35, t);
    tone('square', 1500, 2600, 0.06, 0.12, t + 0.05, { type: 'highpass', freq: 900 });
    noise(0.14, 'highpass', 4200, 0.35, 0.8, t + 0.03);
    tone('sine', 2400, 3600, 0.05, 0.12, t + 0.09);
  },
  baa(panic) {
    if (!audioReady()) return;
    const t = AC.currentTime;
    const base = panic ? rr(470, 560) : rr(330, 400);
    const dur = panic ? 0.3 : 0.42;
    const o = AC.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(base * 1.08, t);
    o.frequency.linearRampToValueAtTime(base * (panic ? 1.18 : 1.0), t + dur * 0.35);
    o.frequency.exponentialRampToValueAtTime(base * 0.82, t + dur);
    const lfo = AC.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = panic ? 34 : 24;
    const lfoG = AC.createGain();
    lfoG.gain.value = base * (panic ? 0.09 : 0.06);
    lfo.connect(lfoG);
    lfoG.connect(o.frequency);
    const f1 = AC.createBiquadFilter();
    f1.type = 'bandpass';
    f1.frequency.value = panic ? 1500 : 1100;
    f1.Q.value = 2.2;
    const f2 = AC.createBiquadFilter();
    f2.type = 'lowpass';
    f2.frequency.value = 3200;
    const g = envGain(t, 0.03, panic ? 0.5 : 0.38, dur);
    o.connect(f1);
    f1.connect(f2);
    f2.connect(g);
    g.connect(master);
    o.start(t);
    lfo.start(t);
    o.stop(t + dur + 0.08);
    lfo.stop(t + dur + 0.08);
  },
  capture() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    tone('sawtooth', 420, 110, 0.45, 0.16, t, { type: 'lowpass', freq: 1400, freq1: 300 });
    noise(0.18, 'bandpass', 1800, 0.18, 2, t);
  },
  lost() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    tone('triangle', 330, 300, 0.16, 0.25, t);
    tone('triangle', 262, 240, 0.28, 0.25, t + 0.16);
  },
  stun() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    tone('square', 880, 880, 0.05, 0.1, t + 0.05, { type: 'lowpass', freq: 3000 });
    tone('square', 1175, 1175, 0.05, 0.1, t + 0.12, { type: 'lowpass', freq: 3000 });
  },
  rescue() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    [523, 659, 784].forEach((f, i) => tone('triangle', f, f, 0.1, 0.22, t + i * 0.07));
  },
  wave() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    [392, 523, 659, 784].forEach((f, i) => tone('triangle', f, f * 1.01, 0.12, 0.22, t + i * 0.09));
    tone('square', 196, 196, 0.4, 0.05, t, { type: 'lowpass', freq: 800 });
  },
  clear() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.09, 0.09, t + i * 0.08, { type: 'lowpass', freq: 2400 }));
  },
  gameover() {
    if (!audioReady()) return;
    const t = AC.currentTime;
    [392, 349, 311, 262].forEach((f, i) => tone('triangle', f, f * 0.98, 0.3, 0.25, t + i * 0.22));
    tone('sine', 130, 65, 1.0, 0.3, t + 0.66);
  },
  bump() {
    if (!audioReady()) return;
    tone('sine', 120, 60, 0.08, 0.25);
  },
  click() {
    if (!audioReady()) return;
    tone('square', 660, 990, 0.05, 0.08, undefined, { type: 'lowpass', freq: 2000 });
  }
};

// ---------------------------------------------------------------------
// World / field definition
// ---------------------------------------------------------------------
const FIELD = { x0: 30, y0: 42, x1: 450, y1: 246 };
const FIELD_CX = (FIELD.x0 + FIELD.x1) / 2;
const FIELD_CY = (FIELD.y0 + FIELD.y1) / 2;

// ---------------------------------------------------------------------
// Procedural environment (pre-rendered)
// ---------------------------------------------------------------------
const bgCanvas = makeCanvas(W, H);
const fgCanvas = makeCanvas(W, H);
const vignetteCanvas = makeCanvas(W, H);

function makeGrassTile(rng) {
  const S = 32;
  const c = makeCanvas(S, S);
  const g = c.getContext('2d');
  const img = g.createImageData(S, S);
  const base = ['#4c8a3e', '#56963f', '#5f9f48'].map(hexToRgb);
  const dark = hexToRgb('#3f7634');
  const light = hexToRgb('#7cbc5a');
  const tip = hexToRgb('#94cc68');
  const px = new Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const v = 0.5 + 0.25 * Math.sin((x / S) * Math.PI * 2 * 2 + 1.3) * Math.cos((y / S) * Math.PI * 2 + 0.4) + (rng() - 0.5) * 0.5;
      const t = v * 3 + (BAYER[y & 3][x & 3] / 16 - 0.5) * 0.9;
      px[y * S + x] = base[clamp(Math.floor(t), 0, 2)];
    }
  }
  // grass blades
  for (let i = 0; i < 70; i++) {
    const bx = Math.floor(rng() * S);
    const by = Math.floor(rng() * S);
    const L = 2 + Math.floor(rng() * 3);
    const isLight = rng() < 0.55;
    const lean = rng() < 0.3 ? (rng() < 0.5 ? -1 : 1) : 0;
    for (let k = 0; k < L; k++) {
      const xx = (bx + (k === L - 1 ? lean : 0) + S) % S;
      const yy = (by - k + S) % S;
      let col = isLight ? light : dark;
      if (isLight && k === L - 1) col = tip;
      px[yy * S + xx] = col;
    }
  }
  for (let i = 0; i < S * S; i++) {
    const c3 = px[i];
    img.data[i * 4] = c3[0];
    img.data[i * 4 + 1] = c3[1];
    img.data[i * 4 + 2] = c3[2];
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

function makeTreeCanvas(rng, r, palette) {
  const w = Math.ceil(r * 2 + 8);
  const trunkH = 6;
  const hgt = Math.ceil(r * 2 + trunkH + 6);
  const c = makeCanvas(w, hgt);
  const g = c.getContext('2d');
  const img = g.createImageData(w, hgt);
  const cols = palette.map(hexToRgb);
  const cx = w / 2;
  const baseY = hgt - 2;
  const ccy = baseY - trunkH - r * 0.85;
  function put(x, y, rgb, a) {
    if (x < 0 || y < 0 || x >= w || y >= hgt) return;
    const i = (y * w + x) * 4;
    img.data[i] = rgb[0];
    img.data[i + 1] = rgb[1];
    img.data[i + 2] = rgb[2];
    img.data[i + 3] = a === undefined ? 255 : a;
  }
  // ground shadow under tree
  const shadowRgb = hexToRgb('#0a1d18');
  for (let y = -2; y <= 1; y++) {
    const hw = Math.floor(r * 0.9 * Math.sqrt(1 - (y / 3) * (y / 3)));
    for (let x = -hw; x <= hw; x++) put(Math.floor(cx + x), baseY + y, shadowRgb, 150);
  }
  // trunk
  const trunkDark = hexToRgb('#2e2018');
  const trunkMid = hexToRgb('#4f3826');
  const trunkLight = hexToRgb('#6e5036');
  for (let y = 0; y < trunkH + 4; y++) {
    const yy = baseY - y;
    put(Math.floor(cx) - 2, yy, trunkDark);
    put(Math.floor(cx) - 1, yy, trunkLight);
    put(Math.floor(cx), yy, trunkMid);
    put(Math.floor(cx) + 1, yy, trunkDark);
  }
  put(Math.floor(cx) - 3, baseY, trunkDark);
  put(Math.floor(cx) + 2, baseY, trunkDark);
  // trunk shadow from canopy
  const s1 = rng() * 6.28;
  const s2 = rng() * 6.28;
  const s3 = rng() * 6.28;
  const s4 = rng() * 6.28;
  const lobes = 5 + Math.floor(rng() * 3);
  for (let y = -r - 3; y <= r + 3; y++) {
    for (let x = -r - 3; x <= r + 3; x++) {
      const ang = Math.atan2(y, x);
      const rEff = r * (1 + 0.12 * Math.sin(ang * lobes + s1) + 0.06 * Math.sin(ang * 11 + s2));
      const d = Math.sqrt(x * x + (y * 1.08) * (y * 1.08));
      if (d > rEff) continue;
      const px = Math.floor(cx + x);
      const py = Math.floor(ccy + y);
      if (d > rEff - 1.1) {
        put(px, py, cols[0]);
        continue;
      }
      const light = (-x * 0.55 - y * 0.85) / r;
      const e = d / rEff;
      const clump = Math.sin(x * 0.9 + s3) * Math.sin(y * 0.85 + s4);
      let v = 0.52 + light * 0.42 - e * e * 0.3 + clump * 0.13;
      const t = v * 4 + (BAYER[py & 3][px & 3] / 16 - 0.5) * 0.95;
      const idx = clamp(Math.floor(t), 0, cols.length - 1);
      put(px, py, cols[idx]);
    }
  }
  // dark band where canopy meets trunk (canopy shadow on trunk)
  const shade = hexToRgb('#0b201b');
  const by = Math.floor(ccy + r * 0.95);
  for (let x = -2; x <= 1; x++) put(Math.floor(cx) + x, by + 1, shade);
  g.putImageData(img, 0, 0);
  return c;
}

const TREE_PALETTES = [
  ['#0b2622', '#123a33', '#1d5241', '#2d6b4a', '#4a8a52'],
  ['#0a2328', '#11363c', '#1a4d4c', '#26665a', '#3f8566'],
  ['#0c2620', '#163f30', '#22573a', '#357244', '#5a9452']
];

function buildEnvironment() {
  const rng = mulberry32(1337);
  const g = bgCanvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  // base grass pattern
  const tile = makeGrassTile(rng);
  g.fillStyle = g.createPattern(tile, 'repeat');
  g.fillRect(0, 0, W, H);

  // large-scale lighter/darker grass patches (dithered)
  const img = g.getImageData(0, 0, W, H);
  const a1 = rng() * 6, a2 = rng() * 6, a3 = rng() * 6;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const v = Math.sin(x * 0.045 + a1) * Math.sin(y * 0.06 + a2) + 0.6 * Math.sin((x + y) * 0.021 + a3);
      const th = BAYER[y & 3][x & 3] / 16;
      const i = (y * W + x) * 4;
      if (v > 0.55 + th * 0.5) {
        img.data[i] *= 0.88; img.data[i + 1] *= 0.9; img.data[i + 2] *= 0.88;
      } else if (v < -0.75 - th * 0.4) {
        img.data[i] = Math.min(255, img.data[i] * 1.08 + 4);
        img.data[i + 1] = Math.min(255, img.data[i + 1] * 1.06 + 4);
      }
    }
  }
  g.putImageData(img, 0, 0);

  function px(x, y, col) {
    g.fillStyle = col;
    g.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  // dirt patches
  for (let i = 0; i < 6; i++) {
    const cx = lerp(FIELD.x0 + 30, FIELD.x1 - 30, rng());
    const cy = lerp(FIELD.y0 + 20, FIELD.y1 - 20, rng());
    const rx = 8 + rng() * 10, ry = 4 + rng() * 5;
    for (let y = -ry; y <= ry; y++) {
      for (let x = -rx; x <= rx; x++) {
        const d = (x * x) / (rx * rx) + (y * y) / (ry * ry);
        const xx = Math.round(cx + x), yy = Math.round(cy + y);
        if (d < 1 && (d < 0.55 || BAYER[yy & 3][xx & 3] / 16 > d - 0.4)) {
          px(xx, yy, d < 0.3 && rng() < 0.2 ? '#9a7c52' : (rng() < 0.15 ? '#6e5434' : '#86683f'));
        }
      }
    }
  }
  // flowers
  const flowerCols = [
    ['#ffffff', '#f6d23a'], ['#f6d23a', '#c07a20'], ['#ff8fb8', '#ffe070'],
    ['#b48cff', '#ffffff'], ['#ff6a5a', '#ffd040']
  ];
  for (let i = 0; i < 170; i++) {
    const x = Math.round(lerp(FIELD.x0 - 4, FIELD.x1 + 4, rng()));
    const y = Math.round(lerp(FIELD.y0 - 2, FIELD.y1 + 6, rng()));
    const fc = flowerCols[Math.floor(rng() * flowerCols.length)];
    const type = rng();
    if (type < 0.45) {
      px(x, y + 1, '#3a7030');
      px(x, y, fc[0]);
    } else if (type < 0.85) {
      px(x, y + 2, '#3a7030');
      px(x - 1, y, fc[0]); px(x + 1, y, fc[0]); px(x, y - 1, fc[0]); px(x, y + 1, fc[0]);
      px(x, y, fc[1]);
    } else {
      // clover clump
      px(x, y, '#3c7a34'); px(x + 1, y, '#468a3a'); px(x, y - 1, '#4e9440'); px(x - 1, y, '#3c7a34');
      px(x + 1, y - 1, '#68aa50');
    }
  }
  // rocks and pebbles
  for (let i = 0; i < 26; i++) {
    const x = Math.round(lerp(FIELD.x0, FIELD.x1, rng()));
    const y = Math.round(lerp(FIELD.y0, FIELD.y1 + 6, rng()));
    const big = rng() < 0.4;
    const w = big ? 4 + Math.floor(rng() * 2) : 3;
    const h = big ? 3 : 2;
    g.fillStyle = 'rgba(20,40,16,0.45)';
    g.fillRect(x, y + h, w + 1, 1);
    g.fillStyle = '#4c4c48';
    g.fillRect(x, y, w, h);
    g.fillStyle = '#8a8a82';
    g.fillRect(x, y, w - 1, h - 1);
    g.fillStyle = '#b4b2a8';
    g.fillRect(x, y, Math.max(1, w - 2), 1);
    g.fillStyle = '#4c4c48';
    g.fillRect(x - 1, y + 1, 1, h - 1);
  }
  for (let i = 0; i < 90; i++) {
    px(lerp(FIELD.x0, FIELD.x1, rng()), lerp(FIELD.y0, FIELD.y1 + 6, rng()), rng() < 0.5 ? '#8c8a80' : '#6c6a62');
  }

  // dark forest floor outside the field with a ragged edge
  g.fillStyle = '#10261f';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const inset = 4 + 3 * Math.sin(x * 0.3 + y * 0.17) + 2 * Math.sin(x * 0.11 - y * 0.23);
      const out = x < FIELD.x0 - inset || x > FIELD.x1 + inset || y < FIELD.y0 - inset - 4 || y > FIELD.y1 + inset + 4;
      if (out) g.fillRect(x, y, 1, 1);
    }
  }

  // Trees
  const trees = [];
  function addTree(x, y, r) {
    trees.push({ x: x, y: y, r: r, pal: TREE_PALETTES[Math.floor(rng() * TREE_PALETTES.length)] });
  }
  // top band (3 rows)
  for (let row = 0; row < 3; row++) {
    let x = -10 + row * 7;
    while (x < W + 12) {
      addTree(x + rng() * 4, 8 + row * 12 + rng() * 6, 10 + Math.floor(rng() * 4));
      x += 13 + rng() * 6;
    }
  }
  // bottom band (2 rows)
  for (let row = 0; row < 2; row++) {
    let x = -8 + row * 8;
    while (x < W + 12) {
      addTree(x + rng() * 4, H + 2 + row * 10 + rng() * 4, 10 + Math.floor(rng() * 4));
      x += 13 + rng() * 6;
    }
  }
  // side bands
  for (let side = 0; side < 2; side++) {
    for (let col = 0; col < 2; col++) {
      let y = 30 + col * 6;
      while (y < H + 8) {
        const bx = side === 0 ? (2 + col * 12 + rng() * 4) : (W - 2 - col * 12 - rng() * 4);
        addTree(bx, y + rng() * 4, 9 + Math.floor(rng() * 4));
        y += 12 + rng() * 6;
      }
    }
  }
  trees.sort((a, b) => a.y - b.y);
  const fg = fgCanvas.getContext('2d');
  fg.imageSmoothingEnabled = false;
  for (const t of trees) {
    const tc = makeTreeCanvas(rng, t.r, t.pal);
    const dx = Math.round(t.x - tc.width / 2);
    const dy = Math.round(t.y - tc.height + 2);
    // Trees whose canopy can overlap the bottom of the field go to the foreground layer.
    if (t.y > FIELD.y1 + 6) fg.drawImage(tc, dx, dy);
    else g.drawImage(tc, dx, dy);
  }

  // vignette
  const vg = vignetteCanvas.getContext('2d');
  const grad = vg.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  grad.addColorStop(0, 'rgba(30,8,40,0)');
  grad.addColorStop(1, 'rgba(30,8,40,0.85)');
  vg.fillStyle = grad;
  vg.fillRect(0, 0, W, H);
}
buildEnvironment();

const TINT_STOPS = [
  { t: 0.0, c: [255, 255, 255], glow: [255, 240, 200], ga: 0.0 },
  { t: 0.3, c: [255, 236, 196], glow: [255, 210, 140], ga: 0.06 },
  { t: 0.6, c: [255, 200, 156], glow: [255, 140, 80], ga: 0.13 },
  { t: 0.82, c: [242, 172, 160], glow: [255, 120, 110], ga: 0.14 },
  { t: 1.0, c: [192, 150, 192], glow: [255, 120, 160], ga: 0.12 }
];
function tintAt(p) {
  p = clamp(p, 0, 1);
  for (let i = 0; i < TINT_STOPS.length - 1; i++) {
    const a = TINT_STOPS[i], b = TINT_STOPS[i + 1];
    if (p >= a.t && p <= b.t) {
      const k = (p - a.t) / (b.t - a.t);
      return {
        c: a.c.map((v, j) => Math.round(lerp(v, b.c[j], k))),
        glow: a.glow.map((v, j) => Math.round(lerp(v, b.glow[j], k))),
        ga: lerp(a.ga, b.ga, k)
      };
    }
  }
  const l = TINT_STOPS[TINT_STOPS.length - 1];
  return { c: l.c, glow: l.glow, ga: l.ga };
}

function addParticle(p) {
  if (particles.length > 600) particles.shift();
  particles.push(p);
}
function dust(x, y, n, spread, speed) {
  const cols = ['#d6c49a', '#bca77c', '#e4d6b0', '#a8946c'];
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2;
    const s = rr(0.2, 1) * (speed || 30);
    addParticle({
      x: x + rr(-spread, spread), y: y + rr(-2, 1),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.5 - rr(4, 14),
      life: rr(0.35, 0.8), max: 0.8, size: rand() < 0.35 ? 2 : 1,
      col: pick(cols), g: -6, drag: 3, kind: 'px'
    });
  }
}
function impactBurst(x, y, col) {
  const cols = ['#ffffff', '#fff3a8', '#ffc84a', '#ff8a3a', col];
  for (let i = 0; i < 26; i++) {
    const a = rand() * Math.PI * 2;
    const s = rr(40, 170);
    addParticle({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.75,

      col: pick(cols), g: 60, drag: 4, kind: 'spark'

  addParticle({ x: x, y: y, vx: 0, vy: 0, life: 0.12, max: 0.12, r0: 2, r1: 9, col: '#ffffff', kind: 'flash' });
}
function popBurst(x, y, col) {

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.kind === 'px' || p.kind === 'spark') {
      const k = Math.max(0, 1 - p.drag * dt);
      p.vx *= k;
      p.vy *= k;
      p.vy += p.g * dt;
      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    t.y -= 18 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }
}

// ---------------------------------------------------------------------
// Input (keyboard, mouse, touch)
// ---------------------------------------------------------------------
const keys = {};
const touch = { stickId: null, sx: 0, sy: 0, cx: 0, cy: 0, active: false, used: false };

function anyGesture() {
  initAudio();
}
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  anyGesture();
  if (e.repeat) {
    keys[k.toLowerCase()] = true;
    return;
  }
  keys[k.toLowerCase()] = true;
  if (k === ' ' || k === 'Spacebar') actionPress();
  else if (k === 'Enter') {
    if (state === 'MENU') startGame();
    else if (state === 'GAMEOVER') tryRestart();
  } else if (k === 'r' || k === 'R') {
    if (state === 'GAMEOVER') tryRestart();
  } else if (k === 'm' || k === 'M') {
    setMuted(!muted);
  } else if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'PLAYING') { paused = !paused; SFX.click(); }
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (state === 'PLAYING') paused = true;
});
view.addEventListener('mousedown', (e) => {
  anyGesture();
  view.focus();
  if (e.button === 0) actionPress();
});
view.addEventListener('contextmenu', (e) => e.preventDefault());

function toGame(clientX, clientY) {
  const r = view.getBoundingClientRect();
  return { x: ((clientX - r.left) / r.width) * W, y: ((clientY - r.top) / r.height) * H };
}
view.addEventListener('touchstart', (e) => {
  e.preventDefault();
  anyGesture();
  touch.used = true;
  for (const t of e.changedTouches) {
    const p = toGame(t.clientX, t.clientY);
    if (state === 'PLAYING' && !paused && p.x < W * 0.5 && touch.stickId === null) {
      touch.stickId = t.identifier;
      touch.sx = p.x; touch.sy = p.y; touch.cx = p.x; touch.cy = p.y;
      touch.active = true;
    } else if (state === 'PLAYING' && paused) {
      paused = false;
    } else {
      actionPress();
    }
  }
}, { passive: false });
view.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.stickId) {
      const p = toGame(t.clientX, t.clientY);
      touch.cx = p.x; touch.cy = p.y;
    }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.stickId) {
      touch.stickId = null;
      touch.active = false;
    }
  }
}
view.addEventListener('touchend', endTouch, { passive: false });
view.addEventListener('touchcancel', endTouch, { passive: false });

function getMoveInput() {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (touch.active) {
    const dx = touch.cx - touch.sx, dy = touch.cy - touch.sy;
    const d = len(dx, dy);
    if (d > 4) {
      // snap to 8 directions for consistency with keyboard
      const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      x = Math.round(Math.cos(a));
      y = Math.round(Math.sin(a));
    }
  }
  const l = len(x, y);
  if (l > 0) { x /= l; y /= l; }
  return { x: x, y: y };
}

function actionPress() {
  if (state === 'MENU') { startGame(); return; }
  if (state === 'GAMEOVER') { tryRestart(); return; }
  if (state === 'PLAYING') {
    if (paused) { paused = false; return; }
    tryRam();
  }
}
function startGame() {
  initAudio();
  SFX.click();
  state = 'PLAYING';
  resetGame();
}
function tryRestart() {
  if (realTime - gameOverTime < 0.9) return;
  startGame();
}

// ---------------------------------------------------------------------
// Goat
// ---------------------------------------------------------------------
function tryRam() {
  if (goat.ramT > 0) { goat.ramQueue = 0.15; return; }
  if (goat.cd > 0) {
    if (goat.cd < 0.18) goat.ramQueue = 0.2;
    return;
  }
  goat.ramT = RAM_DURATION;
  goat.cd = RAM_COOLDOWN;
  goat.ramId++;
  goat.ramQueue = 0;
  const inp = getMoveInput();
  if (inp.x || inp.y) {
    goat.fx = inp.x; goat.fy = inp.y;
    if (Math.abs(inp.x) > 0.2) goat.side = Math.sign(inp.x);
  }
  goat.vx = goat.fx * RAM_SPEED;
  goat.vy = goat.fy * RAM_SPEED;
  dust(goat.x - goat.fx * 6, goat.y, 14, 4, 55);
  shake = Math.max(shake, 1.5);
  SFX.dash();
}

function updateGoat(dt) {
  const inp = getMoveInput();
  if (goat.ramQueue > 0) {
    goat.ramQueue -= dt;
    if (goat.cd <= 0 && goat.ramT <= 0) tryRam();
  }
  if (goat.ramT > 0) {
    goat.ramT -= dt;
    // slight steering while charging
    if (inp.x || inp.y) {
      const nx = goat.fx + inp.x * 2.0 * dt;
      const ny = goat.fy + inp.y * 2.0 * dt;
      const l = len(nx, ny) || 1;
      goat.fx = nx / l; goat.fy = ny / l;
    }
    const k = 0.55 + 0.45 * Math.max(0, goat.ramT / RAM_DURATION);
    goat.vx = goat.fx * RAM_SPEED * k;
    goat.vy = goat.fy * RAM_SPEED * k;
    if (rand() < 0.8) dust(goat.x - goat.fx * 7, goat.y, 2, 2, 25);
    if (goat.ramT <= 0) {
      goat.vx *= 0.3;
      goat.vy *= 0.3;
      dust(goat.x + goat.fx * 4, goat.y, 6, 3, 30);
    }
  } else {
    const spd = len(goat.vx, goat.vy);
    if (inp.x || inp.y) {
      const dot = inp.x * goat.fx + inp.y * goat.fy;
      if (dot < 0.35 && spd > 35) dust(goat.x, goat.y, 6, 3, 40);
      goat.fx = inp.x; goat.fy = inp.y;
      if (Math.abs(inp.x) > 0.2) goat.side = Math.sign(inp.x);
    }
    const k = Math.min(1, dt * 11);
    goat.vx += (inp.x * GOAT_SPEED - goat.vx) * k;
    goat.vy += (inp.y * GOAT_SPEED - goat.vy) * k;
    if (spd > 70 && rand() < dt * 8) dust(goat.x - goat.fx * 5, goat.y, 1, 2, 12);
  }
  if (goat.cd > 0) goat.cd = Math.max(0, goat.cd - dt);
  if (goat.bonk > 0) goat.bonk -= dt;

  goat.x += goat.vx * dt;
  goat.y += goat.vy * dt;
  goat.walk += len(goat.vx, goat.vy) * dt;

  // field bounds
  let hitWall = false;
  if (goat.x < FIELD.x0 + 6) { goat.x = FIELD.x0 + 6; hitWall = true; }
  if (goat.x > FIELD.x1 - 6) { goat.x = FIELD.x1 - 6; hitWall = true; }
  if (goat.y < FIELD.y0 + 2) { goat.y = FIELD.y0 + 2; hitWall = true; }
  if (goat.y > FIELD.y1) { goat.y = FIELD.y1; hitWall = true; }
  if (hitWall && goat.ramT > 0 && goat.bonk <= 0) {
    goat.bonk = 0.3;
    goat.ramT = 0;
    goat.vx *= -0.2; goat.vy *= -0.2;
    shake = Math.max(shake, 3);
    dust(goat.x + goat.fx * 6, goat.y, 10, 3, 50);
    leafBurst(goat.x + goat.fx * 10, goat.y - 4);
    SFX.bump();
  }
}

// ---------------------------------------------------------------------
// Herd (Boids)
// ---------------------------------------------------------------------
const NEIGHBOR_R = 42;
const SEP_R = 13;

function updateSheep(dt) {
  const threats = enemies.filter(e => e.state === 'hunt' || e.state === 'carry' || e.state === 'stun');
  const herdC = flockCenter();
  for (const s of sheep) {
    let cx = 0, cy = 0, avx = 0, avy = 0, sx = 0, sy = 0, n = 0, panicN = 0;
    for (const o of sheep) {
      if (o === s) continue;
      const dx = o.x - s.x, dy = o.y - s.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < NEIGHBOR_R * NEIGHBOR_R) {
        n++;
        cx += o.x; cy += o.y;
        avx += o.vx; avy += o.vy;
        if (o.panic > 0) panicN++;
        if (d2 < SEP_R * SEP_R && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const k = (SEP_R - d) / SEP_R;
          sx -= (dx / d) * k;
          sy -= (dy / d) * k;
        } else if (d2 <= 0.0001) {
          sx += rr(-1, 1); sy += rr(-1, 1);
        }
      }
    }
    let ax = 0, ay = 0;
    // panic check
    let threat = null, td = PANIC_RADIUS;
    for (const e of threats) {
      const d = len(e.x - s.x, e.y - s.y);
      if (d < td) { td = d; threat = e; }
    }
    const wasPanic = s.panic > 0;
    if (threat) {
      s.panic = 0.9;
      s.grazing = false;
    } else if (s.panic > 0) {
      s.panic -= dt;
    }
    if (threat) {
      // PANIC VECTOR: overrides flocking, flee directly away from predator
      let fx = s.x - threat.x, fy = s.y - threat.y;
      const l = len(fx, fy) || 1;
      fx /= l; fy /= l;
      const urgency = 1 + (1 - td / PANIC_RADIUS) * 0.6;
      const desiredX = fx * 72 * urgency, desiredY = fy * 72 * urgency;
      ax += (desiredX - s.vx) * 6;
      ay += (desiredY - s.vy) * 6;
      ax += sx * 60; ay += sy * 60;
      if (!wasPanic && realTime - lastBaa > 0.22 && s.baaCd <= 0) {
        SFX.baa(true);
        lastBaa = realTime;
        s.baaCd = 1.2;
      }
    } else {
      if (n > 0) {
        cx /= n; cy /= n; avx /= n; avy /= n;
        // Cohesion
        ax += (cx - s.x) * 0.55;
        ay += (cy - s.y) * 0.55;
        // Alignment
        ax += (avx - s.vx) * (s.panic > 0 ? 2.2 : 0.9);
        ay += (avy - s.vy) * (s.panic > 0 ? 2.2 : 0.9);
      }
      // weak whole-herd cohesion so stragglers rejoin the flock
      ax += (herdC.x - s.x) * 0.12;
      ay += (herdC.y - s.y) * 0.12;
      // Separation
      ax += sx * 140;
      ay += sy * 140;
      // Wander / graze
      s.wander += rr(-2, 2) * dt;
      if (!s.grazing) {
        ax += Math.cos(s.wander) * 10;
        ay += Math.sin(s.wander) * 7;
      }
      // Loosely follow the shepherd goat when far away
      const gd = len(goat.x - s.x, goat.y - s.y);
      if (gd > 75) {
        ax += ((goat.x - s.x) / gd) * 14;
        ay += ((goat.y - s.y) / gd) * 14;
      }
      // nervous neighbours make others jittery
      if (panicN > 0) {
        ax += s.vx * 0.6;
        ay += s.vy * 0.6;
      }
      // graze state machine
      s.grazeT -= dt;
      if (s.grazeT <= 0) {
        s.grazing = !s.grazing;
        s.grazeT = s.grazing ? rr(1.5, 4) : rr(1, 3);
        if (!s.grazing && rand() < 0.08 && realTime - lastBaa > 1.5 && state !== 'GAMEOVER') {
          SFX.baa(false);
          lastBaa = realTime;
        }
      }
    }
    if (s.baaCd > 0) s.baaCd -= dt;
    // goat personal space
    const gdx = s.x - goat.x, gdy = s.y - goat.y;
    const gd2 = gdx * gdx + gdy * gdy;
    const gR = goat.ramT > 0 ? 18 : 14;
    if (gd2 < gR * gR && gd2 > 0.001) {
      const d = Math.sqrt(gd2);
      const k = (gR - d) / gR;
      ax += (gdx / d) * k * (goat.ramT > 0 ? 900 : 260);
      ay += (gdy / d) * k * (goat.ramT > 0 ? 900 : 260);
    }
    // bounds
    const m = 16;
    if (s.x < FIELD.x0 + m) ax += (FIELD.x0 + m - s.x) * 9;
    if (s.x > FIELD.x1 - m) ax -= (s.x - (FIELD.x1 - m)) * 9;
    if (s.y < FIELD.y0 + m) ay += (FIELD.y0 + m - s.y) * 9;
    if (s.y > FIELD.y1 - m) ay -= (s.y - (FIELD.y1 - m)) * 9;

    s.vx += ax * dt;
    s.vy += ay * dt;
    const maxS = s.panic > 0 ? 82 : (s.grazing ? 9 : 26);
    const sp = len(s.vx, s.vy);
    if (sp > maxS) { s.vx = (s.vx / sp) * maxS; s.vy = (s.vy / sp) * maxS; }
    if (s.panic <= 0) {
      const damp = Math.max(0, 1 - dt * (s.grazing ? 4 : 1.2));
      s.vx *= damp; s.vy *= damp;
    }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.x = clamp(s.x, FIELD.x0 + 4, FIELD.x1 - 4);
    s.y = clamp(s.y, FIELD.y0 + 4, FIELD.y1);
    if (Math.abs(s.vx) > 3) s.side = s.vx < 0 ? -1 : 1;
    s.walk += len(s.vx, s.vy) * dt;
    s.chew += dt;
    if (s.flash > 0) s.flash -= dt;
  }
}

// ---------------------------------------------------------------------
// Enemies
// ---------------------------------------------------------------------
function edgePoint(margin) {
  const side = Math.floor(rand() * 4);
  let x, y;
  if (side === 0) { x = rr(FIELD.x0 + 20, FIELD.x1 - 20); y = FIELD.y0 - margin; }
  else if (side === 1) { x = rr(FIELD.x0 + 20, FIELD.x1 - 20); y = FIELD.y1 + margin; }
  else if (side === 2) { x = FIELD.x0 - margin; y = rr(FIELD.y0 + 15, FIELD.y1 - 10); }
  else { x = FIELD.x1 + margin; y = rr(FIELD.y0 + 15, FIELD.y1 - 10); }
  return { x: x, y: y, side: side };
}
function exitPoint(x, y) {
  const dl = x - FIELD.x0, dr = FIELD.x1 - x, dtp = y - FIELD.y0, db = FIELD.y1 - y;
  const m = Math.min(dl, dr, dtp, db);
  if (m === dl) return { x: FIELD.x0 - 50, y: y };
  if (m === dr) return { x: FIELD.x1 + 50, y: y };
  if (m === dtp) return { x: x, y: FIELD.y0 - 50 };
  return { x: x, y: FIELD.y1 + 50 };
}
function spawnEnemy() {
  const n = wave.n;
  const batChance = n < 2 ? 0 : Math.min(0.5, 0.18 + n * 0.05);
  const isBat = rand() < batChance;
  if (isBat) {
    const p = edgePoint(26);
    enemies.push({
      type: 'bat', x: p.x, y: p.y, vx: 0, vy: 0, state: 'hunt', t: 0, hp: 1,
      speed: Math.min(78, 44 + n * 3), accel: 150, side: 1, anim: rand() * 6,
      alt: 14, lastRam: -1, rot: 0, spin: 0, carry: null, flash: 0, phase: rand() * 6.28, alpha: false
    });
  } else {
    const p = edgePoint(10);
    const alpha = n >= 3 && rand() < Math.min(0.4, (n - 2) * 0.09);
    enemies.push({
      type: 'wolf', x: p.x, y: p.y, vx: 0, vy: 0, state: 'emerge', t: 0.9, hp: alpha ? 2 : 1,
      speed: Math.min(92, 52 + n * 3.5) * (alpha ? 0.9 : 1), accel: 260, side: p.x > FIELD_CX ? -1 : 1,
      anim: rand() * 6, alt: 0, lastRam: -1, rot: 0, spin: 0, carry: null, flash: 0, phase: rand() * 6.28, alpha: alpha
    });
    leafBurst(p.x, p.y);
  }
}
function nearestSheep(x, y) {
  let best = null, bd = 1e9;
  for (const s of sheep) {
    const d = (s.x - x) * (s.x - x) + (s.y - y) * (s.y - y);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function steerTo(e, tx, ty, speed, dt) {
  let dx = tx - e.x, dy = ty - e.y;
  const d = len(dx, dy) || 1;
  dx /= d; dy /= d;
  e.vx += (dx * speed - e.vx) * Math.min(1, (e.accel / Math.max(speed, 1)) * dt);
  e.vy += (dy * speed - e.vy) * Math.min(1, (e.accel / Math.max(speed, 1)) * dt);
  return d;
}
function killEnemy(e, i) {
  popBurst(e.x, e.y - e.alt - 4, e.type === 'bat' ? '#a03a6a' : (e.alpha ? '#8a74b8' : '#6c7288'));
  SFX.pop();
  enemies.splice(i, 1);
}
function releaseCarried(e) {
  if (!e.carry) return;
  const s = e.carry;
  e.carry = null;
  s.x = clamp(e.x, FIELD.x0 + 6, FIELD.x1 - 6);
  s.y = clamp(e.y, FIELD.y0 + 6, FIELD.y1 - 2);
  s.vx = rr(-30, 30); s.vy = rr(-30, 30);
  s.panic = 1.2;
  s.flash = 0.6;
  sheep.push(s);
  rescued++;
  addText(s.x, s.y - 18, 'SAVED!', '#9cff8a', false);
  SFX.rescue();
  woolPuff(s.x, s.y, 8);
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.anim += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.state === 'emerge') {
      e.t -= dt;
      if (rand() < dt * 4) leafBurst(e.x, e.y);
      if (e.t <= 0) e.state = 'hunt';
      continue;
    }
    if (e.state === 'launched') {
      e.t -= dt;
      const k = Math.max(0, 1 - dt * 2.5);
      e.vx *= k; e.vy *= k;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      e.rot += e.spin * dt;
      e.alt = Math.max(e.alt, 0) + dt * 40;
      if (rand() < 0.6) addParticle({ x: e.x, y: e.y - e.alt - 3, vx: 0, vy: 0, life: 0.25, max: 0.25, size: 1, col: '#fff3a8', g: 0, drag: 0, kind: 'px' });
      if (e.t <= 0) killEnemy(e, i);
      continue;
    }
    if (e.state === 'stun') {
      e.t -= dt;
      const k = Math.max(0, 1 - dt * 5);
      e.vx *= k; e.vy *= k;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      e.x = clamp(e.x, FIELD.x0 - 30, FIELD.x1 + 30);
      e.y = clamp(e.y, FIELD.y0 - 30, FIELD.y1 + 30);
      if (e.t <= 0) e.state = 'hunt';
      continue;
    }
    let spd = e.speed;
    if (e.state === 'hunt') {
      const target = nearestSheep(e.x, e.y);
      if (!target) {
        e.state = 'carry';
        e.exit = exitPoint(e.x, e.y);
      } else {
        let d = len(target.x - e.x, target.y - e.y);
        if (e.type === 'wolf' && d < 34) spd *= 1.35;          // lunge
        let tx = target.x, ty = target.y;
        if (e.type === 'bat') {
          // sinusoidal swoop
          const px = -(target.y - e.y) / (d || 1), py = (target.x - e.x) / (d || 1);
          const w = Math.sin(e.anim * 4 + e.phase) * Math.min(28, d * 0.4);
          tx += px * w; ty += py * w;
        }
        d = steerTo(e, tx, ty, spd, dt);
        // capture
        const cd = len(target.x - e.x, target.y - e.y);
        if (cd < (e.type === 'bat' ? 7 : 8)) {
          const idx = sheep.indexOf(target);
          if (idx >= 0) sheep.splice(idx, 1);
          e.carry = target;
          e.state = 'carry';
          e.exit = exitPoint(e.x, e.y);
          woolPuff(target.x, target.y, 12);
          SFX.capture();
          if (realTime - lastBaa > 0.15) { SFX.baa(true); lastBaa = realTime; }
          addText(target.x, target.y - 16, 'HELP!', '#ff8a8a', false);
          shake = Math.max(shake, 1);
        }
      }
    } else if (e.state === 'carry') {
      if (!e.exit) e.exit = exitPoint(e.x, e.y);
      steerTo(e, e.exit.x, e.exit.y, spd * (e.carry ? 0.68 : 1.0), dt);
      if (e.x < FIELD.x0 - 34 || e.x > FIELD.x1 + 34 || e.y < FIELD.y0 - 34 || e.y > FIELD.y1 + 34) {
        if (e.carry) {
          lostCount++;
          addText(clamp(e.x, FIELD.x0 + 20, FIELD.x1 - 20), clamp(e.y, FIELD.y0 + 10, FIELD.y1 - 10), 'SHEEP LOST', '#ff6a6a', false);
          SFX.lost();
        }
        enemies.splice(i, 1);
        continue;
      }
    }
    // separation between enemies
    for (const o of enemies) {
      if (o === e || o.state === 'launched' || o.state === 'emerge' || o.type !== e.type) continue;
      const dx = e.x - o.x, dy = e.y - o.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 100 && d2 > 0.001) {
        const d = Math.sqrt(d2);
        e.vx += (dx / d) * 120 * dt;
        e.vy += (dy / d) * 120 * dt;
      }
    }
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    if (Math.abs(e.vx) > 2) e.side = e.vx < 0 ? -1 : 1;
    if (e.type === 'bat') e.alt = 14 + Math.sin(e.anim * 5 + e.phase) * 3;
    // soft body push with the goat (when not ramming)
    if (goat.ramT <= 0 && e.type === 'wolf') {
      const dx = e.x - goat.x, dy = e.y - goat.y;
      const d = len(dx, dy);
      if (d < 11 && d > 0.01) {
        const push = (11 - d);
        e.x += (dx / d) * push * 0.7;
        e.y += (dy / d) * push * 0.7;
        goat.x -= (dx / d) * push * 0.3;
        goat.y -= (dy / d) * push * 0.3;
      }
    }
  }
}

// Ram hitbox vs enemies
function checkRamHits() {
  if (goat.ramT <= 0) return;
  const hx = goat.x + goat.fx * 7;
  const hy = goat.y - 4 + goat.fy * 5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.state === 'launched' || e.state === 'emerge' || e.lastRam === goat.ramId) continue;
    const ey = e.y - (e.type === 'bat' ? Math.min(e.alt, 10) : 4);
    const d = len(e.x - hx, ey - hy);
    const reach = e.type === 'bat' ? 14 : 13;
    if (d > reach) continue;
    e.lastRam = goat.ramId;
    let dx = e.x - goat.x, dy = e.y - goat.y;
    const l = len(dx, dy) || 1;
    dx = dx / l * 0.5 + goat.fx * 0.8;
    dy = dy / l * 0.5 + goat.fy * 0.8;
    const l2 = len(dx, dy) || 1;
    dx /= l2; dy /= l2;
    e.hp--;
    e.flash = 0.15;
    impactBurst((e.x + goat.x) / 2 + goat.fx * 4, ey, e.type === 'bat' ? '#a03a6a' : '#6c7288');
    dust(e.x, e.y, 10, 4, 60);
    SFX.impact();
    shake = Math.max(shake, 5);
    hitStop = 0.06;
    if (e.carry) releaseCarried(e);
    if (e.hp <= 0) {
      e.state = 'launched';
      e.t = 0.38;
      e.vx = dx * 330 + rr(-30, 30);
      e.vy = dy * 330 + rr(-30, 30);
      e.spin = (rand() < 0.5 ? -1 : 1) * rr(14, 22);
      score++;
      addText(e.x, e.y - 22, score % 10 === 0 ? 'x' + score + '!' : '+1', '#fff3a8', score % 10 === 0);
    } else {
      e.state = 'stun';
      e.t = 1.5;
      e.vx = dx * 230;
      e.vy = dy * 230;
      addText(e.x, e.y - 22, 'STUNNED', '#ffd040', false);
      SFX.stun();
    }
    goat.vx *= 0.75;
    goat.vy *= 0.75;
  }
}

// ---------------------------------------------------------------------
// Waves
// ---------------------------------------------------------------------
function updateWaves(dt) {
  if (wave.banner > 0) wave.banner -= dt;
  if (wave.phase === 'intro') {
    wave.t -= dt;
    if (wave.t <= 0) wave.phase = 'active';
  } else if (wave.phase === 'active') {
    if (wave.toSpawn > 0) {
      wave.spawnT -= dt;
      if (wave.spawnT <= 0) {
        spawnEnemy();
        wave.toSpawn--;
        // occasional pack spawn on later waves
        if (wave.n >= 4 && wave.toSpawn > 0 && rand() < 0.25) { spawnEnemy(); wave.toSpawn--; }
        wave.spawnT = wave.interval * rr(0.7, 1.3);
      }
    } else if (enemies.length === 0) {
      wave.phase = 'clear';
      wave.t = 2.6;
      wave.banner = 2.4;
      wave.bannerText = 'WAVE ' + wave.n + ' CLEAR!';
      if (sheep.length > 0 && sheep.length < SHEEP_MAX) {
        const c = flockCenter();
        const p = edgePoint(-6);
        const s = makeSheep(p.x, p.y);
        s.vx = (c.x - p.x) * 0.3; s.vy = (c.y - p.y) * 0.3;
        sheep.push(s);
        s.flash = 1;
        wave.subText = 'A LOST LAMB RETURNS +1';
        addText(s.x, s.y - 16, '+1 SHEEP', '#9cff8a', false);
      } else {
        wave.subText = 'THE FLOCK IS SAFE... FOR NOW';
      }
      SFX.clear();
    }
  } else if (wave.phase === 'clear') {
    wave.t -= dt;
    if (wave.t <= 0) startWave(wave.n + 1);
  }
}
function flockCenter() {
  if (!sheep.length) return { x: FIELD_CX, y: FIELD_CY };
  let x = 0, y = 0;
  for (const s of sheep) { x += s.x; y += s.y; }
  return { x: x / sheep.length, y: y / sheep.length };
}

// ---------------------------------------------------------------------
// Fireflies (dusk ambience)
// ---------------------------------------------------------------------
function updateFireflies(dt) {
  const want = dayProgress > 0.55 ? Math.floor((dayProgress - 0.55) * 50) : 0;
  if (fireflies.length < want && rand() < dt * 3) {
    fireflies.push({ x: rr(FIELD.x0, FIELD.x1), y: rr(FIELD.y0 - 20, FIELD.y1 + 10), ph: rand() * 6.28, vx: rr(-6, 6), vy: rr(-4, 4), life: rr(4, 9) });
  }
  for (let i = fireflies.length - 1; i >= 0; i--) {
    const f = fireflies[i];
    f.life -= dt;
    f.ph += dt * 3;
    f.vx += rr(-20, 20) * dt;
    f.vy += rr(-20, 20) * dt;
    f.vx = clamp(f.vx, -10, 10); f.vy = clamp(f.vy, -8, 8);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.life <= 0 || fireflies.length > want + 4) fireflies.splice(i, 1);
  }
}

// ---------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------
function update(dt) {
  realTime += dt;
  dayProgress += (dayTarget - dayProgress) * Math.min(1, dt * 0.6);
  if (shake > 0) shake = Math.max(0, shake - dt * 18);

  if (state === 'MENU') {
    dayTarget = 0.18;
    updateSheep(dt);
    updateParticles(dt);
    updateFireflies(dt);
    return;
  }
  if (state === 'PLAYING') {
    if (paused) return;
    if (hitStop > 0) {
      hitStop -= dt;
      updateParticles(dt * 0.25);
      return;
    }
    gameTime += dt;
    updateGoat(dt);
    checkRamHits();
    updateSheep(dt);
    updateEnemies(dt);
    updateWaves(dt);
    updateParticles(dt);
    updateFireflies(dt);
    // game over: herd empty and nobody left to rescue
    const carrying = enemies.some(e => e.carry);
    if (sheep.length === 0 && !carrying) {
      gameOverDelay += dt;
      if (gameOverDelay > 1.2) {
        state = 'GAMEOVER';
        gameOverTime = realTime;
        if (score > best) {
          best = score;
          newBest = true;
          try { localStorage.setItem('goatGuardianBest', String(best)); } catch (e) { /* storage unavailable */ }
        }
        SFX.gameover();
      }
    } else {
      gameOverDelay = 0;
    }
    return;
  }
  if (state === 'GAMEOVER') {
    updateEnemies(dt);
    updateParticles(dt);
    updateFireflies(dt);
  }
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
function sheepSprite(s) {
  if (s.panic > 0) return (Math.floor(s.walk / 4) % 2 === 0) ? SPR.sheepPanic : SPR.sheepWalk;
  if (s.grazing) return (Math.floor(s.chew * 4) % 2 === 0) ? SPR.sheepGrazeA : SPR.sheepGrazeB;
  if (len(s.vx, s.vy) > 5) return (Math.floor(s.walk / 4) % 2 === 0) ? SPR.sheepIdle : SPR.sheepWalk;
  return SPR.sheepIdle;
}
function drawSheep(s) {
  const spr = sheepSprite(s);
  const bob = (!s.grazing && s.panic <= 0 && len(s.vx, s.vy) < 5) ? (Math.sin(realTime * 2 + s.bob) > 0.85 ? -1 : 0) : 0;
  const flash = s.flash > 0 && Math.floor(s.flash * 12) % 2 === 0;
  drawSpr(spr, s.x, s.y + bob, s.side < 0, flash);
  if (s.panic > 0 && Math.floor(realTime * 6 + s.bob) % 2 === 0) {
    // sweat drop / alarm mark
    ctx.fillStyle = '#ffffff';
    const ex = Math.round(s.x + (s.side < 0 ? -4 : 4));
    const ey = Math.round(s.y - 14);
    ctx.fillRect(ex, ey, 1, 3);
    ctx.fillRect(ex, ey + 4, 1, 1);
  }
}
function drawGoat() {
  let spr;
  if (goat.ramT > 0) spr = SPR.goatRam;
  else if (len(goat.vx, goat.vy) > 8) spr = (Math.floor(goat.walk / 6) % 2 === 0) ? SPR.goatA : SPR.goatB;
  else spr = SPR.goatA;
  const bob = (goat.ramT <= 0 && len(goat.vx, goat.vy) > 8 && Math.floor(goat.walk / 6) % 2 === 1) ? -1 : 0;
  // charge streaks
  if (goat.ramT > 0) {
    ctx.fillStyle = 'rgba(255,250,220,0.55)';
    for (let i = 1; i <= 3; i++) {
      const tx = goat.x - goat.fx * i * 7;
      const ty = goat.y - 7 - goat.fy * i * 7;
      ctx.fillRect(Math.round(tx - 3 + i), Math.round(ty) + (i % 2) * 3, 6 - i, 1);
    }
  }
  drawSpr(spr, goat.x, goat.y + bob, goat.side < 0, false);
  // personal ram cooldown pip-bar
  if (goat.cd > 0 && state === 'PLAYING') {
    const w = 14;
    const f = 1 - goat.cd / RAM_COOLDOWN;
    const x = Math.round(goat.x - w / 2), y = Math.round(goat.y + 3);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - 1, y - 1, w + 2, 3);
    ctx.fillStyle = '#ffb040';
    ctx.fillRect(x, y, Math.round(w * f), 1);
  }
}
function drawEnemy(e) {
  if (e.state === 'emerge') return;
  let spr;
  if (e.type === 'bat') spr = (Math.floor(e.anim * 10) % 2 === 0) ? SPR.batUp : SPR.batDown;
  else {
    const fast = len(e.vx, e.vy) > 10 && e.state !== 'stun';
    const f = fast ? Math.floor(e.anim * 10) % 2 : 0;
    spr = e.alpha ? (f ? SPR.alphaB : SPR.alphaA) : (f ? SPR.wolfB : SPR.wolfA);
  }
  const flash = e.flash > 0;
  const y = e.y - e.alt;
  if (e.state === 'launched') {
    ctx.save();
    ctx.translate(Math.round(e.x), Math.round(y - spr.h / 2));
    ctx.rotate(e.rot);
    const img = flash || Math.floor(e.t * 20) % 2 === 0 ? (e.side < 0 ? spr.wl : spr.wr) : (e.side < 0 ? spr.l : spr.r);
    ctx.drawImage(img, -Math.round(spr.w / 2), -Math.round(spr.h / 2));
    ctx.restore();
    return;
  }
  // carried sheep
  if (e.carry && e.type === 'bat') {
    const s = SPR.sheepPanic;
    drawSpr(s, e.x, y + s.h - 2 + Math.sin(e.anim * 8) * 1, e.side < 0, false);
  }
  const stunWobble = e.state === 'stun' ? Math.round(Math.sin(e.anim * 30)) : 0;
  drawSpr(spr, e.x + stunWobble, y, e.side < 0, flash);
  if (e.carry && e.type === 'wolf') {
    drawSpr(SPR.sheepPanic, e.x + e.side * 12, y + 1, e.side < 0, false);
  }
  if (e.state === 'stun') {
    // orbiting stars
    for (let k = 0; k < 3; k++) {
      const a = e.anim * 6 + k * 2.094;
      const sx = Math.round(e.x + Math.cos(a) * 7);
      const sy = Math.round(y - spr.h - 3 + Math.sin(a) * 2);
      ctx.fillStyle = '#ffe060';
      ctx.fillRect(sx, sy, 1, 1);
      ctx.fillRect(sx - 1, sy, 3, 1);
      ctx.fillRect(sx, sy - 1, 1, 3);
    }
  }
  if (e.alpha && e.state !== 'stun' && e.hp > 1) {
    // alpha marker: glowing mane pixels
    if (Math.floor(realTime * 4) % 2 === 0) {
      ctx.fillStyle = '#ffd040';
      ctx.fillRect(Math.round(e.x - e.side * 2), Math.round(y - spr.h - 2), 1, 1);
    }
  }
}
function drawEmergeEyes() {
  for (const e of enemies) {
    if (e.state !== 'emerge') continue;
    const blink = Math.floor(e.t * 10) % 4 !== 0;
    if (!blink) continue;
    ctx.fillStyle = e.alpha ? '#ffd040' : '#ff3434';
    const x = Math.round(e.x), y = Math.round(e.y - 6);
    ctx.fillRect(x - 2, y, 2, 1);
    ctx.fillRect(x + 1, y, 2, 1);
    ctx.fillStyle = 'rgba(255,60,60,0.25)';
    ctx.fillRect(x - 3, y - 1, 7, 3);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'ring') {
      const r = lerp(p.r1, p.r0, a);
      ctx.fillStyle = p.col;
      ctx.globalAlpha = a;
      const n = Math.max(10, Math.floor(r * 3));
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2;
        ctx.fillRect(Math.round(p.x + Math.cos(ang) * r), Math.round(p.y + Math.sin(ang) * r * 0.6), 1, 1);
      }
      ctx.globalAlpha = 1;
    } else if (p.kind === 'flash') {
      const r = Math.round(lerp(p.r1, p.r0, a));
      ctx.fillStyle = p.col;
      ctx.globalAlpha = a;
      ctx.fillRect(Math.round(p.x - r), Math.round(p.y - 1), r * 2, 3);
      ctx.fillRect(Math.round(p.x - 1), Math.round(p.y - r), 3, r * 2);
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = p.kind === 'spark' ? 1 : Math.min(1, a * 1.6);
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      if (p.kind === 'spark' && p.px !== undefined) {
        ctx.globalAlpha = 0.5;
        ctx.fillRect(Math.round((p.x + p.px) / 2), Math.round((p.y + p.py) / 2), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }
}
function drawWorld() {
  ctx.drawImage(bgCanvas, 0, 0);
  // shadows
  for (const s of sheep) drawShadow(s.x, s.y, 12);
  for (const e of enemies) {
    if (e.state === 'emerge') continue;
    drawShadow(e.x, e.y, e.type === 'bat' ? 8 : 16);
  }
  drawShadow(goat.x, goat.y, 15);

  // depth-sorted ground entities
  const list = [];
  for (const s of sheep) list.push({ y: s.y, kind: 0, o: s });
  for (const e of enemies) if (e.type === 'wolf' || e.state === 'launched') list.push({ y: e.y, kind: 1, o: e });
  list.push({ y: goat.y, kind: 2, o: goat });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.kind === 0) drawSheep(it.o);
    else if (it.kind === 1) drawEnemy(it.o);
    else drawGoat();
  }
  // foreground tree band
  ctx.drawImage(fgCanvas, 0, 0);
  drawEmergeEyes();
  // flying enemies above everything
  for (const e of enemies) if (e.type === 'bat' && e.state !== 'launched') drawEnemy(e);
  drawParticles();
  for (const t of texts) {
    const a = t.life / t.max;
    if (a < 0.3 && Math.floor(t.life * 20) % 2 === 0) continue;
    drawText(t.str, t.x, t.y, t.col, { s: t.s, align: 'center', outline: '#1a1010' });
  }
}
function applyDayTint() {
  const tint = tintAt(dayProgress);
  if (dayProgress > 0.01) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgb(' + tint.c[0] + ',' + tint.c[1] + ',' + tint.c[2] + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(W * 0.85, -20, 10, W * 0.85, -20, W * 0.9);
    g.addColorStop(0, 'rgba(' + tint.glow[0] + ',' + tint.glow[1] + ',' + tint.glow[2] + ',' + (tint.ga * 2.2).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + tint.glow[0] + ',' + tint.glow[1] + ',' + tint.glow[2] + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    if (dayProgress > 0.4) {
      ctx.globalAlpha = clamp((dayProgress - 0.4) * 0.9, 0, 0.55);
      ctx.drawImage(vignetteCanvas, 0, 0);
      ctx.globalAlpha = 1;
    }
  }
  // fireflies glow on top of tint
  if (fireflies.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const f of fireflies) {
      const b = 0.5 + 0.5 * Math.sin(f.ph);
      if (b < 0.2) continue;
      ctx.fillStyle = 'rgba(200,255,120,' + (b * 0.35).toFixed(3) + ')';
      ctx.fillRect(Math.round(f.x) - 1, Math.round(f.y) - 1, 3, 3);
      ctx.fillStyle = 'rgba(240,255,170,' + b.toFixed(3) + ')';
      ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

}
function drawGameOver() {
  const t = realTime - gameOverTime;
  ctx.fillStyle = 'rgba(20,4,12,' + Math.min(0.62, t * 0.8).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
  if (t < 0.3) return;
  drawText('THE FLOCK', W / 2, 40, '#ffe0d0', { s: 4, align: 'center', outline: '#2a0a10' });
  drawText('IS LOST', W / 2, 66, '#ff7a6a', { s: 4, align: 'center', outline: '#2a0a10' });
  const bx = W / 2 - 90, by = 100;
  drawPanel(bx, by, 180, 64);
  drawText('ENEMIES RAMMED', bx + 12, by + 10, '#c8b890', {});
  drawText(String(score), bx + 168, by + 10, '#fff3a8', { align: 'right' });
  drawText('WAVES REACHED', bx + 12, by + 22, '#c8b890', {});
  drawText(String(wave.n), bx + 168, by + 22, '#ffffff', { align: 'right' });
  drawText('SHEEP RESCUED', bx + 12, by + 34, '#c8b890', {});
  drawText(String(rescued), bx + 168, by + 34, '#9cff8a', { align: 'right' });
  drawText('BEST SCORE', bx + 12, by + 46, '#c8b890', {});
  drawText(String(best), bx + 168, by + 46, '#ffd27a', { align: 'right' });
  drawText('FINAL SCORE ' + score, W / 2, 176, '#ffffff', { s: 2, align: 'center', outline: '#2a0a10' });
  if (newBest && Math.floor(realTime * 4) % 2 === 0) drawText('NEW BEST!', W / 2, 196, '#ffe060', { align: 'center', outline: '#2a0a10' });
  if (t > 0.9 && Math.floor(realTime * 2) % 2 === 0) {
    drawText(touch.used ? 'TAP TO PLAY AGAIN' : 'PRESS R OR SPACE TO RESTART', W / 2, 216, '#ffffff', { s: 1, align: 'center', outline: '#2a0a10' });
  }
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);
  drawText('PAUSED', W / 2, 110, '#ffffff', { s: 4, align: 'center', outline: '#000' });
  drawText(touch.used ? 'TAP TO RESUME' : 'PRESS P OR SPACE TO RESUME', W / 2, 140, '#ffe98a', { align: 'center', outline: '#000' });
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#10261f';
  ctx.fillRect(0, 0, W, H);
  const sx = shake > 0 ? Math.round(rr(-shake, shake)) : 0;
  const sy = shake > 0 ? Math.round(rr(-shake, shake)) : 0;
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  drawWorld();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  applyDayTint();
  if (state === 'PLAYING') {
    drawHUD();
    if (paused) drawPause();
  } else if (state === 'MENU') {
    drawMenu();
  } else if (state === 'GAMEOVER') {
    drawHUD();
    drawGameOver();
  }
  // present
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.imageSmoothingEnabled = false;
  vctx.drawImage(buf, 0, 0, view.width, view.height);
}

// ---------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------
spawnHerd();
let lastTs = null;
function frame(ts) {
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
view.focus();
</script>
</body>
</html>
